  - id: web-amd64
    ids: [web]
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_LOWER }}/web:{{ .Version }}-amd64"
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_LOWER }}/web:latest-amd64"
    dockerfile: deploy/docker/release.Dockerfile
    use: buildx
    goos: linux
    goarch: amd64
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--build-arg=BINARY=web"
      - "--label=org.opencontainers.image.title=databus-web"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_REPOSITORY }}"
    extra_files:
      - migrations
      - config/config.example.yml

  - id: web-arm64
    ids: [web]
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_LOWER }}/web:{{ .Version }}-arm64"
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_LOWER }}/web:latest-arm64"
    dockerfile: deploy/docker/release.Dockerfile
    use: buildx
    goos: linux
    goarch: arm64
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--build-arg=BINARY=web"
      - "--label=org.opencontainers.image.title=databus-web"
