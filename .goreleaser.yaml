docker_manifests:
  - name_template: "ghcr.io/{{ .Env.GITHUB_REPOSITORY_LOWER }}/receiver:{{ .Version }}"
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_LOWER }}/receiver:{{ .Version }}-amd64"
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_LOWER }}/receiver:{{ .Version }}-arm64"
  - name_template: "ghcr.io/{{ .Env.GITHUB_REPOSITORY_LOWER }}/receiver:latest"
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_LOWER }}/receiver:latest-amd64"
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_LOWER }}/receiver:latest-arm64"

  - name_template: "ghcr.io/{{ .Env.GITHUB_REPOSITORY_LOWER }}/sender:{{ .Version }}"
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_LOWER }}/sender:{{ .Version }}-amd64"
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_LOWER }}/sender:{{ .Version }}-arm64"
  - name_template: "ghcr.io/{{ .Env.GITHUB_REPOSITORY_LOWER }}/sender:latest"
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_LOWER }}/sender:latest-amd64"
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_LOWER }}/sender:latest-arm64"

  - name_template: "ghcr.io/{{ .Env.GITHUB_REPOSITORY_LOWER }}/web:{{ .Version }}"
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_LOWER }}/web:{{ .Version }}-amd64"
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_LOWER }}/web:{{ .Version }}-arm64"
  - name_template: "ghcr.io/{{ .Env.GITHUB_REPOSITORY_LOWER }}/web:latest"
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_LOWER }}/web:latest-amd64"
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_LOWER }}/web:latest-arm64"

release:
  github:
    owner: ""
    name: ""
  draft: true
  prerelease: auto
  name_template: "DataBus {{ .Version }}"
  header: |
    ## DataBus {{ .Version }}

    См. [CHANGELOG.md](CHANGELOG.md) — детальный список изменений по фазам;
    [specs/IMPLEMENTATION.md](specs/IMPLEMENTATION.md) — карта реализации с привязкой к разделам ТЗ;
    [README.md](README.md) — быстрый старт.

    Docker images: `ghcr.io/<owner>/<repo>/{receiver,sender,web}:{{ .Version }}` (multi-arch amd64+arm64).
  footer: |
    **Полный список изменений:** <https://github.com/{{ .Env.GITHUB_REPOSITORY }}/compare/{{ .PreviousTag }}...{{ .Tag }}>
