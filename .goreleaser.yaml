      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.source=https://github.com/{{ .Env.GITHUB_REPOSITORY }}"
    extra_files:
      - migrations
      - config/config.example.yml

  - id: sender-arm64
    ids: [sender]
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_LOWER }}/sender:{{ .Version }}-arm64"
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_LOWER }}/sender:latest-arm64"
    dockerfile: deploy/docker/release.Dockerfile
    use: buildx
    goos: linux
    goarch: arm64
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--build-arg=BINARY=sender"
      - "--label=org.opencontainers.image.title=databus-sender"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
