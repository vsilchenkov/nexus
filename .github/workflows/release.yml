name: Release

# Триггерится тегом v*. Создаёт GitHub release с бинарями (Linux/Win/macOS × amd64/arm64),
# publish'ит multi-arch docker images в GHCR (ghcr.io/<owner>/<repo>/{receiver,sender,web}).
#
# Запуск вручную: workflow_dispatch с `tag=vX.Y.Z`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.3)"
        required: true

permissions:
  contents: write   # для создания GitHub release + загрузки артефактов
  packages: write   # для пуша в ghcr.io
  id-token: write   # под cosign sign-in (если включить позже)

env:
  GO_VERSION: "1.25.7"

jobs:
  goreleaser:
    name: GoReleaser (binaries + docker)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up QEMU (multi-arch docker)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase repo name (для ghcr image-path)
        id: repo
        run: echo "lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_LOWER: ${{ steps.repo.outputs.lower }}
