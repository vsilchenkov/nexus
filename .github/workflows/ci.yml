name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master, dev]

# Отменяем устаревшие прогоны при новом push в ту же ветку — экономит CI-минуты.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26.3"
  NODE_VERSION: "20"

jobs:
  # ---------------- Backend: build + unit tests + lint ---------------------
  go-test:
    name: Go unit tests + race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go mod download
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go test -race -short
        run: go test -race -short ./...

  go-build:
    name: Go build (all binaries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # На Linux линкер не падает с OOM как на Windows, поэтому ./... без -ldflags.
      - name: go build ./...
        run: go build ./...

  go-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62
          args: --timeout=5m

  # ---------------- Swagger drift check (§11.2) ----------------------------
  swagger-drift:
    name: Swagger drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@v1.16.6
      - name: Regenerate docs
        run: |
          swag init -g cmd/web/main.go -o docs/web --parseDependency --parseDepth 2 --quiet
      - name: Check for drift
        run: |
          if ! git diff --quiet docs/; then
            echo "::error::swagger drift detected; run 'make swagger' locally and commit"
            git --no-pager diff --stat docs/
            exit 1
          fi

  # ---------------- Frontend: SPA build + lint -----------------------------
  ui:
    name: Web UI build + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web-ui/package-lock.json
      - name: npm ci
        run: npm ci
      - name: eslint
        run: npm run lint --if-present
      - name: vite build
        run: npm run build

  # ---------------- Integration suite (testcontainers) ---------------------
  # Тяжёлый job: PG + Redis + Kafka + ClickHouse через testcontainers.
  # Не блокирует обязательные проверки PR через required checks — допускается
  # запускать как «extended», но не как gate; см. README → CI policy.
  integration:
    name: Integration tests (testcontainers)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'run-integration')
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Pre-pull docker images (cached layers speed up testcontainers)
        run: |
          docker pull postgres:16-alpine
          docker pull redis:7-alpine
          docker pull confluentinc/confluent-local:7.5.0
          docker pull clickhouse/clickhouse-server:24-alpine
      - name: Run integration tests
        run: go test -tags=integration -timeout 20m -count=1 ./tests/integration/...
