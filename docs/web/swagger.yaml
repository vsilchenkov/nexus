      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.PublicSettingsResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Публичный адрес приложения (§28, Пункт 1).
      tags:
      - settings
  /api/settings/sentry/test:
    post:
      consumes:
      - application/json
      description: Создаёт изолированный sentry.Client, отправляет CaptureMessage,
        ждёт Flush. Глобальный hub не затрагивается. Возвращает {ok,latency_ms} или
        {ok:false,error}.
      parameters:
      - description: patch
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/nexus_internal_domain.SentrySettings'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nexus_internal_web_usecase.TestResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Отправить тестовое событие в Sentry с patch'ем настроек (§7.10).
      tags:
      - settings
  /api/teams:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ListTeamsResponse'
      security:
      - CookieAuth: []
      summary: Список команд (admin only).
      tags:
      - teams
    post:
      consumes:
      - application/json
      description: 'Атомарно: row в teams + CREATE DATABASE nexus_<slug>. ch_database
        вычисляется из slug. Creator → owner.'
      parameters:
      - description: slug + name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_web_adapter_in_http.createTeamRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.teamResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "409":
          description: slug or ch_database exists
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "503":
          description: ClickHouse unavailable
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Создать команду (admin only).
      tags:
      - teams
  /api/teams/{id}:
    delete:
      description: default-team удалить нельзя. ON DELETE RESTRICT на nodes — если
        в команде есть узлы, удаление вернёт 409. ClickHouse-БД остаётся как orphan
        (drop через UI «Orphans», Phase 10.D).
      parameters:
      - description: team id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "403":
          description: cannot delete default team
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "409":
          description: team has nodes
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Удалить команду (admin only).
      tags:
      - teams
    get:
      parameters:
      - description: team id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.teamResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Одна команда по id (admin only).
      tags:
      - teams
    put:
      consumes:
      - application/json
      description: Slug и ch_database immutable после создания.
      parameters:
      - description: team id
        in: path
        name: id
        required: true
        type: string
      - description: name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_web_adapter_in_http.updateTeamRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.teamResponse'
      security:
      - CookieAuth: []
      summary: Обновить имя команды (admin only).
      tags:
      - teams
  /api/teams/{id}/members:
    get:
      parameters:
      - description: team id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ListTeamMembersResponse'
      security:
      - CookieAuth: []
      summary: Список членов команды (admin only).
      tags:
      - teams
    post:
      consumes:
      - application/json
      description: Если membership уже есть — обновляется роль (UPSERT через ON CONFLICT).
      parameters:
      - description: team id
        in: path
        name: id
        required: true
        type: string
      - description: user_id + role
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_web_adapter_in_http.addMemberRequest'
      responses:
        "204":
          description: No Content
      security:
      - CookieAuth: []
      summary: Добавить пользователя в команду (admin only).
      tags:
      - teams
  /api/teams/{id}/members/{user_id}:
    delete:
      parameters:
      - description: team id
        in: path
        name: id
        required: true
        type: string
      - description: user id
        in: path
        name: user_id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - CookieAuth: []
      summary: Убрать пользователя из команды (admin only).
      tags:
      - teams
    put:
      consumes:
      - application/json
      parameters:
      - description: team id
        in: path
        name: id
        required: true
        type: string
      - description: user id
        in: path
        name: user_id
        required: true
        type: string
      - description: role
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_web_adapter_in_http.updateMemberRoleRequest'
      responses:
        "204":
          description: No Content
      security:
      - CookieAuth: []
      summary: Изменить роль пользователя в команде (admin only).
      tags:
      - teams
  /api/tokens:
    get:
      description: Каждый видит только свои токены. Возвращает префикс, scopes, last_used_at
        — без полной строки токена.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ListTokensResponse'
      security:
      - CookieAuth: []
      summary: Список API-токенов текущего пользователя (§7.14).
      tags:
      - tokens
    post:
      consumes:
      - application/json
      description: Plain-строка токена возвращается ровно один раз, потом доступен
        только префикс. Scopes — подмножество {logs:read, nodes:read, metrics:read,
        audit:read}.
      parameters:
      - description: name + scopes + expires_at
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_web_adapter_in_http.createTokenRequest'
      produces:
      - application/json
      responses:
        "201":
          description: token (plain) + info
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.CreateTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Создать API-токен (§7.14).
      tags:
      - tokens
  /api/tokens/{id}:
    delete:
      description: Удаление допустимо, только если токен уже revoked. Иначе — 404
        «not deletable yet».
      parameters:
      - description: token id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Удалить API-токен.
      tags:
      - tokens
  /api/tokens/{id}/revoke:
    post:
      description: После revoke токен сразу теряет силу, но сама запись остаётся (для
        аудита).
      parameters:
      - description: token id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Отозвать API-токен.
      tags:
      - tokens
  /api/users:
    get:
      parameters:
      - description: поиск по login или email
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ListUsersResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Список пользователей (admin only).
      tags:
      - users
    post:
      consumes:
      - application/json
      parameters:
      - description: user fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_web_adapter_in_http.createUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.userResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "409":
          description: login already exists
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Создать пользователя (admin only).
      tags:
      - users
  /api/users/{id}:
    delete:
      description: Нельзя удалить себя и нельзя оставить <1 активного admin (§7.9).
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Удалить пользователя (admin only).
      tags:
      - users
    get:
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.userResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Один пользователь по id (admin only).
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Нельзя демоутить себя в viewer и нельзя оставлять <1 активного
        admin (§7.9).
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: string
      - description: user fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_web_adapter_in_http.updateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.userResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "403":
          description: cannot demote yourself
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Обновить пользователя (admin only).
      tags:
      - users
  /api/users/{id}/default-team:
    put:
      consumes:
      - application/json
      description: |-
        Назначает default_team_id. team_id должен быть среди команд, в
        которых пользователь состоит (иначе 400) — сделать дефолтной чужую
        команду нельзя (§18.9 при входе перекинул бы по членству).
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: string
      - description: team id
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_web_adapter_in_http.setDefaultTeamRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: не член команды / битый запрос
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "404":
          description: пользователь не найден
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Сменить команду по умолчанию пользователя (admin only, §45).
      tags:
      - users
  /api/users/{id}/password:
    post:
      consumes:
      - application/json
      description: Если must_change_password=true, при следующем логине пользователь
        будет обязан задать новый пароль.
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: string
      - description: new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_web_adapter_in_http.changePasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Сменить пароль пользователя (admin only).
      tags:
      - users
  /api/version:
    get:
      description: 'Публичный read-only эндпоинт: версия Web Service + commit/build_date.
        Не требует авторизации. В dev (override_allowed) version может быть переопределена
        настройкой.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.VersionResponse'
      summary: Версия приложения (§30, §34.3).
      tags:
      - meta
schemes:
- http
- https
securityDefinitions:
  ApiTokenAuth:
    description: '"Bearer db_<32-байт-base64>". См. §7.14.'
    in: header
    name: Authorization
    type: apiKey
  CookieAuth:
    in: cookie
    name: nexus_session
    type: apiKey
swagger: "2.0"
