      elapsed_ms:
        type: integer
      error:
        type: string
      message_count:
        type: integer
      ok:
        type: boolean
    type: object
  nexus_internal_web_usecase.RMQChecks:
    properties:
      auth:
        $ref: '#/definitions/nexus_internal_web_usecase.RMQCheck'
      connect:
        $ref: '#/definitions/nexus_internal_web_usecase.RMQCheck'
      queue:
        $ref: '#/definitions/nexus_internal_web_usecase.RMQCheck'
    type: object
  nexus_internal_web_usecase.RMQTestResult:
    properties:
      checks:
        $ref: '#/definitions/nexus_internal_web_usecase.RMQChecks'
      ok:
        type: boolean
    type: object
  nexus_internal_web_usecase.ReplayBulkResult:
    properties:
      capped:
        type: boolean
      failed:
        description: ошибок replay (оригинал НЕ отменён — остаётся авто-репроцессору)
        type: integer
      replayed:
        description: пере-инжектировано (оригинал отменён в DLQ)
        type: integer
      total:
        description: уникальных неудачных найдено (в пределах cap)
        type: integer
    type: object
  nexus_internal_web_usecase.ReplayResult:
    properties:
      body_preview:
        type: string
      duration_ms:
        type: integer
      headers:
        additionalProperties:
          type: string
        type: object
      new_log_id:
        type: string
      status_code:
        type: integer
    type: object
  nexus_internal_web_usecase.TestResult:
    properties:
      error:
        type: string
      latency_ms:
        type: integer
      ok:
        type: boolean
    type: object
info:
  contact: {}
  description: |-
    Admin REST API шины данных (§7 ТЗ). Сессии в Redis +
    API-токены (Bearer db_*). SPA по embed.FS отдаётся
    фолбэком на index.html для всех путей не из /api/.
  title: Nexus Web API
  version: "1.0"
paths:
  /api/allowed-hosts:
    get:
      parameters:
      - description: поиск по паттерну и описанию
        in: query
        name: q
        type: string
      - description: 'фильтр по типу: exact|wildcard|regex'
        in: query
        name: kind
        type: string
      - description: лимит (по умолчанию 50)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ListHostsResponse'
      security:
      - CookieAuth: []
      summary: 'Каталог разрешённых хостов: поиск/листинг (§23).'
      tags:
      - allowed-hosts
    post:
      consumes:
      - application/json
      description: 'Идемпотентно по case-insensitive паттерну: повтор вернёт существующую
        запись.'
      parameters:
      - description: host
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_web_adapter_in_http.hostRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.hostResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Создать разрешённый хост (admin, §23).
      tags:
      - allowed-hosts
  /api/allowed-hosts/{id}:
    delete:
      description: Нельзя удалить хост, используемый узлами (409).
      parameters:
      - description: host id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Удалить разрешённый хост (admin, §23).
      tags:
      - allowed-hosts
    patch:
      consumes:
      - application/json
      description: Описание меняется всегда; паттерн/тип — только если хост не используется
        (usage_count=0).
      parameters:
      - description: host id
        in: path
        name: id
        required: true
        type: string
      - description: host
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_web_adapter_in_http.hostRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Изменить разрешённый хост (admin, §23).
      tags:
      - allowed-hosts
  /api/allowed-hosts/preview:
    post:
      consumes:
      - application/json
      parameters:
      - description: preview
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_web_adapter_in_http.hostPreviewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.HostPreviewResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: 'Превью паттерна: какие URL разрешит/заблокирует (§23).'
      tags:
      - allowed-hosts
  /api/audit:
    get:
      description: 'Поддерживаемые actions: node.create/update/delete, user.create/update/delete/password_changed,
        token.create/revoke/delete, login.success/failure, ch_table.drop, settings.update
        и др.'
      parameters:
      - description: фильтр по user_id
        in: query
        name: user_id
        type: string
      - description: одно значение action
        in: query
        name: action
        type: string
      - description: несколько action через запятую
        in: query
        name: actions
        type: string
      - description: node|user|token|ch_table|...
        in: query
        name: target_type
        type: string
      - description: фильтр по target_id
        in: query
        name: target_id
        type: string
      - description: RFC3339 (начало)
        in: query
        name: from
        type: string
      - description: RFC3339 (конец)
        in: query
        name: to
        type: string
      - description: default 100, max 1000
        in: query
        name: limit
        type: integer
      - description: смещение
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ListAuditResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      - ApiTokenAuth: []
      summary: Журнал audit-log (admin only, §7.13).
      tags:
      - audit
  /api/audit/export.csv:
    get:
      description: 'Тот же набор фильтров, что у /api/audit. Default limit 10000,
        max 50000. CSV в UTF-8 с BOM (для Excel), 9 колонок: id, created_at, user_login,
        user_id, action, target_type, target_id, ip_address, details (JSON).'
      parameters:
      - description: фильтр по user_id
        in: query
        name: user_id
        type: string
      - description: одно значение action
        in: query
        name: action
        type: string
      - description: несколько action через запятую
        in: query
        name: actions
        type: string
      - description: node|user|token|ch_table|...
        in: query
        name: target_type
        type: string
      - description: фильтр по target_id
        in: query
        name: target_id
        type: string
      - description: RFC3339 (начало)
        in: query
        name: from
        type: string
      - description: RFC3339 (конец)
        in: query
        name: to
        type: string
      - description: default 10000, max 50000
        in: query
        name: limit
        type: integer
      - description: смещение
        in: query
        name: offset
        type: integer
      produces:
      - text/csv
      responses:
        "200":
          description: CSV
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      - ApiTokenAuth: []
      summary: Выгрузка audit-log в CSV (admin only, §7.13).
      tags:
      - audit
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: При успехе ставит HttpOnly cookie nexus_session (§7.1 ТЗ).
      parameters:
      - description: credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_web_adapter_in_http.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.UserEnvelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "401":
          description: invalid credentials
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "403":
          description: user inactive
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "429":
          description: too many login attempts
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      summary: Логин по логину/паролю.
      tags:
      - auth
  /api/auth/logout:
    post:
      description: Удаляет session-cookie nexus_session и инвалидирует токен в Redis
        (§7.1 ТЗ).
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - CookieAuth: []
      summary: Завершить сессию.
      tags:
      - auth
  /api/auth/me:
    get:
      description: Возвращает user_id, login, email, role, lang и must_change_password.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.UserEnvelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      - ApiTokenAuth: []
      summary: Профиль текущей сессии.
      tags:
      - auth
  /api/ch-templates:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ListCHTemplatesResponse'
      security:
      - CookieAuth: []
      summary: Список шаблонов CH-таблиц (§19).
      tags:
      - ch-templates
    post:
      consumes:
      - application/json
      parameters:
      - description: template
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_web_adapter_in_http.chTemplateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.chTemplateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Создать шаблон CH-таблицы (admin, §19).
      tags:
      - ch-templates
  /api/ch-templates/{id}:
    delete:
      description: Нельзя удалить default или используемый узлами шаблон (409).
      parameters:
      - description: template id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Удалить шаблон CH-таблицы (admin, §19).
      tags:
      - ch-templates
    get:
      parameters:
      - description: template id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.chTemplateResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Один шаблон CH-таблицы по id (§19).
      tags:
      - ch-templates
    put:
      consumes:
      - application/json
      parameters:
      - description: template id
        in: path
        name: id
        required: true
        type: string
      - description: template
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_web_adapter_in_http.chTemplateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.chTemplateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Обновить шаблон CH-таблицы (admin, §19).
      tags:
      - ch-templates
  /api/ch-templates/verify:
    post:
      consumes:
      - application/json
      description: Статическая валидация + пробное создание временной таблицы в ClickHouse.
        Возвращает {ok} или {ok:false,error}.
      parameters:
      - description: template
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_web_adapter_in_http.chTemplateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.CHTemplateVerifyResponse'
        "503":
          description: clickhouse unavailable
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Проверить шаблон CH-таблицы (admin, §19.4).
      tags:
      - ch-templates
  /api/headers:
    get:
      parameters:
      - description: prefix поиска по имени; пусто = топ-используемые
        in: query
        name: q
        type: string
      - description: лимит (по умолчанию 20)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ListHeadersResponse'
      security:
      - CookieAuth: []
      summary: 'Справочник заголовков: автодополнение (§24).'
      tags:
      - headers
    post:
      consumes:
      - application/json
      description: 'Идемпотентно по case-insensitive имени: повтор вернёт существующую
        запись (200), а не ошибку.'
      parameters:
      - description: header
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_web_adapter_in_http.headerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.headerResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Создать заголовок в справочнике (admin, §24).
      tags:
      - headers
  /api/headers/{id}:
    delete:
      description: Нельзя удалить заголовок, используемый узлами (409).
      parameters:
      - description: header id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Удалить заголовок из справочника (admin, §24).
      tags:
      - headers
    patch:
      consumes:
      - application/json
      description: Описание меняется всегда; имя — только если заголовок не используется
        узлами (usage_count=0), иначе 409.
      parameters:
      - description: header id
        in: path
        name: id
        required: true
        type: string
      - description: header
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_web_adapter_in_http.headerRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Изменить заголовок справочника (admin, §24).
      tags:
      - headers
  /api/kafka/by-node:
    get:
      description: top_producers (по числу async-сообщений) и top_failures (по ошибкам)
        из Prometheus (метка node). Admin-only.
      parameters:
      - description: 1h | 3h | 24h | 7d | 14d | 30d (default 1h)
        in: query
        name: range
        type: string
      - description: период с
        in: query
        name: from
        type: string
      - description: период по
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.KafkaByNodeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Топ-узлы по нагрузке и ошибкам за период (§4.4 spec).
      tags:
      - kafka
  /api/kafka/overview:
    get:
      description: KPI produced/consumed/failed/lag/in-flight, дельта к предыдущему
        периоду, broker_health и severity health-banner. Источники деградируют (флаги
        *_available). Admin-only, rate-limit 60/мин.
      parameters:
      - description: 1h | 3h | 24h | 7d | 14d | 30d (default 1h)
        in: query
        name: range
        type: string
      - description: период с (RFC3339 или UnixMilli); вместе с to — произвольный
          период (≤90д)
        in: query
        name: from
        type: string
      - description: период по (RFC3339 или UnixMilli)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.kafkaOverviewDTO'
        "400":
          description: период длиннее 90 дней
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Сводка экрана мониторинга Kafka за период (§4.1 spec).
      tags:
      - kafka
  /api/kafka/test:
    post:
      description: Подключение + Metadata к каждому брокеру, время отклика и предупреждения.
        Admin-only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.KafkaTestResponse'
      security:
      - CookieAuth: []
      summary: Ping брокеров кластера (§4.5 spec).
      tags:
      - kafka
  /api/kafka/timeseries:
    get:
      description: produced/consumed/errors (rate, сообщений/сек) и lag (абсолют)
        через Prometheus query_range. Шаг авто по периоду или явный (step). Admin-only.
      parameters:
      - description: 1h | 3h | 24h | 7d | 14d | 30d (default 1h)
        in: query
        name: range
        type: string
      - description: период с (RFC3339 или UnixMilli)
        in: query
        name: from
        type: string
      - description: период по
        in: query
        name: to
        type: string
      - description: auto | 10s | 30s | 1m | 5m | 1h (default auto)
        in: query
        name: step
        type: string
      - description: CSV из produced,consumed,errors,lag (default все)
        in: query
        name: metrics
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.kafkaTimeseriesDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Временные ряды Kafka-графиков за период (§4.2 spec).
      tags:
      - kafka
  /api/kafka/topics:
    get:
      description: Партиции, RF, оценка числа сообщений, consumer-группы с lag, состояние
        реплик. Размер на диске недоступен (best-effort, 0). Кеш Redis 30с. Admin-only.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.KafkaTopicsResponse'
      security:
      - CookieAuth: []
      summary: Список топиков кластера (§4.3 spec).
      tags:
      - kafka
  /api/logs:
    get:
      description: Свежие записи slog-логов Receiver/Sender/Web из Redis-колец nexus:logs:*,
        слитые по времени (новые первыми). Это логи самих сервисов, не логи запросов
        узлов.
      parameters:
      - description: all (дефолт) | csv из receiver,sender,web
        in: query
        name: service
        type: string
      - description: максимум записей (дефолт 500, кап 2000)
        in: query
        name: limit
        type: integer
      - description: 'минимальный уровень: debug|info|warn|error'
        in: query
        name: min_level
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/nexus_internal_domain.ServiceLogEntry'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Хвост служебных логов сервисов (§51.5).
      tags:
      - service-logs
  /api/logs/{id}/replay:
    post:
      consumes:
      - application/json
      description: Берёт оригинал из ClickHouse-лога, применяет переопределения, отправляет
        через Receiver.
      parameters:
      - description: log id (UUID v4)
        in: path
        name: id
        required: true
        type: string
      - description: опции
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_web_adapter_in_http.ReplayRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nexus_internal_web_usecase.ReplayResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "409":
          description: node disabled
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "422":
          description: original body not logged — provide manually
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "429":
          description: rate limit exceeded
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Повторно отправить запрос через шину (§7.4.1).
      tags:
      - logs
  /api/logs/download:
    get:
      description: Тот же хвост, что GET /api/logs, но text/plain attachment (nexus-logs-<ts>.log),
        строки в хронологическом порядке.
      parameters:
      - description: all (дефолт) | csv из receiver,sender,web
        in: query
        name: service
        type: string
      - description: максимум записей (дефолт 500, кап 2000)
        in: query
        name: limit
        type: integer
      - description: 'минимальный уровень: debug|info|warn|error'
        in: query
        name: min_level
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: лог-файл
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Скачать служебные логи файлом (§51.5).
      tags:
      - service-logs
  /api/me/favorite-teams:
    put:
      consumes:
      - application/json
