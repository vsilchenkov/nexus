        Cancelled = число удалённых. Admin-only.
      parameters:
      - description: node id
        in: path
        name: id
        required: true
        type: string
      - description: период (пусто = всё)
        in: body
        name: body
        schema:
          $ref: '#/definitions/internal_web_adapter_in_http.queuePurgeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.queuePurgeDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Очистить «Неудачные доставки» узла за период или целиком (§35/§36).
      tags:
      - async-queue
  /api/nodes/{id}/async-queue/replay-failed:
    post:
      consumes:
      - application/json
      description: Пере-инжектирует через Receiver все неудачные (done=0) запросы
        узла за период и отменяет их оригиналы в DLQ (без двойной доставки). Пустые
        from/to = всё. Admin-only.
      parameters:
      - description: node id
        in: path
        name: id
        required: true
        type: string
      - description: период (пусто = всё)
        in: body
        name: body
        schema:
          $ref: '#/definitions/internal_web_adapter_in_http.queuePurgeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nexus_internal_web_usecase.ReplayBulkResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "409":
          description: node disabled
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "429":
          description: rate limit exceeded
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Повторить все неудачные доставки узла сейчас (§36.11).
      tags:
      - async-queue
  /api/nodes/{id}/log/{logId}:
    get:
      description: Тела грузятся лениво по клику на строку — списки (List/Stream)
        их не возвращают, чтобы snapshot из сотен строк с большими JSON не вешал фронт
        (§7.4.1).
      parameters:
      - description: node id
        in: path
        name: id
        required: true
        type: string
      - description: log record id
        in: path
        name: logId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.LogRecordDTO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      - ApiTokenAuth: []
      summary: Одна запись лога целиком (с телами request/response).
      tags:
      - logs
  /api/nodes/{id}/log/{logId}/body:
    get:
      description: 'Для постраничной подгрузки «показать весь»: возвращает срез тела
        и его полную длину в рунах. which обязателен (request|response); offset/limit
        — в рунах (limit капится).'
      parameters:
      - description: node id
        in: path
        name: id
        required: true
        type: string
      - description: log record id
        in: path
        name: logId
        required: true
        type: string
      - description: request | response
        in: query
        name: which
        required: true
        type: string
      - description: смещение в рунах (default 0)
        in: query
        name: offset
        type: integer
      - description: сколько рун вернуть (default 65536, max 4194304)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.LogBodyChunkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      - ApiTokenAuth: []
      summary: Срез тела (request|response) одной записи лога по рунам (§42).
      tags:
      - logs
  /api/nodes/{id}/log/{logId}/body/download:
    get:
      description: Стримит полное тело как text/plain attachment, нарезая по рунам
        — память на сервере ограничена размером среза. which обязателен.
      parameters:
      - description: node id
        in: path
        name: id
        required: true
        type: string
      - description: log record id
        in: path
        name: logId
        required: true
        type: string
      - description: request | response
        in: query
        name: which
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: body stream
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      - ApiTokenAuth: []
      summary: Скачать тело (request|response) записи лога целиком файлом (§42).
      tags:
      - logs
  /api/nodes/{id}/logs:
    get:
      parameters:
      - description: node id
        in: path
        name: id
        required: true
        type: string
      - description: legacy cursor по date_request (UnixMilli); если задан — фильтры
          from/to/ip/host/status/done/q игнорируются
        in: query
        name: since_ms
        type: integer
      - description: 1..500, default 100
        in: query
        name: limit
        type: integer
      - description: начало диапазона (RFC3339 или UnixMilli)
        in: query
        name: from
        type: string
      - description: конец диапазона (RFC3339 или UnixMilli); для keyset-пагинации
          — date_request самой старой загруженной строки
        in: query
        name: to
        type: string
      - description: 'тай-брейкер keyset-пагинации: id самой старой загруженной строки
          (вместе с to — строгий курсор по плотным секундам)'
        in: query
        name: before_id
        type: string
      - description: exact match по IP клиента (с §48 недоступно из UI, параметр API
          сохранён)
        in: query
        name: ip
        type: string
      - description: exact match по Host (с §48 недоступно из UI, параметр API сохранён)
        in: query
        name: host
        type: string
      - description: ok | err | (пусто)
        in: query
        name: status
        type: string
      - description: yes | no | (пусто)
        in: query
        name: done
        type: string
      - description: exact match по подпути запроса (колонка method, §39/§48)
        in: query
        name: method
        type: string
      - description: 'поиск по url/parameters/request/response (§48.1): & — И, | —
          ИЛИ, -терм — НЕ, префиксы url:/params:/req:/resp: скоупят на колонку, \\
          экранирует спецсимволы; в regex-режиме весь q — одно RE2'
        in: query
        name: q
        type: string
      - description: 1/true — с учётом регистра (§48.2)
        in: query
        name: q_case
        type: boolean
      - description: 1/true — только целое слово (§48.2)
        in: query
        name: q_word
        type: boolean
      - description: 1/true — q как RE2-выражение, мини-язык отключён (§48.2)
        in: query
        name: q_regex
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ListLogsResponse'
        "400":
          description: невалидный поисковый запрос (синтаксис/regex)
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      - ApiTokenAuth: []
      summary: Snapshot логов узла из ClickHouse с фильтрами.
      tags:
      - logs
  /api/nodes/{id}/logs/date-range:
    get:
      description: Фасет для ограничения полей дат фильтра (атрибуты min/max). Дёргается
        лениво при фокусе поля даты — всегда свежие данные (логи прибывают, пока страница
        открыта). Нет записей → min_ms=0, max_ms=0 (ограничения не ставятся). Деградация
        как у /logs/methods.
      parameters:
      - description: node id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.LogDateRangeResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      - ApiTokenAuth: []
      summary: Диапазон дат логов узла (min/max date_request, UnixMilli) (§48.3).
      tags:
      - logs
  /api/nodes/{id}/logs/failed-count:
    get:
      description: Дешёвый count из ClickHouse для KPI «неудачные доставки» на вкладке
        «Очередь». Узел без clickhouse_table → 200 + logs_configured=false, count=0.
      parameters:
      - description: node id
        in: path
        name: id
        required: true
        type: string
      - description: начало диапазона (RFC3339 или UnixMilli)
        in: query
        name: from
        type: string
      - description: конец диапазона
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.FailedCountResponse'
      security:
      - CookieAuth: []
      - ApiTokenAuth: []
      summary: Число недоставленных записей узла (done=0) за период (§35).
      tags:
      - logs
  /api/nodes/{id}/logs/methods:
    get:
      description: DISTINCT по колонке method (подпуть запроса, §39) для дропдауна
        Method. Дёргается лениво при открытии списка — всегда свежие данные. До 200
        значений, отсортированы. Узел без clickhouse_table → 200 + logs_configured=false;
        CH недоступен → 200 + logs_available=false.
      parameters:
      - description: node id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.LogMethodsResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      - ApiTokenAuth: []
      summary: Уникальные значения method узла для фасета фильтра (§48.3).
      tags:
      - logs
  /api/nodes/{id}/logs/stream:
    get:
      description: Доступно только UI-сессиям (API-токены отклоняются — §7.14). Каждое
        новое событие приходит как SSE event "log". Принимает те же фильтры, что и
        List (q/q_case/q_word/q_regex/method/status/done/ip/host, §48); термы по телам
        request/response в live не матчатся — тела в потоке не читаются (§48.6). Невалидный
        q → SSE event "error".
      parameters:
      - description: node id
        in: path
        name: id
        required: true
        type: string
      - description: exact match по подпути запроса (§48)
        in: query
        name: method
        type: string
      - description: поисковое выражение (§48.1); в live ищет по url+parameters
        in: query
        name: q
        type: string
      - description: 1/true — с учётом регистра
        in: query
        name: q_case
        type: boolean
      - description: 1/true — только целое слово
        in: query
        name: q_word
        type: boolean
      - description: 1/true — q как RE2
        in: query
        name: q_regex
        type: boolean
      produces:
      - text/event-stream
      responses:
        "200":
          description: event-stream
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: SSE live-tail логов узла (§7.4).
      tags:
      - logs
  /api/nodes/{id}/move:
    post:
      consumes:
      - application/json
      description: Меняет team_id узла и переносит ClickHouse-таблицу логов (RENAME
        TABLE, best-effort). Конфликт пути в целевой команде → 409.
      parameters:
      - description: node id
        in: path
        name: id
        required: true
        type: string
      - description: target team slug
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_web_adapter_in_http.MoveNodeRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "403":
          description: same team / not allowed
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "404":
          description: node or target team not found
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "409":
          description: path already exists in target team
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Перенести узел в другую команду (admin only, multi-tenancy v2).
      tags:
      - nodes
  /api/nodes/{id}/status:
    patch:
      consumes:
      - application/json
      description: Лёгкая замена полного PUT для кнопок «Пауза»/«Отключить». manager+.
        Меняет лишь status, не трогая прочие поля/креды.
      parameters:
      - description: node id
        in: path
        name: id
        required: true
        type: string
      - description: enabled | paused | disabled
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_web_adapter_in_http.UpdateNodeStatusRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Сменить только статус узла (§35).
      tags:
      - nodes
  /api/nodes/dry-run:
    post:
      consumes:
      - application/json
      description: Прогоняет synthetic-запрос через pipeline шины и возвращает пошаговый
        отчёт.
      parameters:
      - description: node + sub-request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_web_adapter_in_http.DryRunRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nexus_internal_web_usecase.DryRunReport'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: 'Dry-run: проверить конфиг узла без сохранения (§7.5.1).'
      tags:
      - nodes
  /api/nodes/test-rmq:
    post:
      consumes:
      - application/json
      description: 'Реальный AMQP-handshake: TCP-connect, auth, passive queue.declare.
        Не создаёт очередь и не забирает сообщения. Всегда 200; OK=false при любом
        проваленном шаге (диагностика, не функциональный вызов). Доступно manager+,
        rate-limit 10/мин на пользователя.'
      parameters:
      - description: RabbitMQ connection params
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_web_adapter_in_http.testRMQRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nexus_internal_web_usecase.RMQTestResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "429":
          description: rate limit exceeded
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Проверить подключение к RabbitMQ (§27.8).
      tags:
      - nodes
  /api/request-fields:
    get:
      parameters:
      - description: prefix поиска по имени; пусто = топ-используемые
