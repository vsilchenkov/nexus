            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      - ApiTokenAuth: []
      summary: Один узел по id.
      tags:
      - nodes
    put:
      consumes:
      - application/json
      description: Только admin. Пустые auth_credentials/incoming_auth_credentials
        в body означают «оставить старое значение» (§5.5 ТЗ).
      parameters:
      - description: node id
        in: path
        name: id
        required: true
        type: string
      - description: node config
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_web_adapter_in_http.UpdateNodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.NodeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "409":
          description: path already exists
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Обновить узел.
      tags:
      - nodes
  /api/nodes/{id}/allowed-hosts:
    get:
