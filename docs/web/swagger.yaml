        maxLength: 2000
        type: string
      dlq_retry_delay_seconds:
        maximum: 86400
        minimum: 1
        type: integer
      dlq_ttl_seconds:
        maximum: 2592000
        minimum: 60
        type: integer
      forward_headers:
        items:
          type: string
        type: array
      incoming_auth_credentials:
        maxLength: 1024
        type: string
      incoming_auth_dynamic_field:
        maxLength: 64
        type: string
