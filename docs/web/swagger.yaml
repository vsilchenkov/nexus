            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "403":
          description: user is not a member of this team
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
