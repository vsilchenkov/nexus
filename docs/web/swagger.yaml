          сохраняет текущее поведение) от явного false (§22).
        type: boolean
      max_body_size:
        maximum: 10000000
        minimum: 0
        type: integer
      max_body_size_enabled:
        type: boolean
      outgoing_method:
        enum:
        - GET
        - POST
        - PUT
        - DELETE
        - ANY
        type: string
      path:
        maxLength: 255
        type: string
      path_passthrough:
        description: '§39: path-passthrough — приклеивать хвост входящего пути к target
          URL.'
        type: boolean
      pull_batch_size:
        maximum: 1000
        minimum: 1
        type: integer
      pull_interval_sec:
        maximum: 3600
        minimum: 1
        type: integer
      pull_prefetch:
        maximum: 1000
        minimum: 1
        type: integer
      retry_backoff_ms:
        type: integer
      retry_count:
        type: integer
      rmq_host:
        description: |-
          §27: RabbitMQAsync. RMQPassword пустой в PUT = «оставить старый» (как
          auth_credentials, разбирается в handler.Update). Диапазоны pull_* также
          проверяет domain.Node.Validate и БД-constraint chk_rmq_fields.
        maxLength: 253
        type: string
      rmq_password:
        maxLength: 1024
        type: string
      rmq_port:
        maximum: 65535
        minimum: 1
        type: integer
      rmq_queue:
        maxLength: 255
        type: string
      rmq_use_tls:
        type: boolean
      rmq_user:
        maxLength: 255
        type: string
      rmq_vhost:
        maxLength: 255
        type: string
      root_method:
        enum:
        - request
        - requestAsync
        - RabbitMQAsync
        type: string
      status:
        enum:
        - enabled
        - disabled
        - paused
        type: string
      target_url:
        maxLength: 2048
        type: string
      timeout_ms:
        type: integer
      url_allowed_hosts:
        items:
          type: string
        type: array
      url_mode:
        enum:
        - static
        - from_request
        type: string
      url_param_name:
        maxLength: 64
        type: string
      webhook_signature_header:
        maxLength: 128
        type: string
      webhook_signature_prefix:
        maxLength: 64
        type: string
