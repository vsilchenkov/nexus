            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Заменить список избранных команд текущего пользователя.
      tags:
      - auth
  /api/me/password:
    post:
      consumes:
      - application/json
      description: Требует подтверждения текущего пароля; userID берётся из сессии
        (§26). Все сессии пользователя завершаются (forced re-login).
      parameters:
