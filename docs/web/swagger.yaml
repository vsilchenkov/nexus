          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.requestFieldResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Создать поле запроса в справочнике (manager, §41).
      tags:
      - request-fields
  /api/settings/app:
    get:
      description: Возвращает merge'нутые значения из БД. Секреты (DSN, password)
        маскируются.
      produces:
      - application/json
      responses:
        "200":
          description: OK
