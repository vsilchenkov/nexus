        "401":
          description: current password incorrect
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Сменить собственный пароль (self-service).
      tags:
      - auth
  /api/me/switch-team:
    post:
      consumes:
      - application/json
      description: Multi-tenancy v2. team_id должен быть из списка GET /api/me/teams.
      parameters:
      - description: team_id
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_web_adapter_in_http.switchTeamRequest'
      produces:
      - application/json
