      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Привязать хост к узлу (admin, §23).
      tags:
      - allowed-hosts
  /api/nodes/{id}/allowed-hosts/{host_id}:
    delete:
      parameters:
      - description: node id
        in: path
        name: id
        required: true
        type: string
      - description: host id
        in: path
        name: host_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Отвязать хост от узла (admin, §23).
      tags:
      - allowed-hosts
  /api/nodes/{id}/async-queue/messages:
    get:
      description: Метаданные сообщений (без тела, как в логах). Тело тянется лениво
        через .../messages/body. Admin-only.
      parameters:
      - description: node id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.queueListDTO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Первые 50 сообщений async-очереди узла (§34.4).
      tags:
      - async-queue
  /api/nodes/{id}/async-queue/messages/{msgId}:
    delete:
      description: 'Логическое удаление через cancel-set: Sender пропустит сообщение
