      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Обновить dynamic-настройки Sentry/ClickHouse (§14.5).
      tags:
      - settings
  /api/settings/clickhouse/orphans:
    get:
      description: Возвращает таблицы из текущей CH-базы, у которых нет соответствующего
