            $ref: '#/definitions/internal_web_adapter_in_http.NodeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "409":
          description: path already exists
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Создать узел.
      tags:
      - nodes
  /api/nodes/{id}:
    delete:
      description: Только admin. Удаляет запись и инвалидирует Redis-кеш. ClickHouse-таблица
        узла остаётся (см. §7.10 — orphan-cleanup).
