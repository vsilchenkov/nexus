  /api/metrics/diagnostics:
    get:
      description: Возвращает обе стороны (Prometheus — попытки/increase; ClickHouse
        — уникальные запросы) и per-node-сверку. Помогает объяснить расхождение шапки/таблицы
        (ретраи → outgoing>incoming в Prometheus; CH-ошибки ≥ Prometheus при 3xx/висящих;
        занижение increase). Деградирует при недоступном источнике.
      parameters:
      - description: 1h | 3h | 24h | 7d | 14d | 30d (default 1h)
        in: query
        name: range
        type: string
      - description: период с (RFC3339 или UnixMilli)
        in: query
        name: from
        type: string
      - description: период по (RFC3339 или UnixMilli)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.diagnosticsDTO'
      security:
      - CookieAuth: []
      - ApiTokenAuth: []
      summary: Сверка счётчиков Prometheus↔ClickHouse за окно (§44.E).
      tags:
      - metrics
  /api/metrics/nodes:
    get:
      description: Источник — ClickHouse-логи (уникальные запросы), fallback Prometheus.
        Ключ node = path узла. Поле totals = СУММА строк (incoming/outgoing/errors/error_rate)
        для KPI шапки. Без источника — пустой список с prometheus_available=false.
      parameters:
      - description: 1h | 3h | 24h | 7d | 14d | 30d (default 1h)
        in: query
        name: range
        type: string
      - description: период с (RFC3339 или UnixMilli); вместе с to задаёт произвольный
          период
        in: query
        name: from
        type: string
      - description: период по (RFC3339 или UnixMilli)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.NodesMetricsResponse'
      security:
      - CookieAuth: []
      - ApiTokenAuth: []
      summary: Per-node throughput за окно + агрегат для шапки (§21, §44.A).
      tags:
      - metrics
  /api/metrics/nodes/{id}:
    get:
      description: Источник — Prometheus (per-node счётчики Sender'а; перцентили через
        histogram_quantile). Без Prometheus → нули с chart_available=false.
      parameters:
      - description: node id
        in: path
        name: id
        required: true
        type: string
      - description: 1h | 3h | 24h | 7d | 14d | 30d (default 1h)
        in: query
        name: range
        type: string
      - description: период с (RFC3339 или UnixMilli); вместе с to задаёт произвольный
          период
        in: query
        name: from
        type: string
      - description: период по (RFC3339 или UnixMilli)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.NodeMetricsResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      - ApiTokenAuth: []
      summary: KPI + временной ряд графика узла (§21).
      tags:
      - metrics
  /api/metrics/overview:
    get:
      description: Только очередь Kafka (мгновенный lag, Prometheus). Трафик (входящие/исходящие/ошибки)
        переехал в GET /api/metrics/nodes → totals (за выбранный период, ClickHouse),
        чтобы шапка сходилась с таблицей. Без prometheus.url — нули с prometheus_available=false.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.overviewKPIDTO'
      security:
      - CookieAuth: []
      - ApiTokenAuth: []
      summary: 'KPI шапки: очередь Kafka + доступность Prometheus (§21, §44.A).'
      tags:
      - metrics
  /api/nodes:
    get:
      parameters:
      - description: поиск по path или target_url
        in: query
        name: search
        type: string
      - description: request | requestAsync
        in: query
        name: root_method
        type: string
      - description: лимит, max 500
        in: query
        name: limit
