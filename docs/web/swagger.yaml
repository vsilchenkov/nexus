      - description: node id
        in: path
        name: id
        required: true
        type: string
      - description: message id (Envelope.ID)
        in: path
        name: msgId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "503":
          description: queue management unavailable
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Удалить (отменить) одно сообщение очереди (§34.4).
      tags:
      - async-queue
  /api/nodes/{id}/async-queue/messages/body:
    get:
      description: Ленивая подгрузка тела по физической координате (partition, offset)
        из списка. Admin-only.
      parameters:
      - description: node id
        in: path
        name: id
        required: true
        type: string
      - description: partition
        in: query
        name: partition
        required: true
        type: integer
      - description: offset
        in: query
        name: offset
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.queueBodyDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "503":
          description: kafka unavailable
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Тело одного сообщения async-очереди (§34.4).
      tags:
      - async-queue
  /api/nodes/{id}/async-queue/purge:
    post:
      consumes:
      - application/json
      description: Отменяет сообщения с ReceivedAt ∈ [from,to] (логически, через cancel-set).
        Пустые from/to = очистить всё. Admin-only.
      parameters:
      - description: node id
        in: path
        name: id
        required: true
        type: string
      - description: период (пусто = всё)
        in: body
        name: body
        schema:
          $ref: '#/definitions/internal_web_adapter_in_http.queuePurgeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.queuePurgeDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_web_adapter_in_http.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Очистить async-очередь узла за период или целиком (§34.4).
      tags:
      - async-queue
  /api/nodes/{id}/async-queue/purge-failed:
    post:
      consumes:
      - application/json
      description: Отменяет повторную доставку (DLQ-репроцессор перестаёт повторять)
