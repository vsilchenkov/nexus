# GitLab CI/CD pipeline для DataBus (Phase 9.2).
#
# Аналог .github/workflows/{ci,security,release}.yml — один файл со всеми
# stages: test, lint, build, security, integration, release.
#
# Runner: self-hosted shell/docker executor с тегом `srv-d-android-l`.
# Для integration и release jobs требуется доступ к Docker daemon (либо
# docker.sock смонтирован в runner, либо services: [docker:dind] + privileged).
#
# Триггеры:
#   - push в любую ветку             → test, lint, build, swagger-drift, ui
#   - merge_request                  → то же + integration (по labels)
#   - schedule (weekly)              → security (govulncheck + gosec + trivy + nancy)
#   - tag v*                         → release (GoReleaser → GitLab Container Registry)
#
# Документация GitLab CI variables: https://docs.gitlab.com/ee/ci/variables/

variables:
  GO_VERSION: "1.26.3"
  NODE_VERSION: "20"
  # Локальный GOPATH/GOCACHE/GOMODCACHE — кешируется между jobs.
  GOPATH: "$CI_PROJECT_DIR/.cache/go"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
  # Глобально отключаем интерактивные prompt'ы apt/npm.
  DEBIAN_FRONTEND: noninteractive

default:
  # Все jobs запускаются на ноде srv-d-android-l (self-hosted runner,
  # docker-executor — поддерживает директиву `image:` из job-секций).
  tags:
    - srv-d-android-l-docker
  # Прерываемые при новом push в ту же ветку — экономит CI-минуты.
  interruptible: true

# concurrency-аналог: не запускать новый pipeline пока старый не завершился
# (для веток feature/*). Для master/tag — ждём, не отменяем.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

stages:
  - test
  - lint
  - build
  - security
  - integration
  - release

# ----------- Reusable anchors -----------------------------------------------

# Go-кэш: ускоряет `go mod download` и `go build` между jobs.
# GitLab кеширует tar-архив директорий между jobs одного pipeline и (при
# совпадении key) между разными pipelines.
.go-cache: &go-cache
  cache:
    key:
      files:
        - go.sum
    paths:
      - .cache/go-build
      - .cache/go-mod
    policy: pull-push

.go-base:
  image: golang:${GO_VERSION}
  <<: *go-cache
  before_script:
    - go env -w GOPATH=$GOPATH GOCACHE=$GOCACHE GOMODCACHE=$GOMODCACHE
    - go mod download

# Селективные ручные прогоны (см. порядок запуска в TESTING.md):
#   RUN_PROFILE = integration-only   → только integration job
#   RUN_PROFILE = loadtest-only      → только loadtest job
#   RUN_PROFILE = default            → обычный pipeline (build/lint/test/...)
#
# Якорь подставляется первой строкой в `rules:` каждого «обычного» job'а —
# при выборе профиля он скипает всё остальное, оставляя только нужное.
# В integration/loadtest jobs логика инвертирована (см. их rules:).
.skip-if-profiled-rule: &skip-if-profiled-rule
  if: $RUN_PROFILE == "integration-only" || $RUN_PROFILE == "loadtest-only"
  when: never

# ----------- TEST stage -----------------------------------------------------

go-test:
  stage: test
  extends: .go-base
  rules:
    - *skip-if-profiled-rule
    - when: on_success
  script:
    - go vet ./...
    - go test -race -short ./...

# ----------- LINT stage -----------------------------------------------------

go-lint:
  stage: lint
  image: golangci/golangci-lint:v2.12-alpine
  <<: *go-cache
  rules:
    - *skip-if-profiled-rule
    - when: on_success
  script:
    - golangci-lint run --timeout=5m

swagger-drift:
  stage: lint
  extends: .go-base
  rules:
    - *skip-if-profiled-rule
    - when: on_success
  script:
    - go install github.com/swaggo/swag/cmd/swag@v1.16.6
    - $GOPATH/bin/swag init -g cmd/web/main.go -o docs/web --parseDependency --parseDepth 2 --quiet
    - |
      if ! git diff --quiet docs/; then
        echo "swagger drift detected; run 'make swagger' locally and commit"
        git --no-pager diff --stat docs/
        exit 1
      fi

# ----------- BUILD stage ----------------------------------------------------

go-build:
  stage: build
  extends: .go-base
  rules:
    - *skip-if-profiled-rule
    - when: on_success
  script:
    # На Linux линкер не падает с OOM (грабля Windows из CLAUDE.md §6).
    - go build ./...

ui-build:
  stage: build
  image: node:${NODE_VERSION}
  cache:
    key:
      files:
        - web-ui/package-lock.json
    paths:
      - web-ui/node_modules
    policy: pull-push
  rules:
    - *skip-if-profiled-rule
    - when: on_success
  script:
    - cd web-ui
    - npm ci
    - npm run lint --if-present
    - npm run build
  artifacts:
    paths:
      - web-ui/dist
    expire_in: 1 week

# ----------- INTEGRATION stage ----------------------------------------------
# Тяжёлый job: PG + Redis + Kafka + ClickHouse через testcontainers-go.
# Требует доступа к Docker daemon. На self-hosted runner с shell-executor —
# работает если docker.sock доступен; на docker-executor — services dind +
# privileged: true (см. variables ниже).
#
# По умолчанию запускается на label `run-integration` для MR и всегда на
# master/dev/tag — аналогично GitHub workflow.
# Селективный ручной запуск: «Run pipeline → RUN_PROFILE=integration-only»
# (порядок — в TESTING.md).

integration:
  stage: integration
  image: golang:${GO_VERSION}
  <<: *go-cache
  # Services-секцию активируйте если runner — docker-executor:
  # services:
  #   - name: docker:24-dind
  #     alias: docker
  # variables:
  #   DOCKER_HOST: "tcp://docker:2375"
  #   DOCKER_TLS_CERTDIR: ""
  #   TESTCONTAINERS_HOST_OVERRIDE: "docker"
  #   TESTCONTAINERS_RYUK_DISABLED: "true"
  timeout: 25 minutes
  rules:
    - if: $RUN_PROFILE == "loadtest-only"
      when: never
    - if: $RUN_PROFILE == "integration-only"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /run-integration/
  before_script:
    - go env -w GOPATH=$GOPATH GOCACHE=$GOCACHE GOMODCACHE=$GOMODCACHE
    - go mod download
    # NB: docker pre-pull убран. golang:${GO_VERSION} (debian) идёт без
    # docker CLI — testcontainers-go ходит к daemon'у напрямую через
    # docker.sock, а `docker pull` в before_script писал в лог
    # «command not found» (спасало только `|| true`). Если нужен прогрев
    # слоёв — нужен image c docker-cli или отдельный prepare-job.
  script:
    - go test -tags=integration -timeout 20m -count=1 ./tests/integration/...

# ----------- LOADTEST (manual) ----------------------------------------------
# Нагрузочный сценарий (§10.2 ТЗ) — поднимает изолированный compose-стек,
# гонит cmd/loadtest и снимает стек. Запускается вручную из UI GitLab
# (Pipelines → Run pipeline → loadtest или Job → Play на ручной job).
#
# Окружение собирается каждый запуск с нуля: COMPOSE_PROJECT_NAME содержит
# pipeline+job id, поэтому сети/volumes уникальны, и параллельные запуски
# не пересекаются по namespace docker'а. Container names не зашиваются для
# сервиса loadtest — docker присвоит `<project>-loadtest-run`.
#
# Required CI/CD Variables (Settings → CI/CD → Variables):
#   - LOADTEST_ADMIN_PASSWORD — пароль admin'а (masked + protected). Задаём
#     им же admin'у в свежей БД через `web --set-admin-password`, и им же
#     loadtest логинится в Web.
#
# Опциональные переменные (можно переопределить при ручном запуске через
# UI «Run pipeline» → Variables):
#   - LOADTEST_TARGET_RPS  (default 500)
#   - LOADTEST_DURATION    (default 5m)
#   - LOADTEST_NODES       (default 50)

loadtest:
  stage: integration
  image: docker:24-cli
  rules:
    - if: $RUN_PROFILE == "integration-only"
      when: never
    # При RUN_PROFILE=loadtest-only — стартует без ручного клика,
    # как только pipeline создан (порядок в TESTING.md).
    - if: $RUN_PROFILE == "loadtest-only"
      when: on_success
      allow_failure: true
    - when: manual
      allow_failure: true
  timeout: 60 minutes
  variables:
    COMPOSE_PROJECT_NAME: "loadtest-${CI_PIPELINE_ID}-${CI_JOB_ID}"
    COMPOSE_FILE: "deploy/docker-compose.yml"
    LOADTEST_TARGET_RPS: "500"
    LOADTEST_DURATION: "5m"
    LOADTEST_NODES: "50"
  before_script:
    - apk add --no-cache docker-cli-compose openssl
    - |
      if [ -z "$LOADTEST_ADMIN_PASSWORD" ]; then
        echo "LOADTEST_ADMIN_PASSWORD не задан в CI/CD Variables (masked+protected)" >&2
        exit 1
      fi
    # .env для compose-стека. Хосты — compose-имена сервисов; ENCRYPTION_KEY
    # эпemerный, его valid'ность нужна только на время прогона.
    - |
      cat > .env <<EOF
      VERSION=loadtest-${CI_PIPELINE_ID}
      PG_HOST=postgres
      PG_PORT=5432
      PG_USER=databus
      PG_PASSWORD=loadtest_local_pg
      REDIS_HOST=redis
      REDIS_PORT=6379
      REDIS_PASSWORD=
      CH_HOST=clickhouse
      CH_PORT=9000
      CH_USER=default
      CH_PASSWORD=
      KAFKA_BROKERS=kafka:9092
      # Single-broker compose-стек: переопределяем prod-дефолты 3/2,
      # иначе bootstrap.MustEnsureKafkaTopics упадёт на InvalidReplicationFactor.
      KAFKA_TOPIC_REPLICATION_FACTOR=1
      KAFKA_TOPIC_MIN_INSYNC_REPLICAS=1
      SENTRY_USE=false
      SENTRY_DSN=
      SENTRY_ENVIRONMENT=loadtest
      ENCRYPTION_KEY=$(openssl rand -base64 32)
      EOF
    - mkdir -p loadtest-report
  script:
    # 1) Поднимаем инфраструктуру + сервисы (без loadtest — он под profile).
    - docker compose up -d --build --wait postgres redis clickhouse kafka receiver sender web
    # 2) Bootstrap пароля admin'а (web в свежей БД заводится с NULL hash).
    - |
      docker compose run --rm --no-deps web \
        /usr/local/bin/web --config /app/config/config.yml \
        --set-admin-password "$LOADTEST_ADMIN_PASSWORD"
    # 3) Прогон loadtest'а. --name даёт фиксированное имя для docker cp.
    #    Не --rm: контейнер нужно сохранить до копирования отчёта.
    - |
      docker compose --profile loadtest run \
        --name "${COMPOSE_PROJECT_NAME}-loadtest-run" \
        loadtest \
          --web http://web:8000 \
          --receiver http://receiver:8080 \
          --mock-bind 0.0.0.0:9999 \
          --mock-public-url http://loadtest:9999 \
          --admin-password "$LOADTEST_ADMIN_PASSWORD" \
          --target-rps "$LOADTEST_TARGET_RPS" \
          --duration "$LOADTEST_DURATION" \
          --nodes "$LOADTEST_NODES" \
          --cleanup=false \
          --report /tmp/report.json
    - docker cp "${COMPOSE_PROJECT_NAME}-loadtest-run":/tmp/report.json loadtest-report/report.json
    - docker rm "${COMPOSE_PROJECT_NAME}-loadtest-run" || true
  after_script:
    - docker compose --profile loadtest logs --tail=400 > loadtest-report/compose-logs.txt 2>&1 || true
    - docker compose --profile loadtest down -v --remove-orphans || true
    - rm -f .env
  artifacts:
    when: always
    paths:
      - loadtest-report/
    expire_in: 1 month

# ----------- SECURITY stage -------------------------------------------------
# Аналог .github/workflows/security.yml. Не блокируют merge — early-warning,
# не gate. Запускаются на master/dev push, по schedule (CI/CD → Schedules в UI
# GitLab, рекомендую weekly cron `0 6 * * 0`), и вручную через workflow_dispatch.
#
# Premium-фичи GitLab Ultimate (managed SAST/Dependency Scanning через
# Security/SAST.gitlab-ci.yml include) не используются, потому что
# self-hosted Community Edition их не поддерживает; вместо них — open-source
# инструменты тех же категорий.

.security-rules: &security-rules
  rules:
    - *skip-if-profiled-rule
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - go.mod
        - go.sum
        - web-ui/package-lock.json
        - Dockerfile
        - deploy/docker/*.Dockerfile
    - when: manual
      allow_failure: true

# govulncheck (golang.org/x/vuln) — официальный сканер Go-зависимостей с
# call-graph анализом: сопоставляет CVE с фактически вызываемым кодом, а не
# просто проверяет версии модулей. Падает на vuln — гейтит pipeline.
govulncheck:
  stage: security
  extends: .go-base
  <<: *security-rules
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - $GOPATH/bin/govulncheck ./...

# gosec — статический анализатор security-правил OWASP/CWE (G-серия).
# `-fmt sarif` для просмотра в IDE; `-fmt gitlab` для GitLab Security Dashboard
# (Premium-фича; на Community SARIF доступен как artifact).
#
# NB: используем golang:${GO_VERSION}-alpine, а не securego/gosec — последний
# идёт без Go toolchain, и gosec в этом образе не может разрешить `./...`
# через `go list` → «Files: 0, Lines: 0» и артефакты не создаются.
gosec:
  stage: security
  image: golang:${GO_VERSION}-alpine
  <<: [*go-cache, *security-rules]
  allow_failure: true  # findings не блокируют — alerts only
  before_script:
    - apk add --no-cache git
    - go env -w GOPATH=$GOPATH GOCACHE=$GOCACHE GOMODCACHE=$GOMODCACHE
    - go mod download
    - go install github.com/securego/gosec/v2/cmd/gosec@latest
    # Stub-файлы, чтобы `artifacts.paths` всегда нашёл что выложить —
    # даже если gosec упал до записи отчётов.
    - touch gosec-results.sarif gosec-junit.xml
  script:
    - $GOPATH/bin/gosec -fmt=sarif -out=gosec-results.sarif -exclude-dir=web-ui -exclude-dir=docs ./... || true
    - $GOPATH/bin/gosec -fmt=junit-xml -out=gosec-junit.xml -exclude-dir=web-ui -exclude-dir=docs ./... || true
  artifacts:
    when: always
    paths:
      - gosec-results.sarif
    reports:
      junit: gosec-junit.xml
    expire_in: 1 month

# Trivy filesystem scan — vulns (Go + npm) + secrets (приватные ключи) +
# misconfigs (Dockerfile, YAML). Дополняет govulncheck по non-Go-частям.
trivy-fs:
  stage: security
  image:
    name: aquasec/trivy:0.55.0
    entrypoint: [""]
  <<: *security-rules
  allow_failure: true
  variables:
    # Trivy скачивает DB при каждом запуске; кеш ускоряет последующие jobs.
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/trivy"
  cache:
    key: trivy-db
    paths:
      - .cache/trivy
    policy: pull-push
  script:
    - trivy --version
    - trivy fs
        --scanners vuln,secret,misconfig
        --severity CRITICAL,HIGH,MEDIUM
        --ignore-unfixed
        --format sarif
        --output trivy-fs.sarif
        --exit-code 0
        .
  artifacts:
    when: always
    paths:
      - trivy-fs.sarif
    expire_in: 1 month

# Renovate Bot — self-hosted замена Dependabot для GitLab. Конфиг в
# renovate.json в корне. Запускается по schedule (CI/CD → Schedules в UI
# GitLab, рекомендую weekly `0 7 * * 1` — понедельник 07:00 UTC) и вручную.
#
# Required CI/CD Variables:
#   - RENOVATE_TOKEN — Project (или Group) Access Token со scope `api` +
#     `write_repository`; от него renovate создаёт MR.
#   - GITHUB_COM_TOKEN (опционально) — read-only token для github.com,
#     нужен для подтягивания CHANGELOG'ов npm-пакетов и release notes.
renovate:
  stage: security
  image:
    name: renovate/renovate:latest
    entrypoint: [""]
  rules:
    - *skip-if-profiled-rule
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: manual
      allow_failure: true
  variables:
    LOG_LEVEL: info
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: "$CI_API_V4_URL"
    RENOVATE_AUTODISCOVER: "false"
    RENOVATE_REPOSITORIES: "$CI_PROJECT_PATH"
    # Авто-merge minor/patch держим OFF — пусть человек подтверждает.
    RENOVATE_AUTOMERGE: "false"
  script:
    - renovate

# Nancy (Sonatype OSS Index) убран: Sonatype начали возвращать 403 Forbidden
# для анонимных запросов, без OSS Index account скан не работает. CVE-покрытие
# Go-модулей закрывается govulncheck (NVD + call-graph анализ), vendor/npm —
# trivy. Если nancy потребуется вернуть — нужен OSS Index API token в
# Settings → CI/CD → Variables и передача через --username/--token.

# ----------- RELEASE stage --------------------------------------------------
# Триггерится тегом v*. Использует GoReleaser → GitLab Container Registry
# (registry.gitlab.com/<owner>/<repo>/{receiver,sender,web}) для docker-образов
# и GitLab Releases API для архивов / GitHub-style release page.
#
# Один .goreleaser.yaml работает и здесь, и в GitHub Actions: DOCKER_REGISTRY_BASE
# + COMPARE_URL_BASE передаются через env; GoReleaser автодетектит CI по наличию
# GITLAB_TOKEN.
#
# Требования к runner:
#   - доступ к Docker daemon (через docker:dind service или docker.sock).
#     По умолчанию настроен DinD; если runner — shell-executor с локальным
#     docker, services-блок можно удалить.
#   - привилегии на DinD (privileged: true в config.toml runner'а).
#
# Required CI/CD Variables (Settings → CI/CD → Variables):
#   - GITLAB_TOKEN — Project Access Token со scope `api` + `write_repository`;
#     нужен GoReleaser'у для создания release entry в GitLab.

release:
  stage: release
  image: goreleaser/goreleaser:v2
  services:
    - name: docker:24-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    # Общий контракт с .github/workflows/release.yml — см. шапку .goreleaser.yaml.
    DOCKER_REGISTRY_BASE: $CI_REGISTRY_IMAGE
    COMPARE_URL_BASE: "$CI_PROJECT_URL/-/compare"
    # GoReleaser автодетектит GitLab по наличию GITLAB_TOKEN; для git operations
    # дополнительно требуется fetch-depth: 0 — в GitLab он по умолчанию.
    GIT_DEPTH: "0"
  rules:
    - *skip-if-profiled-rule
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  timeout: 60 minutes
  before_script:
    - apk add --no-cache git
    # Multi-arch buildx (для linux/amd64 + linux/arm64). QEMU включается через
    # tonistiigi/binfmt — нужно privileged runner.
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --use --name multiarch --driver docker-container
    - docker buildx inspect --bootstrap
    # Login в GitLab Container Registry — переменные CI_REGISTRY_* предоставляются
    # GitLab автоматически (read+write для текущего проекта).
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - goreleaser release --clean
