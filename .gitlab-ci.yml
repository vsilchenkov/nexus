# GitLab CI/CD pipeline для Nexus (Phase 9.2).
#
# Один файл со всеми stages: test, lint, build, security, integration.
# Docker-образы в CI НЕ собираются и в registry НЕ публикуются — деплой сборкой
# на сервере (`docker compose up -d --build`, DEPLOYMENT.md §9.1).
#
# Runner: self-hosted docker-executor с тегом `srv-d-android-l-docker`.
# Для integration job требуется доступ к Docker daemon (testcontainers поднимают
# PostgreSQL/ClickHouse/Redis/Kafka через смонтированный docker.sock раннера).
#
# Триггеры:
#   - push в любую ветку             → test, lint, build, swagger-drift, ui
#   - merge_request                  → то же + integration (по labels)
#   - schedule (weekly)              → security (govulncheck + gosec + trivy)
#   - tag v*                         → test/lint/build (валидация тега; деплой —
#                                      сборкой на сервере, DEPLOYMENT.md §9.1)
#
# Документация GitLab CI variables: https://docs.gitlab.com/ee/ci/variables/

variables:
  GO_VERSION: "1.26.5"
  NODE_VERSION: "20"
  # Локальный GOPATH/GOCACHE/GOMODCACHE — кешируется между jobs.
  GOPATH: "$CI_PROJECT_DIR/.cache/go"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
  # Глобально отключаем интерактивные prompt'ы apt/npm.
  DEBIAN_FRONTEND: noninteractive

default:
  # Все jobs запускаются на ноде srv-d-android-l (self-hosted runner,
  # docker-executor — поддерживает директиву `image:` из job-секций).
  tags:
    - srv-d-android-l-docker
  # Прерываемые при новом push в ту же ветку — экономит CI-минуты.
  interruptible: true

# concurrency-аналог: не запускать новый pipeline пока старый не завершился
# (для веток feature/*). Для master/tag — ждём, не отменяем.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    # Раннер ОДИН и обрабатывает пайплайны последовательно (FIFO). Релиз пушит
    # master и тег на ОДИН И ТОТ ЖЕ коммит → создавались ДВА пайплайна: ветка
    # занимала раннер, а релизный пайплайн тега висел в очереди по 30–90 мин
    # (так было с v1.15.1: master=8575 забрал раннер, tag=8576 стоял pending).
    #
    # Отсечь именно «дубль по SHA» напрямую НЕЛЬЗЯ: в branch-пайплайне
    # $CI_COMMIT_TAG всегда пуст, а переменной «какие теги указывают на этот
    # коммит» GitLab не предоставляет. Поэтому режем push-пайплайн master:
    # master получает только релизные merge'и, а выпускается всегда коммит с
    # тегом — его пайплайн тега проверяет полностью и вдобавок гоняет
    # security-сканеры и loadtest, которых на ветке нет.
    #
    # Ручной запуск остаётся: правило требует source == "push", поэтому кнопка
    # «Run pipeline» (source == "web") на master работает как раньше. Это нужно
    # для НЕтегированного коммита в master — такое бывало (2bc01d1 перед
    # v1.10.0): его авто-CI не покроет, запускай вручную или нарежь тег.
    - if: $CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH

# DAG вместо последовательных стадий: у всех независимых jobs — `needs: []`,
# поэтому они стартуют сразу, не дожидаясь завершения предыдущей стадии.
# Параллельность даёт runner: config.toml `concurrent = 3` (один хост,
# docker-executor гонит до 3 jobs одновременно; было 4, снижено 2026-07-28,
# чтобы разгрузить хост). До DAG пайплайн шёл строго последовательно (сумма
# ~46 мин на теге); сейчас критический путь ≈ integration (~14 мин) плюс
# очередь на старте — при трёх слотах короткие jobs ждут чуть дольше, порядок
# величины прежний. Значение здесь — справочное: реальный потолок задаёт
# config.toml раннера, а если у самого раннера стоит `limit`, то он и главнее.
# NB: cross-job `needs: [job]` НЕ используем — при RUN_PROFILE-фильтрах
# зависимость может отсутствовать в пайплайне, и GitLab падает с
# «job needs ... but it was not added». Пустой `needs: []` этой проблемы не имеет.
# stages оставлены для группировки в UI; порядок исполнения задаёт needs.
stages:
  - test
  - lint
  - build
  - security
  - integration

# ----------- Reusable anchors -----------------------------------------------

# Go-кэш: ускоряет `go mod download` и `go build` между jobs.
# GitLab кеширует tar-архив директорий между jobs одного pipeline и (при
# совпадении key) между разными pipelines.
.go-cache: &go-cache
  cache:
    key:
      files:
        - go.sum
    paths:
      - .cache/go-build
      - .cache/go-mod
    policy: pull-push

.go-base:
  image:
    name: golang:${GO_VERSION}
    # Fallback: при сетевом сбое к Docker Hub (TLS handshake timeout) берём
    # локально закэшированный образ вместо падения job'а. Требует на раннере
    # allowed_pull_policies = ["always", "if-not-present"] (config.toml).
    pull_policy: [always, if-not-present]
  <<: *go-cache
  before_script:
    - go env -w GOPATH=$GOPATH GOCACHE=$GOCACHE GOMODCACHE=$GOMODCACHE
    - go mod download

# Селективные ручные прогоны (см. порядок запуска в TESTING.md):
#   RUN_PROFILE = integration-only   → только integration job
#   RUN_PROFILE = loadtest-only      → только loadtest job
#   RUN_PROFILE = default            → обычный pipeline (build/lint/test/...)
#
# Якорь подставляется первой строкой в `rules:` каждого «обычного» job'а —
# при выборе профиля он скипает всё остальное, оставляя только нужное.
# В integration/loadtest jobs логика инвертирована (см. их rules:).
.skip-if-profiled-rule: &skip-if-profiled-rule
  if: $RUN_PROFILE == "integration-only" || $RUN_PROFILE == "loadtest-only"
  when: never

# ----------- TEST stage -----------------------------------------------------

go-test:
  stage: test
  extends: .go-base
  rules:
    - *skip-if-profiled-rule
    - when: on_success
  script:
    - 'echo "===== go version + env ====="'
    - go version
    - go env GOPATH GOCACHE GOMODCACHE
    - 'echo "===== go vet ./... ====="'
    - go vet ./...
    - 'echo "===== installing gotestsum (для JUnit-отчёта в GitLab Tests tab) ====="'
    - go install gotest.tools/gotestsum@v1.13.0
    - 'echo "===== gotestsum -- -race -short -coverprofile ./... ====="'
    # gotestsum пробрасывает exit code go test'а, поэтому pipeline остаётся
    # красным при любом FAIL. --format pkgname-and-test-fails — лаконичный
    # вывод (зелёные пакеты одной строкой, упавшие — с трейсом).
    - $GOPATH/bin/gotestsum
        --junitfile junit.xml
        --format pkgname-and-test-fails
        --
        -race -short -coverprofile=coverage.out -covermode=atomic ./...
    - 'echo "===== coverage summary (для MR widget) ====="'
    - go tool cover -func=coverage.out | tail -1
    - 'echo "===== go-test done ====="'
  # GitLab парсит итоговый процент покрытия из stdout по этому regex и
  # показывает его рядом со статусом pipeline в MR widget.
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    paths:
      - coverage.out
      - junit.xml
    reports:
      junit: junit.xml
      # cobertura-отчёт для line-by-line coverage в MR diff включён НЕ
      # сейчас: требует `gocover-cobertura` и при больших проектах ощутимо
      # удлиняет job. Если понадобится — добавим отдельным шагом.
    expire_in: 1 month

# ----------- LINT stage -----------------------------------------------------

go-lint:
  stage: lint
  needs: []
  image:
    name: golangci/golangci-lint:v2.12-alpine
    pull_policy: [always, if-not-present]
  <<: *go-cache
  rules:
    - *skip-if-profiled-rule
    - when: on_success
  script:
    - 'echo "===== golangci-lint version ====="'
    - golangci-lint version
    # Валидация .golangci.yml по JSON-схеме ИМЕННО той версии, что в образе.
    # Образ `v2.12-alpine` — rolling (v2.12.x), и набор допустимых ключей/линтеров
    # в нём может обгонять локальный бинарь. Без этого шага опечатка в конфиге или
    # исчезнувший линтер (напр. `modernize`, добавленный в v2.12) диагностируются
    # только по невнятному падению `run`. `config verify` даёт точную строку.
    - 'echo "===== golangci-lint config verify ====="'
    - golangci-lint config verify
    # Явная проверка, что modernize реально включён в ЭТОМ прогоне: `run` с
    # выключенным линтером всё равно печатает «0 issues», поэтому деградация
    # «линтер тихо отвалился» прошла бы незамеченной. `linters` печатает
    # фактический набор с учётом конфига.
    # NB: вывод содержит ДВА раздела (Enabled/Disabled) — грепать по всему
    # выводу нельзя, имя нашлось бы и в «Disabled». Отсюда sed-диапазон,
    # ограничивающий поиск разделом Enabled.
    - 'echo "===== enabled linters (проверяем наличие modernize) ====="'
    - golangci-lint linters | sed -n '/^Enabled by your configuration/,/^Disabled by your configuration/p'
    - |
      if ! golangci-lint linters \
        | sed -n '/^Enabled by your configuration/,/^Disabled by your configuration/p' \
        | grep -q '^modernize:'; then
        echo "modernize отсутствует в наборе включённых линтеров — проверь .golangci.yml и версию образа" >&2
        exit 1
      fi
    # --timeout=15m, а не 5m: линтерам нужно СОБРАТЬ пакеты, и на холодном
    # прогоне (в логе выше по job'у — «Failed to extract cache») сборка с нуля
    # съедает почти весь бюджет. Симптом характерный: job печатает «0 issues»
    # и тут же падает с «Timeout exceeded» + exit 4 — то есть анализ прошёл, не
    # хватило только времени. Ловилось дважды (v1.20.0 и 2026-07-28), оба раза
    # лечилось ретраем — запас дешевле ручных ретраев, на тёплом кеше job всё
    # равно укладывается в ~3 минуты.
    - 'echo "===== golangci-lint run --timeout=15m ====="'
    - golangci-lint run --timeout=15m
    - 'echo "===== go-lint done ====="'

swagger-drift:
  stage: lint
  needs: []
  extends: .go-base
  rules:
    - *skip-if-profiled-rule
    - when: on_success
  script:
    - 'echo "===== installing swag CLI ====="'
    - go install github.com/swaggo/swag/cmd/swag@v1.16.6
    # Генерируем ОБА дока с теми же флагами, что цель `swagger` в Makefile (§25):
    # web (instance swagger) и receiver (instance receiver). --exclude изолирует
    # пакеты, иначе web-док подхватил бы /v1-маршруты Receiver.
    - 'echo "===== swag init (web + receiver) ====="'
    - $GOPATH/bin/swag init -g cmd/web/main.go -o docs/web --exclude cmd/receiver,internal/receiver --parseDependency --parseDepth 2 --quiet
    - $GOPATH/bin/swag init -g cmd/receiver/main.go -o docs/receiver --instanceName receiver --exclude cmd/web,internal/web --parseDependency --parseDepth 2 --quiet
    - 'echo "===== git diff docs/ (должно быть пусто) ====="'
    - |
      if ! git diff --quiet docs/; then
        echo "swagger drift detected; run 'make swagger' locally and commit"
        git --no-pager diff --stat docs/
        exit 1
      fi
    - 'echo "===== swagger-drift done ====="'

# ----------- BUILD stage ----------------------------------------------------

go-build:
  stage: build
  needs: []
  extends: .go-base
  rules:
    - *skip-if-profiled-rule
    - when: on_success
  script:
    # На Linux линкер не падает с OOM (грабля Windows из CLAUDE.md §6).
    - 'echo "===== go build ./... ====="'
    - go build ./...
    - 'echo "===== собранные пакеты ====="'
    - ls -la cmd/
    - 'echo "===== go-build done ====="'

ui-build:
  stage: build
  needs: []
  image:
    name: node:${NODE_VERSION}
    pull_policy: [always, if-not-present]
  cache:
    key:
      files:
        - web-ui/package-lock.json
    paths:
      - web-ui/node_modules
    policy: pull-push
  rules:
    - *skip-if-profiled-rule
    - when: on_success
  script:
    - 'echo "===== node / npm versions ====="'
    - node --version
    - npm --version
    - cd web-ui
    - 'echo "===== npm ci (web-ui/) ====="'
    - npm ci
    - 'echo "===== npm run lint --if-present ====="'
    - npm run lint --if-present
    # §51.8: фронтовые unit-тесты (vitest) — гоняются в CI наравне с lint/build.
    - 'echo "===== npm run test ====="'
    - npm run test
    - 'echo "===== npm run build ====="'
    - npm run build
    - 'echo "===== dist/ содержимое ====="'
    - ls -lh dist/
    - 'echo "===== ui-build done ====="'
  artifacts:
    paths:
      - web-ui/dist
    expire_in: 1 week

# ----------- INTEGRATION stage ----------------------------------------------
# Тяжёлый job: PG + Redis + Kafka + ClickHouse через testcontainers-go.
# Требует доступа к Docker daemon. На self-hosted runner с shell-executor —
# работает если docker.sock доступен; на docker-executor — services dind +
# privileged: true (см. variables ниже).
#
# По умолчанию запускается на label `run-integration` для MR и всегда на
# master/dev/tag — аналогично GitHub workflow.
# Селективный ручной запуск: «Run pipeline → RUN_PROFILE=integration-only»
# (порядок — в TESTING.md).

integration:
  stage: integration
  # Самый долгий job (~14 мин) — стартует сразу, не ждёт остальных: код он
  # компилирует сам (go test), красный build уронит и его.
  needs: []
  image:
    name: golang:${GO_VERSION}
    pull_policy: [always, if-not-present]
  <<: *go-cache
  # Services-секцию активируйте если runner — docker-executor:
  # services:
  #   - name: docker:24-dind
  #     alias: docker
  # variables:
  #   DOCKER_HOST: "tcp://docker:2375"
  #   DOCKER_TLS_CERTDIR: ""
  #   TESTCONTAINERS_HOST_OVERRIDE: "docker"
  #   TESTCONTAINERS_RYUK_DISABLED: "true"
  timeout: 35 minutes
  rules:
    - if: $RUN_PROFILE == "loadtest-only"
      when: never
    - if: $RUN_PROFILE == "integration-only"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /run-integration/
  before_script:
    - go env -w GOPATH=$GOPATH GOCACHE=$GOCACHE GOMODCACHE=$GOMODCACHE
    - go mod download
    - go install gotest.tools/gotestsum@v1.13.0
    # NB: docker pre-pull убран. golang:${GO_VERSION} (debian) идёт без
    # docker CLI — testcontainers-go ходит к daemon'у напрямую через
    # docker.sock, а `docker pull` в before_script писал в лог
    # «command not found» (спасало только `|| true`). Если нужен прогрев
    # слоёв — нужен image c docker-cli или отдельный prepare-job.
  script:
    - 'echo "===== integration test env ====="'
    - go version
    - 'echo "DOCKER_HOST = $DOCKER_HOST"'
    - 'echo "===== gotestsum -tags=integration -timeout 30m -count=1 ./tests/integration/... ====="'
    # JUnit-отчёт пишем в junit-integration.xml — отдельный файл от unit-тестов,
    # чтобы в GitLab Tests tab были две независимые вкладки и было видно, в
    # каком слое (unit vs integration) сломалось.
    #
    # --format standard-verbose: каждый тест стримит `=== RUN ...` сразу при
    # старте (а не по завершении пакета). Без этого долгий прогон выглядит как
    # зависание: testcontainers тянет образы PG/Redis/Kafka/ClickHouse и ждёт
    # готовности CH до 180с на контейнер — несколько минут полной тишины.
    - $GOPATH/bin/gotestsum
        --junitfile junit-integration.xml
        --format standard-verbose
        --
        -tags=integration -timeout 30m -count=1 ./tests/integration/...
    - 'echo "===== integration done ====="'
  artifacts:
    when: always
    paths:
      - junit-integration.xml
    reports:
      junit: junit-integration.xml
    expire_in: 1 month

# ----------- LOADTEST (единый job, §10.2) -----------------------------------
# Один job `loadtest`: поднимает изолированный compose-стек (включая rabbitmq),
# за ОДИН прогон гонит полный микс трафика (sync + async + dynamic-url +
# auth-token + auth-basic + RabbitMQAsync), сверяет no-loss по ClickHouse,
# снимает стек и генерит per-mode JUnit. Раньше было 5 отдельных профилей —
# объединены в этот один job, чтобы не плодить кнопки в pipeline; разные
# сценарии теперь задаются переопределением переменных в «Run pipeline».
#
# Когда запускается: авто на push в master (allow_failure — early-warning, не
# gate) и под RUN_PROFILE=loadtest-only; manual (кнопка ▶) на dev. На
# feature-ветках стаб не плодим — там только RUN_PROFILE=loadtest-only.
#
# Окружение собирается каждый запуск с нуля: COMPOSE_PROJECT_NAME содержит
# pipeline+job id, поэтому сети/volumes уникальны, и параллельные запуски
# не пересекаются по namespace docker'а. Container names не зашиваются для
# сервиса loadtest — docker присвоит `<project>-loadtest-run`.
#
# Required CI/CD Variables (Settings → CI/CD → Variables):
#   - LOADTEST_ADMIN_PASSWORD — пароль admin'а (masked + protected). Задаём
#     им же admin'у в свежей БД через `web --set-admin-password`, и им же
#     loadtest логинится в Web.
#
# Переопределяемые через UI «Run pipeline» → Variables: LOADTEST_TARGET_RPS /
# _DURATION / _NODES / _RATIO_ASYNC / _RATIO_DYNAMIC_URL / _RATIO_AUTH_TOKEN /
# _RATIO_AUTH_BASIC / _RATIO_RMQ / _CH_NOLOSS (0|1) / _WITH_RMQ (0|1) / _P95_MS.
# Например, capacity-bench: LOADTEST_TARGET_RPS=600, LOADTEST_P95_MS=400.

loadtest:
  stage: integration
  # needs: [] — идёт параллельно остальным (в т.ч. integration). Это smoke с
  # allow_failure: соседние jobs на том же хосте могут просадить RPS — цифры
  # этого прогона индикативные; полноценный bench гонять RUN_PROFILE=loadtest-only.
  needs: []
  # docker:27-cli: client API v1.45 для docker daemon v25+. На v24-cli
  # `docker cp/rm` падали с «client version 1.43 is too old, minimum
  # supported API is 1.44» — отчёт report.json не копировался из контейнера.
  image:
    name: docker:27-cli
    pull_policy: [always, if-not-present]
  timeout: 60 minutes
  rules:
    - if: $RUN_PROFILE == "integration-only"
      when: never
    # Под RUN_PROFILE=loadtest-only — стартует без ручного клика.
    - if: $RUN_PROFILE == "loadtest-only"
      when: on_success
      allow_failure: true
    # Auto-run на push в master: smoke инфраструктуры. allow_failure — не gate
    # (RPS зависит от загрузки runner-host'а); полный bench гонять отдельно.
    - if: $CI_COMMIT_BRANCH == "master"
      when: on_success
      allow_failure: true
    # Auto-run на тег v* — так же, как на master (smoke-прогон, allow_failure, не gate).
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
      when: on_success
      allow_failure: true
    # Ручной запуск (кнопка ▶) на dev.
    - if: $CI_COMMIT_BRANCH == "dev"
      when: manual
      allow_failure: true
  variables:
    COMPOSE_PROJECT_NAME: "loadtest-${CI_PIPELINE_ID}-${CI_JOB_ID}"
    # COMPOSE_FILE поддерживает несколько файлов через ":" (Linux). Второй
    # override сбрасывает host-публикацию портов (см. docker-compose.loadtest.yml),
    # иначе CI пытается забиндить 5432/6379/8123/... — конфликт с зомби-контейнерами
    # или другими pipelines на runner-host.
    COMPOSE_FILE: "deploy/docker-compose.yml:deploy/docker-compose.loadtest.yml"
    # ВАЖНО: дефолты — smoke-test инфраструктуры в CI, не полноценный capacity-тест.
    # На self-hosted runner'е (общий docker daemon, параллельные builds, всё
    # на одной машине) реалистично 300-400 RPS — на 500 RPS pipeline валился
    # по `achieved < 95% of target` (см. §10.2 ТЗ acceptance criteria).
    # Полноценный bench по §10.2 (500 RPS / 5 мин) надо гонять локально или
    # на отдельном bench-стенде, передавая переменные через UI «Run pipeline».
    LOADTEST_TARGET_RPS: "300"
    LOADTEST_DURATION: "2m"
    LOADTEST_NODES: "50"
    # Полный микс трафика §10.2 (доли — независимые корзины, сумма ≤ 1; rmq
    # вырезается отдельно, http-остаток добивается plain sync). Здесь
    # упражняются все 6 режимов за один прогон.
    LOADTEST_RATIO_ASYNC: "0.25"
    LOADTEST_RATIO_DYNAMIC_URL: "0.2"
    LOADTEST_RATIO_AUTH_TOKEN: "0.2"
    LOADTEST_RATIO_AUTH_BASIC: "0.15"
    LOADTEST_RATIO_RMQ: "0.1"
    # no-loss async/rmq по ClickHouse (--ch-addr clickhouse:9000).
    LOADTEST_CH_NOLOSS: "1"
    # Потолок ожидания дренажа async/rmq-бэклога перед вердиктом no-loss.
    # При target_rps=300 в async-путь льётся ~117 msg/s (async ~87 + rmq ~30),
    # а consumer (instances=4, последовательный HTTP ~50мс) тянет ~50-70 msg/s →
    # за прогон копится бэклог ~7-8k, дренаж которого ≈145с. Дефолт cmd/loadtest
    # 120с обрезал слив и давал ЛОЖНЫЙ FAIL (count ещё рос = не потеря). Берём 5m
    # с запасом — проверка рано выходит по rows>=expected (чистый PASS).
    LOADTEST_CH_NOLOSS_MAX_WAIT: "5m"
    # Поднимаем rabbitmq (profile stand) и передаём --rmq-url/--ratio-rmq.
    LOADTEST_WITH_RMQ: "1"
    # Порог p95 (мс) для acceptance- и per-mode testcase'ов JUnit.
    LOADTEST_P95_MS: "200"
  before_script:
    # jq нужен в after_script для генерации JUnit-отчёта из report.json.
    - apk add --no-cache docker-cli-compose openssl jq
    - |
      if [ -z "$LOADTEST_ADMIN_PASSWORD" ]; then
        echo "LOADTEST_ADMIN_PASSWORD не задан в CI/CD Variables (masked+protected)" >&2
        exit 1
      fi
    # .env для compose-стека. Хосты — compose-имена сервисов; ENCRYPTION_KEY
    # эпemerный, его valid'ность нужна только на время прогона.
    - |
      cat > .env <<EOF
      VERSION=loadtest-${CI_PIPELINE_ID}
      PG_HOST=postgres
      PG_PORT=5432
      PG_USER=nexus
      PG_PASSWORD=loadtest_local_pg
      REDIS_HOST=redis
      REDIS_PORT=6379
      REDIS_PASSWORD=
      CH_HOST=clickhouse
      CH_PORT=9000
      CH_USER=default
      CH_PASSWORD=
      KAFKA_BROKERS=kafka:9092
      # Single-broker compose-стек: переопределяем prod-дефолты 3/2,
      # иначе bootstrap.MustEnsureKafkaTopics упадёт на InvalidReplicationFactor.
      KAFKA_TOPIC_REPLICATION_FACTOR=1
      KAFKA_TOPIC_MIN_INSYNC_REPLICAS=1
      SENTRY_USE=false
      SENTRY_DSN=
      SENTRY_ENVIRONMENT=loadtest
      ENCRYPTION_KEY=$(openssl rand -base64 32)
      RMQ_USER=nexus
      RMQ_PASSWORD=loadtest_local_rmq
      EOF
    - mkdir -p loadtest-report
  script:
    # ----- Pre-flight: показать окружение (без секретов) -----
    - echo "===== pre-flight ====="
    - echo "compose project = $COMPOSE_PROJECT_NAME"
    - echo "compose file    = $COMPOSE_FILE"
    - docker --version
    - docker compose version
    - 'echo "--- .env (с маскированными секретами) ---"'
    - sed -E 's/(PASSWORD|KEY)=.+/\1=***MASKED***/' .env
    - 'echo "--- /.env ---"'
    # ----- Шаг 1: docker compose up -----
    # При фейле `--wait` compose может оставить контейнеры в exited-state,
    # а после exit script'а GitLab всё равно вызовет after_script. Чтобы
    # ни одной строки логов не потерять — сразу после up (успешного или нет)
    # снимаем `docker compose logs` в файл артефакта. На случай если что-то
    # пойдёт не так в [2/4] или [3/4] — этот файл будет содержать стартовую
    # часть логов, а after_script допишет финальную.
    - echo "===== [1/4] docker compose up -d --build --wait (services depend on profile) ====="
    - |
      # rabbitmq живёт в compose-профиле stand — поднимаем его только для RMQ-профиля.
      WAIT_SVCS="postgres redis clickhouse kafka receiver sender web"
      PROFILE_ARGS=""
      if [ "$LOADTEST_WITH_RMQ" = "1" ]; then
        WAIT_SVCS="$WAIT_SVCS rabbitmq"
        PROFILE_ARGS="--profile stand"
      fi
      echo "--- wait services: $WAIT_SVCS (extra profiles: ${PROFILE_ARGS:-none}) ---"
      docker compose $PROFILE_ARGS up -d --build --wait $WAIT_SVCS
      rc=$?
      echo "--- compose up exit code = $rc ---"
      echo "--- compose ps -a (включая упавшие) ---"
      docker compose ps -a
      echo "--- compose ps -a --format Name/Status/Image ---"
      docker compose ps -a --format 'table {{.Name}}\t{{.Status}}\t{{.Image}}' || true
      echo "--- snapshot всех логов прямо сейчас (до возможной зачистки) ---"
      docker compose logs --no-color --timestamps > loadtest-report/compose-logs-after-up.txt 2>&1 || true
      ls -lh loadtest-report/compose-logs-after-up.txt
      if [ "$rc" -ne 0 ]; then
        echo "===== compose up FAILED — печатаю хвост 60 строк лога каждого сервиса ====="
        for svc in $WAIT_SVCS; do
          echo "----- logs: $svc (tail 60) -----"
          docker compose logs --no-color --tail=60 "$svc" 2>&1 || true
        done
        exit $rc
      fi
    - 'echo "--- images используются ---"'
    - docker compose images
    # ----- Шаг 2: bootstrap admin password -----
    # docker compose run НЕ заменяет ENTRYPOINT (он = `/usr/local/bin/web
    # --config /app/config/config.yml`), а только приклеивает args к нему.
    # Если передать полный путь явно — он станет лишним позиционным
    # аргументом, --set-admin-password потеряется, web стартует обычным
    # сервером и висит до timeout pipeline. timeout 60s страхует от
    # повторения этого сценария.
    - echo "===== [2/4] bootstrap admin password (timeout 60s) ====="
    - 'echo "запускаем: docker compose run --rm --no-deps web --set-admin-password ***"'
    - |
      timeout 60s docker compose run --rm --no-deps web \
        --set-admin-password "$LOADTEST_ADMIN_PASSWORD"
    - echo "--- admin password установлен; web-container, что мы вызывали, удалён (--rm) ---"
    # ----- Шаг 2.5 удалён: CH-таблицу логов создаёт сам cmd/loadtest -----
    # из канонной схемы (domain.RequiredLogColumns → RenderCreateTable), см.
    # cmd/loadtest/ensure_table.go. Раньше тут дублировался рукописный CREATE
    # TABLE, отстававший от схемы при добавлении колонок (напр. http_method §39)
    # → batch INSERT падал, no-loss валил job. Единый источник истины убирает
    # дрейф; таблица создаётся loadtest'ом при переданном --ch-addr (см. шаг 3).
    # ----- Шаг 3: запуск нагрузочного сценария -----
    - echo "===== [3/4] loadtest scenario ====="
    - echo "  target_rps = $LOADTEST_TARGET_RPS"
    - echo "  duration   = $LOADTEST_DURATION"
    - echo "  nodes      = $LOADTEST_NODES"
    - echo "  web        = http://web:8000"
    - echo "  receiver   = http://receiver:8080"
    - echo "  mock URL   = http://loadtest:9999"
    - 'echo "запускаем: docker compose --profile loadtest run loadtest ..."'
    # Один big-block: loadtest scenario + cp/rm отчёта + diagnostic. Иначе
    # GitLab `set -e` после первого non-zero exit (loadtest при fail-rate)
    # обрывает script — diagnostic не выполнялась. Тут exit code loadtest'а
    # запоминаем в LOADTEST_RC и пробрасываем в самом конце.
    - |
      set +e
      # Два НЕЗАВИСИМЫХ требования к сетевой/маршрутной части loadtest'а — оба
      # обязательны одновременно (исторически их путали друг с другом):
      #  1. --use-aliases — иначе `docker compose run --name X loadtest` не даёт
      #     one-off контейнеру network-alias `loadtest`, и Sender не дозвонится
      #     до mock'а (target_url=http://loadtest:9999) → StatusCode 0 → 502.
      #  2. --team-slug default — узлы создаются с path=loadtest/node-… (со
      #     слэшем) в команде default. Receiver-URL — /v1/request/{team_slug}/
      #     {node_path}; без слога первый сегмент (loadtest) трактуется как
      #     team_slug → узел не найден → 404 на КАЖДОМ запросе (error rate 100%,
      #     p50≈1.6мс). Фикс — в cmd/loadtest doRequest (флаг --team-slug).
      # NB: пост-прогонная diagnostic ниже НЕ проверяет связность с mock'ом —
      # mock живёт только пока крутится этот `run` (процесс самого loadtest'а),
      # к моменту diagnostic он уже мёртв (см. подробности там же).
      #
      # Профиль-зависимые флаги собираем в LT_ARGS (переменные не переживают
      # между отдельными `-` шагами — поэтому здесь, в одном блоке с run):
      #  - no-loss: --ch-addr clickhouse:9000 (сверка числа строк CH с async+rmq);
      #  - rmq: --ratio-rmq + --rmq-url к compose-сервису rabbitmq (creds из .env).
      LT_ARGS=""
      if [ "$LOADTEST_CH_NOLOSS" = "1" ]; then
        LT_ARGS="$LT_ARGS --ch-addr clickhouse:9000 --ch-user default --ch-flush-grace 15s --ch-noloss-max-wait ${LOADTEST_CH_NOLOSS_MAX_WAIT:-5m}"
      fi
      if [ "$LOADTEST_WITH_RMQ" = "1" ]; then
        LT_ARGS="$LT_ARGS --ratio-rmq $LOADTEST_RATIO_RMQ --rmq-url amqp://nexus:loadtest_local_rmq@rabbitmq:5672/"
      fi
      echo "  ratios     = async:$LOADTEST_RATIO_ASYNC dyn-url:$LOADTEST_RATIO_DYNAMIC_URL token:$LOADTEST_RATIO_AUTH_TOKEN basic:$LOADTEST_RATIO_AUTH_BASIC rmq:$LOADTEST_RATIO_RMQ"
      echo "  extra args = $LT_ARGS"
      docker compose --profile loadtest run \
        --use-aliases \
        --name "${COMPOSE_PROJECT_NAME}-loadtest-run" \
        loadtest \
          --web http://web:8000 \
          --receiver http://receiver:8080 \
          --team-slug default \
          --mock-bind 0.0.0.0:9999 \
          --mock-public-url http://loadtest:9999 \
          --admin-password "$LOADTEST_ADMIN_PASSWORD" \
          --target-rps "$LOADTEST_TARGET_RPS" \
          --duration "$LOADTEST_DURATION" \
          --nodes "$LOADTEST_NODES" \
          --ratio-async "$LOADTEST_RATIO_ASYNC" \
          --ratio-dynamic-url "$LOADTEST_RATIO_DYNAMIC_URL" \
          --ratio-auth-token "$LOADTEST_RATIO_AUTH_TOKEN" \
          --ratio-auth-basic "$LOADTEST_RATIO_AUTH_BASIC" \
          --cleanup=false \
          --report /tmp/report.json \
          $LT_ARGS
      LOADTEST_RC=$?
      echo "--- loadtest exit code = $LOADTEST_RC ---"

      # ----- Шаг 4: извлечь отчёт + логи из контейнера -----
      echo "===== [4/4] копируем report.json + логи из loadtest-контейнера ====="
      docker cp "${COMPOSE_PROJECT_NAME}-loadtest-run":/tmp/report.json loadtest-report/report.json || true
      # Логи самого run-контейнера (mock startup, "created N nodes", сам отчёт)
      # снимаем ДО docker rm — в `docker compose logs` его нет, после rm теряются.
      docker logs "${COMPOSE_PROJECT_NAME}-loadtest-run" > loadtest-report/loadtest-container.txt 2>&1 || true
      echo "--- размер артефактов ---"
      ls -lh loadtest-report/
      docker rm "${COMPOSE_PROJECT_NAME}-loadtest-run" || true
      echo "===== loadtest done ====="

      # ----- Диагностика: МАРШРУТИЗАЦИЯ Receiver'а (НЕ связность с mock'ом) -----
      # ВАЖНО: mock жил только во время `run` и к этому моменту уже мёртв,
      # поэтому upstream-связность здесь проверить НЕЛЬЗЯ, и 502 на receiver-
      # probe — ОЖИДАЕМО (sender не дозвонится до несуществующего mock'а).
      # Полезен именно код СТАТУСА маршрутизации:
      #   • 404/403/401 — баг в lookup/auth узла (например, неверный team_slug);
      #   • 502        — маршрут найден, упал только upstream → НОРМА для probe.
      # Реальные in-test ошибки смотри в loadtest-report/{report.json,
      # loadtest-container.txt,compose-logs.txt}, а не по коду этого probe.
      echo "===== diagnostic: sender DNS (long-lived сервисы) ====="
      docker compose exec -T sender getent hosts web 2>&1 || echo "(getent web → not found)"
      # `loadtest` тут заведомо отсутствует (one-off контейнер удалён) — не баг,
      # поэтому его и не пробуем: это лишь сбивало с толку в прошлых прогонах.

      echo "===== diagnostic: ноды в PostgreSQL ====="
      docker compose exec -T postgres psql -U nexus -d nexus -c "SELECT COUNT(*) AS total FROM nodes;" 2>&1
      docker compose exec -T postgres psql -U nexus -d nexus -c "SELECT path, target_url FROM nodes ORDER BY id DESC LIMIT 3;" 2>&1

      echo "===== diagnostic: receiver routing (со слогом vs legacy) ====="
      LOADTEST_PATH=$(docker compose exec -T postgres psql -U nexus -d nexus -t -c "SELECT path FROM nodes WHERE path LIKE 'loadtest/%' ORDER BY id DESC LIMIT 1;" 2>/dev/null | tr -d ' \n\r')
      echo "loadtest node path: '$LOADTEST_PATH'"
      if [ -n "$LOADTEST_PATH" ]; then
        echo "--- correct: /v1/request/default/$LOADTEST_PATH (ждём НЕ 404; 502=mock мёртв, маршрут ОК) ---"
        docker compose exec -T sender wget -S -O- --post-data='diag' \
          --header='Content-Type: application/octet-stream' \
          "http://receiver:8080/v1/request/default/$LOADTEST_PATH" 2>&1 | head -30
        echo "--- legacy: /v1/request/$LOADTEST_PATH (демонстрирует 404 от team_slug-парсинга) ---"
        docker compose exec -T sender wget -S -O- --post-data='diag' \
          --header='Content-Type: application/octet-stream' \
          "http://receiver:8080/v1/request/$LOADTEST_PATH" 2>&1 | head -15
      else
        echo "(loadtest_path пуст — нет нод в PG с префиксом loadtest/)"
      fi
      echo "===== /diagnostic ====="

      # Пробрасываем exit code loadtest'а наружу — pipeline остаётся красным
      # при fail-rate, но diagnostic сначала выполнится.
      exit "$LOADTEST_RC"
  after_script:
    # Финальный snapshot: что было в compose-стеке к моменту провала,
    # плюс хвост логов всех сервисов прямо в stdout job'а (без необходимости
    # лезть в артефакты ради первого диагноза).
    #
    # Важно: --profile loadtest НЕ используем для logs/ps/down — иначе compose
    # фильтрует на сервисы profile=loadtest (только loadtest-runner), а логи
    # postgres/redis/kafka/clickhouse/receiver/sender/web в файл не попадают.
    # Для down используем --profile "*" чтобы зачистить вообще всё, включая
    # loadtest-runner.
    - 'echo "===== after_script — финальное состояние compose-стека ====="'
    - docker compose ps -a || true
    - 'echo "===== inspect-таблица (Name / Status / Health / Image) ====="'
    - docker compose ps -a --format 'table {{.Name}}\t{{.Status}}\t{{.Image}}' || true
    # Полный лог (без --tail) — нужен для диагностики 100%-error прогонов:
    # tail 400 забивается Kafka offset-spam'ом, а ошибки sender/receiver
    # стартуют ровно во время loadtest scenario (~3-5 минут от старта стека).
    - docker compose logs --no-color > loadtest-report/compose-logs.txt 2>&1 || true
    - 'echo "===== compose-logs.txt (size) ====="'
    - ls -lh loadtest-report/compose-logs.txt || true
    - 'echo "===== ERR/WRN от receiver/sender/web (первые 100) ====="'
    - grep -E 'receiver-1 |sender-1 |web-1 ' loadtest-report/compose-logs.txt | grep -E 'ERR|WRN|error|failed' | head -100 || true
    - 'echo "===== /ERR/WRN ====="'
    - 'echo "===== compose-logs.txt (tail 200) ====="'
    - tail -n 200 loadtest-report/compose-logs.txt || true
    - 'echo "===== /compose-logs.txt ====="'
    # ----- JUnit-отчёт для GitLab Tests tab -----
    # Расширенный набор testcase'ов из report.json (§10.2):
    #   - 3 общих acceptance-кейса (achieved_rps / p95 / error_rate);
    #   - no_message_loss_async_rmq (если гонялась CH-сверка, .no_loss_checked);
    #   - per-mode p95 и error_rate на каждый режим (.modes из cmd/loadtest).
    # Suite назван по $CI_JOB_NAME — каждый профиль (loadtest/-mixed/-async/...)
    # отдельной вкладкой. Пороги совпадают с report.passed() в cmd/loadtest.
    # Если report.json не родился (compose up упал, loadtest не стартовал) —
    # один failure-кейс «infra unavailable» с указанием на compose-logs.txt.
    # jq печатает строки "name<TAB>ok(0|1)<TAB>msg", bash собирает XML и считает.
    - 'echo "===== генерируем loadtest-report/junit.xml ====="'
    - |
      REPORT=loadtest-report/report.json
      JUNIT=loadtest-report/junit.xml
      SUITE="${CI_JOB_NAME:-loadtest}"
      if [ ! -s "$REPORT" ]; then
        cat > "$JUNIT" <<EOF
      <?xml version="1.0" encoding="UTF-8"?>
      <testsuites name="${SUITE}" tests="1" failures="1">
        <testsuite name="infra" tests="1" failures="1">
          <testcase classname="loadtest.${SUITE}" name="report_produced">
            <failure message="report.json not found">loadtest не успел/не смог записать report.json — см. loadtest-report/compose-logs.txt и stdout job'а</failure>
          </testcase>
        </testsuite>
      </testsuites>
      EOF
      else
        TARGET="${LOADTEST_TARGET_RPS:-300}"
        P95MAX="${LOADTEST_P95_MS:-200}"
        jq -r --argjson target "$TARGET" --argjson p95max "$P95MAX" '
          def okf(c): if c then "1" else "0" end;
          ( "achieved_rps_at_least_95pct_of_target\t" + okf(.achieved_rps >= ($target*0.95)) + "\tachieved=\(.achieved_rps) min=\($target*0.95)" ),
          ( "p95_latency_under_\($p95max)ms\t" + okf(.p95_ms <= $p95max) + "\tp95=\(.p95_ms)ms" ),
          ( "error_rate_under_0.1pct\t" + okf(.error_rate < 0.001) + "\terror_rate=\(.error_rate) errors=\(.errors)/\(.sent)" ),
          ( if .no_loss_checked then ( "no_message_loss_async_rmq\t" + okf(.no_loss) + "\tch_rows=\(.ch_rows) expected_min=\(.no_loss_expected)" ) else empty end ),
          ( (.modes // {}) | to_entries[] |
              ( "p95_\(.key)_under_\($p95max)ms\t" + okf(.value.p95_ms <= $p95max) + "\tp95=\(.value.p95_ms)ms sent=\(.value.sent)" ),
              ( "error_rate_\(.key)_under_0.1pct\t" + okf(.value.error_rate < 0.001) + "\terror_rate=\(.value.error_rate) errors=\(.value.errors)/\(.value.sent)" )
          )
        ' "$REPORT" > loadtest-report/cases.tsv
        TESTS=0; FAILS=0; BODY=""
        TAB=$(printf '\t')
        while IFS="$TAB" read -r CASE_NAME CASE_OK CASE_MSG; do
          [ -z "$CASE_NAME" ] && continue
          TESTS=$((TESTS+1))
          EMSG=$(printf '%s' "$CASE_MSG" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')
          if [ "$CASE_OK" = "1" ]; then
            BODY="${BODY}    <testcase classname=\"loadtest.${SUITE}\" name=\"${CASE_NAME}\"><system-out>${EMSG}</system-out></testcase>\n"
          else
            FAILS=$((FAILS+1))
            BODY="${BODY}    <testcase classname=\"loadtest.${SUITE}\" name=\"${CASE_NAME}\"><failure message=\"${EMSG}\">acceptance §10.2</failure></testcase>\n"
          fi
        done < loadtest-report/cases.tsv
        {
          echo '<?xml version="1.0" encoding="UTF-8"?>'
          echo "<testsuites name=\"${SUITE}\" tests=\"${TESTS}\" failures=\"${FAILS}\">"
          echo "  <testsuite name=\"${SUITE}\" tests=\"${TESTS}\" failures=\"${FAILS}\">"
          printf "%b" "$BODY"
          echo "  </testsuite>"
          echo "</testsuites>"
        } > "$JUNIT"
      fi
      echo "--- junit.xml (preview) ---"
      cat "$JUNIT"
    - docker compose --profile "*" down -v --remove-orphans || true
    - rm -f .env
  artifacts:
    when: always
    paths:
      - loadtest-report/
    reports:
      junit: loadtest-report/junit.xml
    expire_in: 1 month

# ----------- SECURITY stage -------------------------------------------------
# Не блокируют merge (`allow_failure: true` где есть) — early-warning, не gate.
# Запускаются на master/dev push, по schedule (CI/CD → Schedules в UI GitLab,
# рекомендую weekly cron `0 6 * * 0`), и вручную с rule `when: manual`.
#
# Premium-фичи GitLab Ultimate (managed SAST/Dependency Scanning через
# Security/SAST.gitlab-ci.yml include) не используются, потому что
# self-hosted Community Edition их не поддерживает; вместо них — open-source
# инструменты тех же категорий.

.security-rules: &security-rules
  rules:
    - *skip-if-profiled-rule
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "dev"
    # Релизный пайплайн: security-сканеры (govulncheck/gosec/trivy-fs) идут и на
    # тегах vX.Y.Z — релиз должен быть просканирован (govulncheck остаётся гейтом).
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - go.mod
        - go.sum
        - web-ui/package-lock.json
        - Dockerfile
        - deploy/docker/*.Dockerfile
    - when: manual
      allow_failure: true

# govulncheck (golang.org/x/vuln) — официальный сканер Go-зависимостей с
# call-graph анализом: сопоставляет CVE с фактически вызываемым кодом, а не
# просто проверяет версии модулей. Падает на vuln — гейтит pipeline.
govulncheck:
  stage: security
  needs: []
  extends: .go-base
  <<: *security-rules
  script:
    - 'echo "===== installing govulncheck ====="'
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - $GOPATH/bin/govulncheck -version
    - 'echo "===== govulncheck ./... ====="'
    - $GOPATH/bin/govulncheck ./...
    - 'echo "===== govulncheck done (no vulns found) ====="'

# gosec — статический анализатор security-правил OWASP/CWE (G-серия).
# `-fmt sarif` для просмотра в IDE; `-fmt gitlab` для GitLab Security Dashboard
# (Premium-фича; на Community SARIF доступен как artifact).
#
# NB: используем golang:${GO_VERSION}-alpine, а не securego/gosec — последний
# идёт без Go toolchain, и gosec в этом образе не может разрешить `./...`
# через `go list` → «Files: 0, Lines: 0» и артефакты не создаются.
gosec:
  stage: security
  needs: []
  image:
    name: golang:${GO_VERSION}-alpine
    pull_policy: [always, if-not-present]
  <<: [*go-cache, *security-rules]
  allow_failure: true  # findings не блокируют — alerts only
  before_script:
    - apk add --no-cache git
    - go env -w GOPATH=$GOPATH GOCACHE=$GOCACHE GOMODCACHE=$GOMODCACHE
    - go mod download
    - go install github.com/securego/gosec/v2/cmd/gosec@latest
    # Stub-файлы, чтобы `artifacts.paths` всегда нашёл что выложить —
    # даже если gosec упал до записи отчётов.
    - touch gosec-results.sarif gosec-junit.xml
  script:
    # -exclude-dir=.cache КРИТИЧНО: GOMODCACHE задан как $CI_PROJECT_DIR/.cache/go-mod
    # (см. variables в шапке), и gosec без exclude лезет туда и сканирует все
    # зависимости — Go stdlib через toolchain, x/tools, swaggo testdata, grpc и т.п.
    # Результат: ~150 finding'ов из чужого кода, которые забивают вкладку Tests
    # и прячут реальные replied issues из нашего internal/ и cmd/.
    - 'echo "===== gosec -fmt=sarif ====="'
    - $GOPATH/bin/gosec -fmt=sarif -out=gosec-results.sarif -exclude-dir=.cache -exclude-dir=web-ui -exclude-dir=docs ./... || true
    - 'echo "===== gosec -fmt=junit-xml ====="'
    - $GOPATH/bin/gosec -fmt=junit-xml -out=gosec-junit.xml -exclude-dir=.cache -exclude-dir=web-ui -exclude-dir=docs ./... || true
    - 'echo "===== gosec output ====="'
    - ls -lh gosec-results.sarif gosec-junit.xml
    - 'echo "===== gosec done ====="'
  artifacts:
    when: always
    paths:
      - gosec-results.sarif
    reports:
      junit: gosec-junit.xml
    expire_in: 1 month

# Trivy filesystem scan — vulns (Go + npm) + secrets (приватные ключи) +
# misconfigs (Dockerfile, YAML). Дополняет govulncheck по non-Go-частям.
trivy-fs:
  stage: security
  needs: []
  image:
    name: aquasec/trivy:0.55.0
    entrypoint: [""]
    pull_policy: [always, if-not-present]
  <<: *security-rules
  allow_failure: true
  variables:
    # Trivy скачивает DB при каждом запуске; кеш ускоряет последующие jobs.
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/trivy"
  cache:
    key: trivy-db
    paths:
      - .cache/trivy
    policy: pull-push
  script:
    - 'echo "===== trivy version ====="'
    - trivy --version
    - 'echo "===== trivy fs scan (vuln+secret+misconfig, CRITICAL/HIGH/MEDIUM) ====="'
    - trivy fs
        --scanners vuln,secret,misconfig
        --severity CRITICAL,HIGH,MEDIUM
        --ignore-unfixed
        --format sarif
        --output trivy-fs.sarif
        --exit-code 0
        .
    - 'echo "===== trivy output ====="'
    - ls -lh trivy-fs.sarif
    - 'echo "===== trivy-fs done ====="'
  artifacts:
    when: always
    paths:
      - trivy-fs.sarif
    expire_in: 1 month

# Renovate Bot — self-hosted замена Dependabot для GitLab. Конфиг в
# renovate.json в корне. Запускается по schedule (CI/CD → Schedules в UI
# GitLab, рекомендую weekly `0 7 * * 1` — понедельник 07:00 UTC) и вручную.
#
# Required CI/CD Variables:
#   - RENOVATE_TOKEN — Project (или Group) Access Token со scope `api` +
#     `write_repository`; от него renovate создаёт MR.
#   - GITHUB_COM_TOKEN (опционально) — read-only token для github.com,
#     нужен для подтягивания CHANGELOG'ов npm-пакетов и release notes.
renovate:
  stage: security
  image:
    name: renovate/renovate:latest
    entrypoint: [""]
    pull_policy: [always, if-not-present]
  rules:
    - *skip-if-profiled-rule
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: manual
      allow_failure: true
  variables:
    LOG_LEVEL: info
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: "$CI_API_V4_URL"
    RENOVATE_AUTODISCOVER: "false"
    RENOVATE_REPOSITORIES: "$CI_PROJECT_PATH"
    # Авто-merge minor/patch держим OFF — пусть человек подтверждает.
    RENOVATE_AUTOMERGE: "false"
  script:
    - renovate

# Nancy (Sonatype OSS Index) убран: Sonatype начали возвращать 403 Forbidden
# для анонимных запросов, без OSS Index account скан не работает. CVE-покрытие
# Go-модулей закрывается govulncheck (NVD + call-graph анализ), vendor/npm —
# trivy. Если nancy потребуется вернуть — нужен OSS Index API token в
# Settings → CI/CD → Variables и передача через --username/--token.

# ----------- RELEASE ---------------------------------------------------------
# Отдельного release-job НЕТ. Раньше тег v* запускал GoReleaser, собиравший
# Docker-образы и публиковавший их в GitLab Container Registry — это требовало
# DinD/buildx/docker.io-auth на раннере и постоянно падало на инфре.
#
# Новый процесс: образы НЕ собираются в CI и НЕ кладутся в registry. Деплой —
# сборкой из исходников на сервере: `docker compose up -d --build` (версия
# вшивается из git, см. DEPLOYMENT.md §9.1). Тег v* остаётся маркером версии и
# прогоняет обычные test/lint/build для валидации.
