# GitLab CI/CD pipeline для DataBus (Phase 9.2).
#
# Аналог .github/workflows/{ci,security,release}.yml — один файл со всеми
# stages: test, lint, build, security, integration, release.
#
# Runner: self-hosted shell/docker executor с тегом `srv-d-android-l`.
# Для integration и release jobs требуется доступ к Docker daemon (либо
# docker.sock смонтирован в runner, либо services: [docker:dind] + privileged).
#
# Триггеры:
#   - push в любую ветку             → test, lint, build, swagger-drift, ui
#   - merge_request                  → то же + integration (по labels)
#   - schedule (weekly)              → security (govulncheck + gosec + trivy + nancy)
#   - tag v*                         → release (GoReleaser → GitLab Container Registry)
#
# Документация GitLab CI variables: https://docs.gitlab.com/ee/ci/variables/

variables:
  GO_VERSION: "1.25.7"
  NODE_VERSION: "20"
  # Локальный GOPATH/GOCACHE/GOMODCACHE — кешируется между jobs.
  GOPATH: "$CI_PROJECT_DIR/.cache/go"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
  # Глобально отключаем интерактивные prompt'ы apt/npm.
  DEBIAN_FRONTEND: noninteractive

default:
  # Все jobs запускаются на ноде srv-d-android-l (self-hosted runner).
  tags:
    - srv-d-android-l
  # Прерываемые при новом push в ту же ветку — экономит CI-минуты.
  interruptible: true

# concurrency-аналог: не запускать новый pipeline пока старый не завершился
# (для веток feature/*). Для master/tag — ждём, не отменяем.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

stages:
  - test
  - lint
  - build
  - security
  - integration
  - release

# ----------- Reusable anchors -----------------------------------------------

# Go-кэш: ускоряет `go mod download` и `go build` между jobs.
# GitLab кеширует tar-архив директорий между jobs одного pipeline и (при
# совпадении key) между разными pipelines.
.go-cache: &go-cache
  cache:
    key:
      files:
        - go.sum
    paths:
      - .cache/go-build
      - .cache/go-mod
    policy: pull-push

.go-base:
  image: golang:${GO_VERSION}
  <<: *go-cache
  before_script:
    - go env -w GOPATH=$GOPATH GOCACHE=$GOCACHE GOMODCACHE=$GOMODCACHE
    - go mod download

# ----------- TEST stage -----------------------------------------------------

go-test:
  stage: test
  extends: .go-base
  script:
    - go vet ./...
    - go test -race -short ./...

# ----------- LINT stage -----------------------------------------------------

go-lint:
  stage: lint
  image: golangci/golangci-lint:v1.62
  <<: *go-cache
  script:
    - golangci-lint run --timeout=5m

swagger-drift:
  stage: lint
  extends: .go-base
  script:
    - go install github.com/swaggo/swag/cmd/swag@v1.16.6
    - $GOPATH/bin/swag init -g cmd/web/main.go -o docs/web --parseDependency --parseDepth 2 --quiet
    - |
      if ! git diff --quiet docs/; then
        echo "swagger drift detected; run 'make swagger' locally and commit"
        git --no-pager diff --stat docs/
        exit 1
      fi

# ----------- BUILD stage ----------------------------------------------------

go-build:
  stage: build
  extends: .go-base
  script:
    # На Linux линкер не падает с OOM (грабля Windows из CLAUDE.md §6).
    - go build ./...

ui-build:
  stage: build
  image: node:${NODE_VERSION}
  cache:
    key:
      files:
        - web-ui/package-lock.json
    paths:
      - web-ui/node_modules
    policy: pull-push
  script:
    - cd web-ui
    - npm ci
    - npm run lint --if-present
    - npm run build
  artifacts:
    paths:
      - web-ui/dist
    expire_in: 1 week

# ----------- INTEGRATION stage ----------------------------------------------
# Тяжёлый job: PG + Redis + Kafka + ClickHouse через testcontainers-go.
# Требует доступа к Docker daemon. На self-hosted runner с shell-executor —
# работает если docker.sock доступен; на docker-executor — services dind +
# privileged: true (см. variables ниже).
#
# По умолчанию запускается на label `run-integration` для MR и всегда на
# master/dev/tag — аналогично GitHub workflow.

integration:
  stage: integration
  image: golang:${GO_VERSION}
  <<: *go-cache
  # Services-секцию активируйте если runner — docker-executor:
  # services:
  #   - name: docker:24-dind
  #     alias: docker
  # variables:
  #   DOCKER_HOST: "tcp://docker:2375"
  #   DOCKER_TLS_CERTDIR: ""
  #   TESTCONTAINERS_HOST_OVERRIDE: "docker"
  #   TESTCONTAINERS_RYUK_DISABLED: "true"
  timeout: 25 minutes
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_LABELS =~ /run-integration/
  before_script:
    - go env -w GOPATH=$GOPATH GOCACHE=$GOCACHE GOMODCACHE=$GOMODCACHE
    - go mod download
    # Pre-pull docker-образы — cached слои ускоряют testcontainers.
    - docker pull postgres:16-alpine || true
    - docker pull redis:7-alpine || true
    - docker pull confluentinc/confluent-local:7.5.0 || true
    - docker pull clickhouse/clickhouse-server:24-alpine || true
  script:
    - go test -tags=integration -timeout 20m -count=1 ./tests/integration/...

# ----------- SECURITY stage -------------------------------------------------
# Аналог .github/workflows/security.yml. Не блокируют merge — early-warning,
# не gate. Запускаются на master/dev push, по schedule (CI/CD → Schedules в UI
# GitLab, рекомендую weekly cron `0 6 * * 0`), и вручную через workflow_dispatch.
#
# Premium-фичи GitLab Ultimate (managed SAST/Dependency Scanning через
# Security/SAST.gitlab-ci.yml include) не используются, потому что
# self-hosted Community Edition их не поддерживает; вместо них — open-source
# инструменты тех же категорий.

.security-rules: &security-rules
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - go.mod
        - go.sum
        - web-ui/package-lock.json
        - Dockerfile
        - deploy/docker/*.Dockerfile
    - when: manual
      allow_failure: true

# govulncheck (golang.org/x/vuln) — официальный сканер Go-зависимостей с
# call-graph анализом: сопоставляет CVE с фактически вызываемым кодом, а не
# просто проверяет версии модулей. Падает на vuln — гейтит pipeline.
govulncheck:
  stage: security
  extends: .go-base
  <<: *security-rules
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@latest
    - $GOPATH/bin/govulncheck ./...

# gosec — статический анализатор security-правил OWASP/CWE (G-серия).
# `-fmt sarif` для просмотра в IDE; `-fmt gitlab` для GitLab Security Dashboard
# (Premium-фича; на Community SARIF доступен как artifact).
gosec:
  stage: security
  image: securego/gosec:latest
  <<: *security-rules
  allow_failure: true  # findings не блокируют — alerts only
  script:
    - gosec -fmt=sarif -out=gosec-results.sarif -exclude-dir=web-ui -exclude-dir=docs ./... || true
    - gosec -fmt=junit-xml -out=gosec-junit.xml -exclude-dir=web-ui -exclude-dir=docs ./... || true
  artifacts:
    when: always
    paths:
      - gosec-results.sarif
    reports:
      junit: gosec-junit.xml
    expire_in: 1 month

# Trivy filesystem scan — vulns (Go + npm) + secrets (приватные ключи) +
# misconfigs (Dockerfile, YAML). Дополняет govulncheck по non-Go-частям.
trivy-fs:
  stage: security
  image:
    name: aquasec/trivy:0.55.0
    entrypoint: [""]
  <<: *security-rules
  allow_failure: true
  variables:
    # Trivy скачивает DB при каждом запуске; кеш ускоряет последующие jobs.
    TRIVY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/trivy"
  cache:
    key: trivy-db
    paths:
      - .cache/trivy
    policy: pull-push
  script:
    - trivy --version
    - trivy fs
        --scanners vuln,secret,misconfig
        --severity CRITICAL,HIGH,MEDIUM
        --ignore-unfixed
        --format sarif
        --output trivy-fs.sarif
        --exit-code 0
        .
  artifacts:
    when: always
    paths:
      - trivy-fs.sarif
    expire_in: 1 month

# Renovate Bot — self-hosted замена Dependabot для GitLab. Конфиг в
# renovate.json в корне. Запускается по schedule (CI/CD → Schedules в UI
# GitLab, рекомендую weekly `0 7 * * 1` — понедельник 07:00 UTC) и вручную.
#
# Required CI/CD Variables:
#   - RENOVATE_TOKEN — Project (или Group) Access Token со scope `api` +
#     `write_repository`; от него renovate создаёт MR.
#   - GITHUB_COM_TOKEN (опционально) — read-only token для github.com,
#     нужен для подтягивания CHANGELOG'ов npm-пакетов и release notes.
renovate:
  stage: security
  image:
    name: renovate/renovate:latest
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: manual
      allow_failure: true
  variables:
    LOG_LEVEL: info
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: "$CI_API_V4_URL"
    RENOVATE_AUTODISCOVER: "false"
    RENOVATE_REPOSITORIES: "$CI_PROJECT_PATH"
    # Авто-merge minor/patch держим OFF — пусть человек подтверждает.
    RENOVATE_AUTOMERGE: "false"
  script:
    - renovate

# Nancy (Sonatype OSS Index) — дополнительный CVE-источник, перекрывает
# govulncheck по less-критичным. Не SARIF, просто фейлится по списку.
nancy:
  stage: security
  extends: .go-base
  <<: *security-rules
  allow_failure: true
  script:
    - go install github.com/sonatype-nexus-community/nancy@latest
    - go list -json -deps ./... | $GOPATH/bin/nancy sleuth --loud

# ----------- RELEASE stage --------------------------------------------------
# Триггерится тегом v*. Использует GoReleaser → GitLab Container Registry
# (registry.gitlab.com/<owner>/<repo>/{receiver,sender,web}) для docker-образов
# и GitLab Releases API для архивов / GitHub-style release page.
#
# Один .goreleaser.yaml работает и здесь, и в GitHub Actions: DOCKER_REGISTRY_BASE
# + COMPARE_URL_BASE передаются через env; GoReleaser автодетектит CI по наличию
# GITLAB_TOKEN.
#
# Требования к runner:
#   - доступ к Docker daemon (через docker:dind service или docker.sock).
#     По умолчанию настроен DinD; если runner — shell-executor с локальным
#     docker, services-блок можно удалить.
#   - привилегии на DinD (privileged: true в config.toml runner'а).
#
# Required CI/CD Variables (Settings → CI/CD → Variables):
#   - GITLAB_TOKEN — Project Access Token со scope `api` + `write_repository`;
#     нужен GoReleaser'у для создания release entry в GitLab.

release:
  stage: release
  image: goreleaser/goreleaser:v2
  services:
    - name: docker:24-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
    # Общий контракт с .github/workflows/release.yml — см. шапку .goreleaser.yaml.
    DOCKER_REGISTRY_BASE: $CI_REGISTRY_IMAGE
    COMPARE_URL_BASE: "$CI_PROJECT_URL/-/compare"
    # GoReleaser автодетектит GitLab по наличию GITLAB_TOKEN; для git operations
    # дополнительно требуется fetch-depth: 0 — в GitLab он по умолчанию.
    GIT_DEPTH: "0"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  timeout: 60 minutes
  before_script:
    - apk add --no-cache git
    # Multi-arch buildx (для linux/amd64 + linux/arm64). QEMU включается через
    # tonistiigi/binfmt — нужно privileged runner.
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --use --name multiarch --driver docker-container
    - docker buildx inspect --bootstrap
    # Login в GitLab Container Registry — переменные CI_REGISTRY_* предоставляются
    # GitLab автоматически (read+write для текущего проекта).
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - goreleaser release --clean
