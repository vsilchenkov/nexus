version: "2"
run:
  modules-download-mode: readonly
  tests: true
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - govet
    - ineffassign
    - misspell
    - nilerr
    - prealloc
    - revive
    - rowserrcheck
    - staticcheck
    - unconvert
    - unused
  settings:
    errcheck:
      check-blank: false
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net/http.ResponseWriter).Write
    revive:
      rules:
        - name: var-naming
        - name: exported
        - name: errorf
        - name: error-return
        - name: package-comments
          disabled: true
        - name: unused-parameter
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - revive
        path: _test\.go
      - linters:
          - revive
          - staticcheck
          - unused
        path: docs/
      - linters:
          - revive
          - staticcheck
          - unused
        path: proto/
    paths:
      - third_party$
      - builtin$
      - examples$
      - web-ui/node_modules
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - bus
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - web-ui/node_modules
