version: "2"
run:
  modules-download-mode: readonly
  tests: true
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - govet
    - ineffassign
    - misspell
    # modernize (x/tools gopls) — набор анализаторов «перепиши на современный Go»:
    # slices.Backward/Contains/Sort, maps.Collect, min/max, atomic.Int32 вместо
    # atomic.AddInt32(&int32), range-over-int, fmt.Appendf, strings.CutPrefix,
    # testing.Context, wg.Go и т.п. Пересекается с `go fix` (Go 1.26), но, в
    # отличие от него, работает как гейт CI и не правит чужие файлы (грабля из
    # CLAUDE.md «Процесс работы»). Настройками поддерживается ТОЛЬКО
    # `settings.modernize.disable` — списка `enable` в схеме нет, по умолчанию
    # включены все анализаторы. Ничего не глушим: на текущей кодовой базе набор
    # даёт 0 ложных срабатываний.
    - modernize
    - nilerr
    - prealloc
    - revive
    - rowserrcheck
    - staticcheck
    - unconvert
    - unused
  settings:
    errcheck:
      check-blank: false
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net/http.ResponseWriter).Write
    revive:
      rules:
        - name: var-naming
        - name: exported
        - name: errorf
        - name: error-return
        - name: package-comments
          disabled: true
        - name: unused-parameter
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - revive
        path: _test\.go
      - linters:
          - modernize
          - revive
          - staticcheck
          - unused
        path: docs/
      - linters:
          - modernize
          - revive
          - staticcheck
          - unused
        path: proto/
    paths:
      - third_party$
      - builtin$
      - examples$
      - web-ui/node_modules
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - bus
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - web-ui/node_modules
