<html lang="en" class="dark">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- §115.2: иконка — исходник в src/assets, Vite выпускает её хешированным
         /assets/nexus-<hash>.svg. Файл в корне (/nexus.svg) Web не отдаёт:
         embed.FS встраивает только index.html и assets/, остальное уходит в
         SPA-fallback и получает index.html вместо картинки. -->
    <link rel="icon" type="image/svg+xml" href="/assets/nexus-CdQGLfLT.svg" />
    <!-- Шрифты эталона (§21) с §89.1 лежат локально: web-ui/src/assets/fonts,
         подключаются из main.tsx и попадают в бандл (а оттуда в embed.FS).
         Внешних ссылок здесь быть не должно — интерфейс обязан выглядеть
         одинаково в изолированном контуре. -->
    <title>Nexus</title>
    <script type="module" crossorigin src="/assets/index-C61sRuo6.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-D-vWcR1A.css">
  </head>
