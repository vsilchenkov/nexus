// Sender Service gRPC API (§4.1 ТЗ).
//
// Версионирование: имя пакета содержит v1. Несовместимые изменения
// делаются в новом пакете nexus.sender.v2 — оба сервиса могут быть
// зарегистрированы параллельно.
syntax = "proto3";

package nexus.sender.v1;

option go_package = "nexus/proto/sender/v1;senderv1";

service SenderService {
  // Send выполняет один outbound-вызов внешнего узла.
  // Используется Receiver'ом для синхронных запросов (/v1/request/*).
  // Для async (/v1/requestAsync/*) Sender забирает сообщения из Kafka.
  rpc Send(SendRequest) returns (SendResponse);
}

// AuthConfig — параметры авторизации внешнего узла, разрешённой к этому
// конкретному запросу. Receiver уже разобрался с auth_type и собрал
// итоговый заголовок Authorization (или ничего, если auth_type=none).
message AuthConfig {
  // Готовое значение заголовка Authorization, либо пустая строка.
  // В таком виде Sender ничего не знает про режимы — просто пробрасывает.
  string authorization_header = 1;
}

message SendRequest {
  string id            = 1;  // UUID запроса, прокидываемый из Receiver'а
  string node_path     = 2;  // для логов и трассировки
  string target_url    = 3;  // фактический URL (после URL resolution)
  string method        = 4;  // HTTP-метод (POST, GET, PUT, ...)
  AuthConfig auth      = 5;
  map<string,string> headers = 6;  // forward_headers + Content-Type и т.п.
  bytes body           = 7;
  int32 timeout_ms     = 8;
  int32 retry_count    = 9;
  int32 retry_backoff_ms = 10;

  // Для логирования в ClickHouse-таблицу узла.
  string clickhouse_table = 20;
  bool log_request_body   = 21;
  bool log_response_body  = 22;
  bool log_headers        = 23;
  string client_ip        = 24;

  // §22: контроль логирования узла.
  bool logging_enabled       = 25;  // false → лог в ClickHouse не пишется совсем
  bool max_body_size_enabled = 26;  // включает обрезку сохраняемых тел
  int32 max_body_size        = 27;  // макс. число символов (рун) в request/response

  // §37: UUID узла — пишется в колонку node_id лог-таблицы, чтобы различать узлы,
  // делящие одну ClickHouse-таблицу (per-node атрибуция метрик/логов/очистки).
  string node_id = 28;

  // §39: подпуть запроса (хвост path-passthrough после пути узла), напр.
  // "v1/GetParcelsInfo". Пишется в колонку `method` лог-таблицы. Пусто у
  // обычных узлов. HTTP-глагол по-прежнему в поле method (= колонка http_method).
  string request_path = 29;

  // §55: вызов — тестовый (dry-run из UI), а не боевой трафик. Sender выполняет
  // реальный HTTP-запрос тем же клиентом, но НЕ оставляет следов на узле:
  //   - не пишет лог в ClickHouse (двойной гейт вместе с logging_enabled);
  //   - не пишет метрики (§6) и gauge исхода последнего вызова (§41/§52);
  //   - не персистит статус узла в Redis (§46);
  //   - не трогает circuit breaker (§9.5/§50.4) — ни Allow, ни Record*.
  // Иначе тест конфига по мёртвому адресу покрасил бы живой узел в Down и открыл
  // его breaker, начав отдавать 503 боевому трафику. Порядок деплоя: Sender → Web
  // (старый Sender поле проигнорирует и побочку не погасит).
  bool dry_run = 30;
}

message SendResponse {
  int32 status_code    = 1;
  bytes body           = 2;
  map<string,string> headers = 3;
  // Заполняется, если внешний узел не ответил (timeout, dns, и т.п.).
  // Receiver проксирует это как 502 (или 504, см. timeout).
  string error         = 4;
  int32 attempts       = 5;
  int32 duration_ms    = 6;
  // true — внешний узел не ответил именно по таймауту (истёк per-node
  // timeout_ms), а не по отказу соединения/DNS. Receiver отдаёт клиенту 504
  // вместо 502: для вызывающей стороны это разные ситуации (таймаут имеет
  // смысл повторить). Поле аддитивное — Sender старой версии его не заполняет,
  // и Receiver ведёт себя как раньше (502).
  bool timeout         = 7;
}
