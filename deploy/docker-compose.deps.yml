# Nexus — standalone-compose для зависимостей (Windows / Docker Desktop).
# Поднимает PostgreSQL, Redis, ClickHouse, Kafka (KRaft, single-broker) и
# Prometheus с пробросом портов на хост — чтобы локальные main'ы из
# cmd/{receiver,sender,web,loadtest} цеплялись по localhost:<port>.
#
# Файл самодостаточный: не зависит от docker-compose.yml. Используй его,
# когда сервисы Nexus запускаешь локально (VS Code debug / make run-*).
#
# Запуск:
#   docker compose -f deploy/docker-compose.deps.yml up -d
# Остановить:
#   docker compose -f deploy/docker-compose.deps.yml down
# Сбросить данные:
#   docker compose -f deploy/docker-compose.deps.yml down -v

name: nexus-deps

services:

  postgres:
    image: postgres:16-alpine
    container_name: nexus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-nexus}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-nexus}
      POSTGRES_DB: nexus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-nexus} -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [nexus_deps_net]

  redis:
    image: redis:7-alpine
    container_name: nexus_redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [nexus_deps_net]

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: nexus_clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: nexus_default
      CLICKHOUSE_USER: ${CH_USER:-default}
      CLICKHOUSE_PASSWORD: ${CH_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --host=127.0.0.1 --query='SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [nexus_deps_net]

  kafka:
    # Apache Kafka в KRaft-режиме (single-broker — для локальной разработки).
    # Два listener'а: PLAINTEXT://kafka:9092 (между контейнерами) и
    # EXTERNAL://localhost:29092 (для процессов на хосте). Но т.к. локальные
    # main'ы запускаются вне docker'а, использовать нужно localhost:9092 —
    # advertised listener ниже отдаёт именно его. Это намеренно: docker compose
    # стартует только kafka, никаких других контейнеров, которые ходили бы
    # внутрь сети, нет — поэтому single-listener "PLAINTEXT://localhost:9092"
    # покрывает всё.
    # §75: собственный образ = apache/kafka + Prometheus JMX-агент (размер топика
    # на диске есть только в JMX брокера). Порт 7071 проброшен на хост — на стенде
    # метрики удобно смотреть напрямую (`curl localhost:7071/metrics`), а сервисы
    # Nexus здесь запускаются вне docker'а.
    build:
      context: ..
      dockerfile: deploy/docker/kafka.Dockerfile
    image: nexus-kafka:latest
    container_name: nexus_kafka
    restart: unless-stopped
    environment:
      KAFKA_OPTS: "-javaagent:/opt/jmx/agent.jar=7071:/opt/jmx/kafka.yml"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: "4"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      # Брокерный дефолт retention. Топики nexus.* создаются приложением с ЯВНЫМ
      # конфигом (config.yml kafka.topic → CreateTopics); эти значения — запасной
      # потолок для прочих/авто-топиков и согласуют брокер с топик-конфигом:
      # 7 дней и 40 ГиБ на партицию (log.retention.bytes — per-partition).
      KAFKA_LOG_RETENTION_MS: "604800000"
      KAFKA_LOG_RETENTION_BYTES: "42949672960"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      # JVM heap брокера. Дефолт совпадает с тем, что подставляет сам
      # kafka-server-start.sh при незаданной переменной, — фиксируем явно, чтобы
      # бюджет памяти был виден в конфиге и переопределялся из .env (на слабой
      # машине разработчика — -Xmx512m -Xms256m, см. DEPLOYMENT.md §5.4).
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xmx1G -Xms1G}
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "9092:9092"
      - "7071:7071"   # §75: /metrics JMX-агента брокера
    healthcheck:
      # §75: `KAFKA_OPTS=` обязателен — иначе CLI-утилита поднимает свой
      # JMX-агент на занятом брокером порту 7071 и падает (см. корневой compose).
      # `KAFKA_HEAP_OPTS=` — чтобы разовая утилита не стартовала с брокерским
      # heap (`-Xms1G` каждые 10 секунд); пустое значение = дефолт CLI -Xmx256M.
      test: ["CMD-SHELL", "KAFKA_OPTS= KAFKA_HEAP_OPTS= /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [nexus_deps_net]

  # Prometheus поднимается под профилем `metrics`. По умолчанию выключен,
  # потому что scrape-таргеты в prometheus.yml — это контейнерные имена
  # (`receiver:8080`, `sender:9091`, `web:8000`), и из standalone-deps
  # сети они не видны. Если хочется метрик — добавь host.docker.internal
  # в prometheus.yml и подними под профилем:
  #   docker compose -f deploy/docker-compose.deps.yml --profile metrics up -d
  prometheus:
    profiles: ["metrics"]
    image: prom/prometheus:v2.55.0
    container_name: nexus_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-90d}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus.alerts.yml:/etc/prometheus/prometheus.alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [nexus_deps_net]

networks:
  nexus_deps_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  kafka_data:
  prometheus_data:
