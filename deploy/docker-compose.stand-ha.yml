# Nexus — СТЕНДОВЫЙ профиль двух реплик (§93) поверх уже поднятых зависимостей.
#
# Отличие от боевого deploy/docker-compose.ha.yml: здесь НЕ поднимаются
# PostgreSQL, Redis, ClickHouse и Prometheus — они уже работают на машине
# разработчика отдельным стеком (docs/STAND_TESTING.md), и контейнеры
# приложения подключаются к его сети.
#
# Kafka тоже берётся из того стека, но по ДРУГОМУ адресу: `kafka:29092`, а не
# `localhost:9092`. Брокер анонсирует два listener'а — localhost:9092 для
# нативных `make run-*` с хоста и kafka:29092 для контейнеров в его сети
# (e:/git_rep/services/docker-compose.yml). Одного мало: клиент идёт по
# АНОНСИРОВАННОМУ адресу, и с единственным advertised=localhost контейнер
# уходил бы на самого себя.
#
# Зачем отдельный файл: проверять выкат без простоя нужно на той же схеме, что
# и в бою — с nginx перед парами реплик, — но поднимать вторую копию Kafka и
# PostgreSQL на рабочей машине незачем, а порты они бы и не поделили.
#
# Запуск (из корня проекта):
#   docker compose -f deploy/docker-compose.stand-ha.yml up -d --build
#   curl http://localhost:8000/api/version
#
# Обновление по одной реплике (то, ради чего профиль и нужен):
#   COMPOSE_FILE=deploy/docker-compose.stand-ha.yml \
#     ./scripts/deploy/rolling.sh --skip-dump --skip-tag
#
# Остановить:
#   docker compose -f deploy/docker-compose.stand-ha.yml down
#
# Креды берутся из ../.env.stand (локальный стек зависимостей, НЕ боевые):
# у стенда свои пользователь/пароль PostgreSQL и Redis, поэтому боевой .env
# здесь не подходит — контейнеры не пройдут аутентификацию.
#
# ВАЖНО: перед запуском освободите порты 8000/8080 — нативные `make run-web` /
# `make run-receiver` их занимают, и контейнер nginx не поднимется.

name: nexus-stand

x-app-base: &app-base
  restart: unless-stopped
  # Сколько docker ждёт после SIGTERM, прежде чем убить процесс. Обязано быть
  # БОЛЬШЕ, чем shutdown.drain_sec + shutdown.timeout_sec из config.yml
  # (5 + 30 = 35 с), иначе весь graceful-путь §93.5 бессмыслен: дефолт движка
  # оборвал остановку прямо посреди дренажа, и запрос, который реплика в этот
  # момент доигрывала, терялся. Найдено стендовым прогоном — контейнер
  # останавливался за 1.5 с на паузе дренажа в 5 с.
  stop_grace_period: 45s
  env_file: ../.env.stand
  volumes:
    - ../config/config.yml:/app/config/config.yml:ro
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks: [services_default]

x-web-build: &web-build
  build:
    context: ..
    dockerfile: deploy/docker/web.Dockerfile
  image: nexus-web:latest

x-receiver-build: &receiver-build
  build:
    context: ..
    dockerfile: deploy/docker/receiver.Dockerfile
  image: nexus-receiver:latest

x-sender-build: &sender-build
  build:
    context: ..
    dockerfile: deploy/docker/sender.Dockerfile
  image: nexus-sender:latest

x-web-health: &web-health
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 15s

x-receiver-health: &receiver-health
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 15s

x-sender-health: &sender-health
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://localhost:9091/health"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 15s

services:

  nginx:
    build:
      context: ..
      dockerfile: deploy/docker/nginx.Dockerfile
    image: nexus-nginx:latest
    restart: unless-stopped
    environment:
      NEXUS_WEB_UPSTREAMS: "web-1:8000 web-2:8000"
      NEXUS_RECEIVER_UPSTREAMS: "receiver-1:8080 receiver-2:8080"
      NEXUS_UPSTREAM_MAX_FAILS: "2"
      NEXUS_UPSTREAM_FAIL_TIMEOUT: "10s"
    depends_on:
      web-1:      { condition: service_healthy }
      web-2:      { condition: service_started }
      receiver-1: { condition: service_healthy }
      receiver-2: { condition: service_started }
    ports:
      - "8000:8000"
      - "8080:8080"
    healthcheck:
      # 127.0.0.1, а НЕ localhost: nginx слушает только IPv4 (listen 8000), а
      # localhost в контейнере резолвится сначала в ::1 — busybox-wget уходит в
      # IPv6 и получает Connection refused. Контейнер при этом полностью
      # работоспособен, но вечно висит unhealthy.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [services_default]

  web-1:
    <<: [*app-base, *web-build, *web-health]
    networks:
      services_default:
        aliases: [web]

  web-2:
    <<: [*app-base, *web-build, *web-health]
    networks:
      services_default:
        aliases: [web]

  receiver-1:
    <<: [*app-base, *receiver-build, *receiver-health]
    networks:
      services_default:
        aliases: [receiver]

  receiver-2:
    <<: [*app-base, *receiver-build, *receiver-health]
    networks:
      services_default:
        aliases: [receiver]

  sender-1:
    <<: [*app-base, *sender-build, *sender-health]
    networks:
      services_default:
        aliases: [sender]

  sender-2:
    <<: [*app-base, *sender-build, *sender-health]
    networks:
      services_default:
        aliases: [sender]

networks:
  # Сеть стека зависимостей (docs/STAND_TESTING.md). external — её создаёт и
  # удаляет тот стек, а не этот файл.
  services_default:
    external: true
