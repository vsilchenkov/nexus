# Профиль небольшого сервера: 2 ГБ памяти, 2 ядра. Шаблон, лежит в репозитории.
#
# Как применить на сервере — два способа:
#
#   1. Скопировать в корень проекта, где Compose подхватит его АВТОМАТИЧЕСКИ
#      поверх docker-compose.yml, и запуск не изменится:
#         cp deploy/docker-compose.override.yml docker-compose.override.yml
#         docker compose up -d --build
#      Корневой docker-compose.override.yml в .gitignore — правки конкретного
#      сервера (свои лимиты, внешний PostgreSQL и т.п.) остаются локальными и
#      не конфликтуют при обновлении кода.
#
#   2. Либо подключать вторым -f, ничего не копируя:
#         docker compose -f docker-compose.yml -f deploy/docker-compose.override.yml up -d --build
#      Тогда этот -f нужно повторять в КАЖДОЙ команде compose (up, ps, logs,
#      build, run) — забыли в одной, и она отработает без профиля.
#
# Проверить, что получилось после наложения: `docker compose config`.
#
# Что здесь задано:
#   1. Kafka ужата с дефолтного heap 1 ГБ до 512 МБ — это главный рычаг: с
#      -Xmx1G -Xms1G брокер дорастает до ~1.2 ГБ RSS и в 2 ГБ стек не влезает.
#   2. Потолки памяти (mem_limit) на все контейнеры — чтобы при всплеске
#      падал один контейнер, а не ядро выбирало жертву само.
#   3. Prometheus хранит метрики 15 дней вместо 90 (панели смотрят максимум
#      7 дней) — TSDB ~0.07 ГБ вместо ~0.4 ГБ.
#
# PostgreSQL, Redis и Kafka остаются bundled-контейнерами этого же стека;
# внешним остаётся только ClickHouse (вариант C, DEPLOYMENT.md §5).
# Замеры компонентов и полный минимальный профиль — DEPLOYMENT.md §5.4.
#
# ВАЖНО про mem_limit: это потолки, а не резервирование. В простое весь стек
# занимает ~1 ГБ, но сумма потолков после подъёма обоих лимитов тела до 300 МиБ
# (sync И async, 1.34.0) — уже ~10.5 ГиБ (с §93, где receiver, sender и web идут
# в двух репликах, — ~16.7 ГиБ).
# Перед выкатом СВЕРЬТЕ это с фактической RAM сервера (free -g): потолок
# выше памяти не защищает, а переносит отказ с контейнера на весь хост.

services:

  # PostgreSQL — в Docker, как в базовом compose. Уменьшен shared_buffers:
  # дефолтные 128 МБ избыточны для конфига узлов и аудита при низкой нагрузке.
  # max_connections НЕ трогаем: дефолтные 100 должны покрывать суммарный
  # postgres.max_open_conns трёх сервисов (по умолчанию 25 × 3 = 75).
  postgres:
    command:
      - postgres
      - -c
      - shared_buffers=64MB
    mem_limit: 256m

  redis:
    mem_limit: 96m

  # С 1.34.0 Kafka везёт async-тела до 300 МиБ в base64-конверте, то есть
  # сообщения до 448 МиБ (kafka.topic.max_message_bytes). Брокер держит такое
  # сообщение в heap и на приёме, и на отдаче, поэтому прежние 512m heap / 768m
  # потолка (экономия под мелкие сообщения 16 МиБ) означали бы OutOfMemoryError
  # на первом же крупном async-запросе. Замер на стенде 02.09.2026: после
  # доставки сообщений на 420 МиБ контейнер держит ~832 МиБ.
  # Значение задано жёстко и перебивает KAFKA_HEAP_OPTS из .env — менять heap
  # на этом сервере нужно здесь. Если крупные async-тела на этом сервере не
  # нужны — снижайте ВМЕСТЕ receiver.max_async_body_bytes,
  # kafka.topic.max_message_bytes и эти два значения.
  kafka:
    environment:
      KAFKA_HEAP_OPTS: "-Xmx1792m -Xms512m"
    mem_limit: 2560m

  # 15 дней вместо 90: панели §21 показывают максимум 7 дней.
  prometheus:
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
    mem_limit: 192m

  # Go-сервисы: GOMEMLIMIT — мягкий потолок для GC, он начинает собирать
  # активнее, не дожидаясь удвоения heap. Ставится ниже mem_limit, чтобы
  # оставить запас на стеки горутин и буферы сетевых соединений.
  # Receiver держит тело sync-запроса целиком в памяти (io.ReadAll), а затем
  # ещё раз — при сериализации в gRPC-сообщение для Sender'а. При
  # receiver.max_body_bytes = 300 МиБ это две живые копии по 300 МиБ на один
  # запрос; прежние 1g давали OOM-kill в пике, без внятной ошибки клиенту.
  #
  # ASYNC дороже sync: к телу добавляются base64-конверт (+33%) и буфер
  # продьюсера kafka-go (BatchBytes = kafka.topic.max_message_bytes, 448 МиБ).
  # Замеры на стенде 02.09.2026 (тело 300 МиБ, GOMEMLIMIT как здесь):
  #   sync,  два одновременных — 1717 МиБ; три — 1835 МиБ;
  #   async, один — 1809 МиБ; два одновременных — 2679 МиБ.
  # Потолок 3072m оставляет ~390 МиБ запаса на двух одновременных async; при
  # большем потоке крупных тел поднимайте пропорционально либо ограничивайте
  # поток через receiver.rate_limit_per_node. С §93 (две реплики) умножайте на 2.
  receiver:
    environment:
      GOMEMLIMIT: 2400MiB
    mem_limit: 3072m

  # Sender держит самые крупные буферы: тело запроса приходит одним
  # gRPC-сообщением, тело ответа внешнего узла едет обратно тем же способом
  # (sender.grpc_max_message_bytes — 384 МиБ), плюс копится батч логов
  # ClickHouse. Если через шину ходят тела в сотни мегабайт — поднимайте
  # лимит здесь в первую очередь.
  # Замеры на стенде 02.09.2026 (тело 300 МиБ, GOMEMLIMIT как здесь):
  #   sync,  два одновременных — 2304 МиБ; три — 2488 МиБ;
  #   async (consumer читает сообщение до 448 МиБ и декодирует base64) — 2647 МиБ.
  # Ответ приёмника в замерах пустой; при крупном ОТВЕТЕ добавьте его размер —
  # тела запроса и ответа живут одновременно, и освобождать GC тогда нечего.
  # Расчёт: ~2.5 × max_body_bytes × число одновременных предельных запросов.
  sender:
    environment:
      GOMEMLIMIT: 2600MiB
    mem_limit: 3072m

  web:
    environment:
      GOMEMLIMIT: 150MiB
    mem_limit: 192m

# ─────────────────────────────────────────────────────────────────────────────
# Если на этом сервере PostgreSQL СВОЙ (не bundled-контейнер) — раскомментируйте
# блок ниже и задайте PG_HOST/PG_PORT/PG_USER/PG_PASSWORD в .env. Профиль
# "disabled" нигде не активируется, поэтому контейнер не стартует и не воюет
# за порт 5432 с хостовым PostgreSQL. depends_on переопределяется через
# !override (замена списка целиком, а не дополнение) — иначе сервисы будут
# вечно ждать healthcheck выключенного контейнера.
#
#  postgres:
#    profiles: ["disabled"]
#  receiver:
#    depends_on: !override
#      redis:
#        condition: service_healthy
#      sender:
#        condition: service_started
#  sender:
#    depends_on: !override
#      kafka:
#        condition: service_healthy
#  web:
#    depends_on: !override
#      redis:
#        condition: service_healthy
