# Nexus — production-style compose-стек.
# Запуск: docker compose -f deploy/docker-compose.yml up -d
# Все секреты — через .env (рядом с этим файлом или в корне проекта).
#
# container_name намеренно НЕ задан ни для одного сервиса: GitLab CI loadtest
# job задаёт уникальный COMPOSE_PROJECT_NAME=loadtest-<pipeline>-<job>, и docker
# compose автоматически генерирует имена `<project>-<service>-<n>` — параллельные/
# последовательные pipelines не конфликтуют. Локально `docker compose up` тоже
# работает: project_name берётся из `name: nexus` (см. ниже), имена будут
# `nexus-postgres-1`, `nexus-redis-1` и т.д.

name: nexus

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-nexus}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-nexus}
      POSTGRES_DB: nexus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-nexus} -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [nexus_net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [nexus_net]

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: nexus_default
      CLICKHOUSE_USER: ${CH_USER:-default}
      CLICKHOUSE_PASSWORD: ${CH_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # clickhouse-client всегда есть в образе clickhouse-server, в отличие
      # от wget — в alpine-варианте 24+ его выпилили из base layer'а.
      # --host=127.0.0.1 принудительно по TCP 9000, чтобы не тянуть зависимость
      # от HTTP-listener'а.
      test: ["CMD-SHELL", "clickhouse-client --host=127.0.0.1 --query='SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [nexus_net]

  kafka:
    # Официальный Apache Kafka в KRaft-режиме (single-broker для dev).
    # Bitnami сняли публичные теги bitnami/kafka в августе 2025 — переходим
    # на upstream apache/kafka. ENV-переменные тут без префикса _CFG_ (это
    # был bitnami'evский wrapper); CLUSTER_ID зашит, чтобы volume не
    # инициализировался под новый ID при пересоздании контейнера.
    # §75: собственный образ = apache/kafka + Prometheus JMX-агент (размер топика
    # на диске есть только в JMX брокера). Пересоздание контейнера обязательно —
    # javaagent грузится при старте JVM.
    build:
      context: ..
      dockerfile: deploy/docker/kafka.Dockerfile
    image: nexus-kafka:latest
    restart: unless-stopped
    environment:
      # §75: /metrics агента на 7071 внутри сети (job `kafka-jmx` в prometheus.yml).
      KAFKA_OPTS: "-javaagent:/opt/jmx/agent.jar=7071:/opt/jmx/kafka.yml"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: "4"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      # Брокерский потолок размера сообщения. Должен быть НЕ МЕНЬШЕ per-topic
      # max.message.bytes (config.yml kafka.topic.max_message_bytes = 16 МиБ),
      # иначе брокерский дефолт (~1 МиБ) перебивает топик-конфиг и отвергает
      # крупные сообщения ("Message Size Too Large"). Бьёт по §38 durable-retry:
      # при недоступности CH под нагрузкой Sender шлёт проваленные батчи логов
      # (с телами request/response, до ~неск. МБ) в nexus.logs.retry — без этого
      # они отвергаются и теряются. replica.fetch.max.bytes держим >= того же
      # (нужно для репликации при RF>1; для single-broker не вредит).
      # 16 МиБ = receiver.max_body_bytes (10 МиБ, §68 multipart) × 1.33 (base64
      # async-envelope) + запас.
      KAFKA_MESSAGE_MAX_BYTES: "16777216"
      KAFKA_REPLICA_FETCH_MAX_BYTES: "16777216"
      # Брокерный дефолт retention. Топики nexus.* создаются приложением с ЯВНЫМ
      # конфигом (config.yml kafka.topic → CreateTopics); эти значения — запасной
      # потолок для прочих/авто-топиков и согласуют брокер с топик-конфигом:
      # 7 дней и 40 ГиБ на партицию (log.retention.bytes — per-partition).
      KAFKA_LOG_RETENTION_MS: "604800000"
      KAFKA_LOG_RETENTION_BYTES: "42949672960"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      # JVM heap брокера. Дефолт совпадает с тем, что подставляет сам
      # kafka-server-start.sh при незаданной переменной, — фиксируем явно, чтобы
      # бюджет памяти был виден в конфиге и переопределялся из .env. На сервере
      # 2 ГБ — -Xmx512m -Xms256m (DEPLOYMENT.md §5.4).
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xmx1G -Xms1G}
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "9092:9092"
    healthcheck:
      # §75: `KAFKA_OPTS=` обязателен — иначе CLI-утилита поднимает свой
      # JMX-агент на занятом брокером порту 7071 и падает (см. корневой compose).
      # `KAFKA_HEAP_OPTS=` — по той же причине: разовая утилита наследовала бы
      # бюджет памяти брокера. Замер: 122 МБ RSS против 91 МБ с дефолтом утилит
      # (`-Xms` коммитит адресное пространство, но физически страницы за ~1.2 с
      # не трогаются). Мелочь, которая на сервере 2 ГБ идёт поверх брокера каждые
      # 10 секунд, а при vm.overcommit_memory=2 может не дать утилите стартовать.
      # Пустое значение = дефолт CLI -Xmx256M. Подробности — корневой compose.
      test: ["CMD-SHELL", "KAFKA_OPTS= KAFKA_HEAP_OPTS= /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [nexus_net]

  prometheus:
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-90d}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus.alerts.yml:/etc/prometheus/prometheus.alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    networks: [nexus_net]

  # RabbitMQ — только для ручного тестирования узлов RabbitMQAsync на стенде
  # (docs/STAND_TESTING.md). Под профилем `stand`, чтобы обычный
  # `docker compose up` его не поднимал. Запуск: добавить `--profile stand`.
  # Management UI: http://localhost:15672 (guest/guest).
  rabbitmq:
    profiles: ["stand"]
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [nexus_net]

  receiver:
    build:
      context: ..
      dockerfile: deploy/docker/receiver.Dockerfile
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      sender:   { condition: service_started }
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks: [nexus_net]

  sender:
    build:
      context: ..
      dockerfile: deploy/docker/sender.Dockerfile
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      postgres:   { condition: service_healthy }
      kafka:      { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    ports:
      - "9190:9190"
      - "9093:9091"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks: [nexus_net]

  web:
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks: [nexus_net]

  # Loadtest — сценарный тест производительности (§10.2 ТЗ).
  # Поднимается только под профилем `loadtest`, чтобы обычный
  # `docker compose up` его не активировал. Запуск:
  #   docker compose --profile loadtest run --rm loadtest \
  #     --web http://web:8000 --receiver http://receiver:8080 \
  #     --mock-bind 0.0.0.0:9999 --mock-public-url http://loadtest:9999 \
  #     --admin-password "$LOADTEST_ADMIN_PASSWORD" ...
  loadtest:
    profiles: ["loadtest"]
    build:
      context: ..
      dockerfile: deploy/docker/loadtest.Dockerfile
    restart: "no"
    depends_on:
      receiver: { condition: service_healthy }
      sender:   { condition: service_healthy }
      web:      { condition: service_healthy }
    networks: [nexus_net]

networks:
  nexus_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  kafka_data:
  prometheus_data:
