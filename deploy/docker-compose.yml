# DataBus — production-style compose-стек.
# Запуск: docker compose -f deploy/docker-compose.yml up -d
# Все секреты — через .env (рядом с этим файлом или в корне проекта).

name: databus

services:

  postgres:
    image: postgres:16-alpine
    container_name: databus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-databus}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-databus}
      POSTGRES_DB: databus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-databus} -d databus"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [databus_net]

  redis:
    image: redis:7-alpine
    container_name: databus_redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [databus_net]

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: databus_clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: vika_logs
      CLICKHOUSE_USER: ${CH_USER:-default}
      CLICKHOUSE_PASSWORD: ${CH_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # clickhouse-client всегда есть в образе clickhouse-server, в отличие
      # от wget — в alpine-варианте 24+ его выпилили из base layer'а.
      # --host=127.0.0.1 принудительно по TCP 9000, чтобы не тянуть зависимость
      # от HTTP-listener'а.
      test: ["CMD-SHELL", "clickhouse-client --host=127.0.0.1 --query='SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [databus_net]

  kafka:
    # Официальный Apache Kafka в KRaft-режиме (single-broker для dev).
    # Bitnami сняли публичные теги bitnami/kafka в августе 2025 — переходим
    # на upstream apache/kafka. ENV-переменные тут без префикса _CFG_ (это
    # был bitnami'evский wrapper); CLUSTER_ID зашит, чтобы volume не
    # инициализировался под новый ID при пересоздании контейнера.
    image: apache/kafka:3.9.0
    container_name: databus_kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: "4"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [databus_net]

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: databus_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus.alerts.yml:/etc/prometheus/prometheus.alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    networks: [databus_net]

  receiver:
    build:
      context: ..
      dockerfile: deploy/docker/receiver.Dockerfile
    container_name: databus_receiver
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      sender:   { condition: service_started }
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [databus_net]

  sender:
    build:
      context: ..
      dockerfile: deploy/docker/sender.Dockerfile
    container_name: databus_sender
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      postgres:   { condition: service_healthy }
      kafka:      { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    ports:
      - "9090:9090"
      - "9093:9091"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [databus_net]

  web:
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
    container_name: databus_web
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [databus_net]

  # Loadtest — сценарный тест производительности (§10.2 ТЗ).
  # Поднимается только под профилем `loadtest`, чтобы обычный
  # `docker compose up` его не активировал. Запуск:
  #   docker compose --profile loadtest run --rm loadtest \
  #     --web http://web:8000 --receiver http://receiver:8080 \
  #     --mock-bind 0.0.0.0:9999 --mock-public-url http://loadtest:9999 \
  #     --admin-password "$LOADTEST_ADMIN_PASSWORD" ...
  loadtest:
    profiles: ["loadtest"]
    build:
      context: ..
      dockerfile: deploy/docker/loadtest.Dockerfile
    # container_name намеренно не задан: GitLab CI добавляет COMPOSE_PROJECT_NAME
    # с уникальным префиксом, и docker сам присвоит уникальное имя
    # `<project>-loadtest-<n>` — параллельные запуски не конфликтуют.
    restart: "no"
    depends_on:
      receiver: { condition: service_healthy }
      sender:   { condition: service_healthy }
      web:      { condition: service_healthy }
    networks: [databus_net]

networks:
  databus_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:
  kafka_data:
  prometheus_data:
