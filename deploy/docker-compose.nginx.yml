# Снятие публикации портов у web/receiver — вторая половина включения nginx.
#
# Сам сервис nginx живёт в КОРНЕВОМ docker-compose.yml под `profiles: ["nginx"]`
# (см. комментарий там). Здесь только то, чего профиль сделать не может:
# профиль решает, поднимать ли сервис, но НЕ меняет поля соседних сервисов.
#
# Пока nginx активен, 8000 и 8080 занимает он, поэтому у web и receiver
# публикация должна быть снята. `!override` заменяет список ЦЕЛИКОМ — без тега
# пустой список слился бы с корневым, порт остался бы занят, и балансировщик не
# поднялся бы с «port is already allocated».
#
# ВКЛЮЧЕНИЕ — оба действия обязательны:
#   COMPOSE_PROFILES=nginx
#   COMPOSE_FILE=docker-compose.yml:deploy/docker-compose.nginx.yml:docker-compose.override.yml
# в .env, либо то же самое флагами:
#   docker compose --profile nginx \
#                  -f docker-compose.yml \
#                  -f deploy/docker-compose.nginx.yml \
#                  -f docker-compose.override.yml up -d --build
#
# ⚠️ При ЯВНЫХ `-f` корневой docker-compose.override.yml НЕ подхватывается сам —
# указывайте его последним, иначе локальные настройки сервера (внешний
# PostgreSQL, ClickHouse в стеке, лимиты) молча пропадут.
#
# ⚠️ ПОРТ 8080 МЕНЯЕТ ПРИВЯЗКУ. В корневом файле `receiver` публикует 8080 на
# 0.0.0.0, а nginx слушает его только на 127.0.0.1 (RECEIVER_BIND). Клиенты,
# ходящие прямо в Receiver по :8080, перестанут достукиваться — проверьте ДО
# выката: `ss -tnp 'sport = :8080' | head`. Если такие есть, поставьте в .env
# RECEIVER_BIND=0.0.0.0; правильный путь — раздать им адрес вида
# https://<хост>/api/v1/<команда>/<путь>.
#
# ОТКАТ: убрать COMPOSE_PROFILES и этот файл из COMPOSE_FILE, затем
# `docker compose up -d` — публикация вернётся к web/receiver. Остановленный
# контейнер балансировщика удаляется `docker compose rm -f nginx`.

services:

  web:
    ports: !override []

  receiver:
    ports: !override []
