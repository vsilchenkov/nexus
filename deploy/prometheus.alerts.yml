# Prometheus alert rules для Nexus (§6 ТЗ + §9 SLO).
#
# Подключается в prometheus.yml:
#
#   rule_files:
#     - prometheus.alerts.yml
#
# В docker-compose обе папки монтируются read-only в /etc/prometheus/.
groups:
  - name: nexus.slo
    interval: 30s
    rules:

      # ----- Sync RPS / latency / error rate -----

      - alert: NexusReceiverDown
        expr: up{job="nexus-receiver"} == 0
        for: 2m
        labels:
          severity: critical
          service: receiver
        annotations:
          summary: "Receiver instance is unreachable"
          description: "Prometheus cannot scrape /metrics for {{ $labels.instance }} for 2 minutes."

      - alert: NexusSenderDown
        expr: up{job="nexus-sender"} == 0
        for: 2m
        labels:
          severity: critical
          service: sender
        annotations:
          summary: "Sender instance is unreachable"
          description: "Prometheus cannot scrape /metrics for {{ $labels.instance }} for 2 minutes."

      - alert: NexusHighErrorRate
        # >5% 5xx за 5 минут на синхронном пути — выше SLO §9.1.
        expr: |
          (
            sum by (service) (rate(nexus_requests_total{status=~"5..|0"}[5m]))
            /
            sum by (service) (rate(nexus_requests_total[5m]))
          ) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} 5xx rate > 5% for 10m"
          description: "Aggregate error rate across all nodes is breaching the SLO."

      - alert: NexusP95LatencyHigh
        # p95 end-to-end > 200ms за 5 мин — упрёт против §9.1 «p95 ≤ 200ms».
        expr: |
          histogram_quantile(0.95,
            sum by (service, le) (rate(nexus_request_duration_seconds_bucket{method="request"}[5m]))
          ) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} sync p95 latency > 200ms"
          description: "Sync request p95 over the last 5 minutes is above the 200ms SLO."

      # ----- Async backlog -----

      - alert: NexusKafkaLagHigh
        # >10k unprocessed сообщений на партицию для 5 минут — async очередь не успевает.
        expr: max by (topic, partition) (nexus_kafka_lag) > 10000
        for: 5m
        labels:
          severity: warning
          service: sender
        annotations:
          summary: "Kafka lag > 10k messages on {{ $labels.topic }}/{{ $labels.partition }}"
          description: "Sender-consumer is falling behind; check downstream upstream latency or scale consumer instances."

      # ----- ClickHouse health -----

      - alert: NexusClickHouseErrors
        # Любая стабильная скорость ошибок батчей CH > 0.1/sec — недоступность.
        expr: sum by (service) (rate(nexus_clickhouse_errors_total[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
          service: sender
        annotations:
          summary: "ClickHouse batch insert errors on {{ $labels.service }}"
          description: "Sender is failing CH inserts. File-fallback is engaged; check ClickHouse cluster health."

      - alert: NexusClickHouseBufferGrowing
        # 90% от buffer_max_size — близко к drop-точке.
        expr: max by (table) (nexus_clickhouse_buffer_size) > 90000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CH buffer for {{ $labels.table }} is near max"
          description: "Buffer is above 90k rows; next overflow will start writing NDJSON fallback files."

      - alert: NexusClickHouseDropped
        # >0 — значит логи теряются.
        expr: sum by (service, table) (increase(nexus_clickhouse_dropped_total[5m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Log records dropped for table {{ $labels.table }}"
          description: "Nexus is dropping log records (buffer full or empty_table). Check CH writer health."

      # ----- L2 cache health (§9.2, Phase 7.2) -----

      - alert: NexusL2CacheStaleFallback
        # Stale-fallback срабатывает = downstream (Redis + PG) лежат.
        expr: sum(rate(nexus_l2_cache_hits_total{kind="stale"}[5m])) > 0.1
        for: 5m
        labels:
          severity: critical
          service: receiver
        annotations:
          summary: "Receiver is serving stale node configs from L2"
          description: "Redis + PostgreSQL are unavailable; Receiver falls back to expired LRU entries."

  - name: nexus.nodes
    interval: 30s
    rules:

      # ----- Per-node delivery health (сторона Sender) -----

      - alert: NexusNodeDown
        # Последний исходящий запрос к узлу — transport error или 5xx (gauge=2) дольше 5 минут.
        # for=5m: gauge отражает только ПОСЛЕДНИЙ запрос, одиночный сбой при низком трафике не должен будить.
        expr: max by (node) (nexus_node_last_request_error) == 2
        for: 5m
        labels:
          severity: critical
          service: sender
        annotations:
          summary: "Node {{ $labels.node }} is DOWN (transport error or 5xx)"
          description: "Sender's last outbound request to the node keeps failing with a transport error or 5xx for 5 minutes."

      - alert: NexusNodeDegraded
        # Последний запрос — non-2xx < 500 (gauge=1): узел жив, но отвечает ошибками (auth/данные/конфиг upstream).
        expr: max by (node) (nexus_node_last_request_error) == 1
        for: 15m
        labels:
          severity: warning
          service: sender
        annotations:
          summary: "Node {{ $labels.node }} is degraded (non-2xx responses)"
          description: "Node answers with 3xx/4xx for 15 minutes; upstream misconfiguration or auth issue is likely."

      - alert: NexusNodeHighErrorRate
        # >20% неуспешных доставок на узел за 10 минут при заметном трафике (>0.05 rps — guard от шума).
        expr: |
          (
            sum by (node) (rate(nexus_request_incomplete_total{service="sender"}[10m]))
            /
            sum by (node) (rate(nexus_requests_total{service="sender"}[10m]))
          ) > 0.2
          and
          sum by (node) (rate(nexus_requests_total{service="sender"}[10m])) > 0.05
        for: 10m
        labels:
          severity: warning
          service: sender
        annotations:
          summary: "Node {{ $labels.node }} error rate > 20% for 10m"
          description: "More than 20% of outbound requests to the node are non-2xx (traffic guard: >0.05 rps)."

      # ----- RabbitMQ pull-узлы (сторона Receiver) -----

      - alert: NexusRMQNodeDisconnected
        # Соединение с RMQ узла в состоянии down (0) 5 минут — pull-сообщения не идут.
        expr: max by (node) (nexus_rmq_connection_state) == 0
        for: 5m
        labels:
          severity: critical
          service: receiver
        annotations:
          summary: "RMQ connection for node {{ $labels.node }} is down"
          description: "Receiver cannot connect to the node's RabbitMQ for 5 minutes; pulled messages are not flowing."

      - alert: NexusPullNodeDegraded
        # Receiver пометил pull-узел деградировавшим (nexus_node_degraded=1).
        expr: max by (node, reason) (nexus_node_degraded) == 1
        for: 10m
        labels:
          severity: warning
          service: receiver
        annotations:
          summary: "Pull node {{ $labels.node }} degraded ({{ $labels.reason }})"
          description: "RabbitMQAsync pull node is marked degraded for 10 minutes."

      - alert: NexusRMQQueueBacklog
        # Очередь узла копится (>10k) — consumer не успевает или стоит.
        expr: max by (node) (nexus_rmq_queue_depth) > 10000
        for: 10m
        labels:
          severity: warning
          service: receiver
        annotations:
          summary: "RMQ queue for node {{ $labels.node }} > 10k messages"
          description: "Queue depth is above 10k for 10 minutes; check consumer count and pull errors."

      # ----- DLQ reprocess (сторона Sender) -----

      - alert: NexusDLQReprocessFailing
        # Повторная доставка из DLQ стабильно фейлится 10 минут.
        expr: sum by (node) (increase(nexus_dlq_reprocess_total{result="failed"}[10m])) > 0
        for: 10m
        labels:
          severity: warning
          service: sender
        annotations:
          summary: "DLQ reprocess keeps failing for node {{ $labels.node }}"
          description: "DLQ messages for the node fail redelivery for 10+ minutes; they will eventually hit TTL."

      - alert: NexusDLQMessagesLost
        # ttl_dropped/dropped = сообщение потеряно навсегда — потеря данных по узлу.
        expr: sum by (node, result) (increase(nexus_dlq_reprocess_total{result=~"ttl_dropped|dropped"}[10m])) > 0
        for: 0m
        labels:
          severity: critical
          service: sender
        annotations:
          summary: "DLQ messages dropped for node {{ $labels.node }} ({{ $labels.result }})"
          description: "Async messages were permanently dropped from the DLQ; data loss for this node."

      # ----- Состояние схемы PostgreSQL (§74.3) -----

      - alert: NexusSchemaAheadOfBinary
        # Схема в БД новее каталога миграций сервиса = откат кода выполнен, а
        # схема осталась от новой версии. Само по себе рабочее состояние (схема
        # обратно совместима по §74.2), но временное: держится дольше 15 минут —
        # значит про откат забыли. Порядок действий — DEPLOYMENT.md §10.
        expr: max by (service, nexus_instance) (nexus_pg_schema_ahead) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service }} runs on a schema newer than its build"
          description: "The PostgreSQL schema version is ahead of this build's migrations. Finish the rollback (roll the schema back with the NEW image) or move the service forward again — see DEPLOYMENT.md §10."
