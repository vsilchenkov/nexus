# Nexus — compose ТОЛЬКО для трёх сервисов приложения (receiver, sender, web).
# Зависимости (PostgreSQL, Redis, ClickHouse, Kafka) НЕ поднимаются — они
# внешние. Адреса/логины/пароли внешних сервисов задаются через ../.env
# (PG_HOST, REDIS_HOST, CH_HOST, KAFKA_BROKERS и пароли).
#
# Запуск:
#   docker compose -f deploy/docker-compose.app.yml up -d --build
# Остановить:
#   docker compose -f deploy/docker-compose.app.yml down
#
# Если внешние сервисы крутятся на самом docker-хосте — в .env указывай
# host.docker.internal (резолвится через extra_hosts ниже), напр.:
#   PG_HOST=host.docker.internal
#   CH_HOST=host.docker.internal
#   REDIS_HOST=host.docker.internal
#   KAFKA_BROKERS=host.docker.internal:9092

name: nexus

# §112: потолок лога контейнера. Без него Docker пишет stdout/stderr драйвером
# json-file БЕЗ ограничения, и файл обнуляется только пересозданием контейнера
# (на бою nginx — 1.2 ГБ за 4 недели). Потолок = max-size × max-file, по
# умолчанию 250 МБ на контейнер; переопределяется из .env. Применяется только
# пересозданием контейнера (`up -d`), `restart` его не подхватывает. Якоря между
# файлами не видны — блок повторён в каждом compose-файле со своими
# контейнерами; расхождение значений ловит tests/deploy.
x-logging: &logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-50m}
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

services:

  receiver:
    build:
      context: ..
      dockerfile: deploy/docker/receiver.Dockerfile
    restart: unless-stopped
    logging: *logging
    # §93.5/§118.8: Docker обязан ждать дольше drain_sec + timeout_sec (5 + 30 с)
    # плюс сброс логов в ClickHouse; дефолт Docker — 10 с, и он оборвал бы дренаж.
    stop_grace_period: 45s
    env_file: ../.env
    depends_on:
      sender: { condition: service_started }
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks: [nexus_app_net]

  sender:
    build:
      context: ..
      dockerfile: deploy/docker/sender.Dockerfile
    restart: unless-stopped
    logging: *logging
    # §93.5/§118.8: Docker обязан ждать дольше drain_sec + timeout_sec (5 + 30 с)
    # плюс сброс логов в ClickHouse; дефолт Docker — 10 с, и он оборвал бы дренаж.
    stop_grace_period: 45s
    env_file: ../.env
    ports:
      - "9190:9190"
      - "9093:9091"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks: [nexus_app_net]

  web:
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
    restart: unless-stopped
    logging: *logging
    # §93.5/§118.8: Docker обязан ждать дольше drain_sec + timeout_sec (5 + 30 с)
    # плюс сброс логов в ClickHouse; дефолт Docker — 10 с, и он оборвал бы дренаж.
    stop_grace_period: 45s
    env_file: ../.env
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks: [nexus_app_net]

networks:
  nexus_app_net:
    driver: bridge
