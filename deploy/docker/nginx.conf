# Балансировщик реплик Nexus (§93). Внутри стека, перед web-* и receiver-*.
#
# Что здесь важно и почему — по пунктам, потому что каждый из них уже был бы
# инцидентом, если бы его забыли:
#
#   1. Боевой /api/v1/* уходит СРАЗУ в receiver, мимо web. Web — реверс-прокси
#      этого пути (adapter/in/http/receiver_proxy.go), и пока он стоял на
#      дороге, его выкат или падение роняли приём запросов. Прокси в Web
#      остаётся для replay §85 и dry-run §55 — там Web сам инициатор.
#   2. POST боевого трафика НЕ повторяется на второй реплике. `proxy_next_upstream`
#      для /api/v1/ намеренно оставлен дефолтным (без `non_idempotent`): повтор
#      POST'а, который апстрим уже мог принять, — это дубль доставки во внешнюю
#      систему, что хуже одиночного 502. Мёртвая реплика уходит из ротации по
#      max_fails за пару запросов, а на выкате её выводит rolling.sh ДО остановки.
#   3. Списки серверов лежат в /etc/nginx/dyn/*.conf и подменяются на лету:
#      rolling.sh помечает реплику `down`, делает `nginx -s reload` и только
#      потом её пересоздаёт. Reload у nginx безразрывный — текущие соединения
#      доигрывают на старых воркерах.
#   4. `nginx -s reload` после пересоздания реплики ОБЯЗАТЕЛЕН и по второй
#      причине: имена в upstream резолвятся при старте/reload, а пересозданный
#      контейнер получает новый IP. Без reload nginx будет слать на адрес,
#      которого больше нет.

worker_processes auto;

events {
	worker_connections 2048;
}

http {
	include       /etc/nginx/mime.types;
	default_type  application/octet-stream;

	# Docker embedded DNS. valid=10s — как быстро подхватывается новый адрес
	# пересозданного контейнера в местах, где имя резолвится в рантайме.
	resolver 127.0.0.11 valid=10s ipv6=off;

	sendfile      on;
	tcp_nopush    on;
	server_tokens off;

	# Тело sync-запроса — до 124 МиБ (receiver.max_body_bytes) плюс запас на
	# заголовки. Ниже этого значения клиент получает 413 от nginx, и в логах
	# шины запроса не будет вовсе.
	client_max_body_size 140m;
	client_body_timeout  300s;

	# Синхронный вызов живёт по таймауту внешнего узла — до 600 с. Дефолтные
	# 60 с оборвали бы его на середине.
	proxy_connect_timeout 5s;
	proxy_send_timeout    600s;
	proxy_read_timeout    600s;

	log_format nexus '$remote_addr $upstream_addr $status $request_time '
	                 '"$request" body=$body_bytes_sent ref=$http_x_request_id';
	access_log /dev/stdout nexus;
	error_log  /dev/stderr warn;

	upstream nexus_web {
		include /etc/nginx/dyn/web.conf;
		keepalive 32;
	}

	upstream nexus_receiver {
		include /etc/nginx/dyn/receiver.conf;
		keepalive 64;
	}

	# Общие заголовки апстримам. X-Forwarded-For обязателен: без него все
	# клиенты выглядят как адрес контейнера nginx, и client_host §67 вместе с
	# rate-limit по IP теряют смысл. Host передаётся как есть — на нём держится
	# CSRF-проверка Origin в Web.
	proxy_set_header Host              $host;
	proxy_set_header X-Real-IP         $remote_addr;
	proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Host  $host;

	# keep-alive до апстримов: без этих двух строк каждый запрос открывал бы
	# новое соединение к Go-сервису (§9.2 прямо требует keep-alive).
	proxy_http_version 1.1;
	proxy_set_header Connection "";

	server {
		listen 8000 default_server;

		# Здоровье самого балансировщика — для docker healthcheck. Путь с
		# префиксом nginx- намеренно: он не пересекается ни с API Web, ни с
		# маршрутами SPA.
		location = /nginx-health {
			access_log off;
			add_header Content-Type text/plain;
			return 200 "ok\n";
		}

		# ── Боевой трафик ────────────────────────────────────────────────────
		# Тело не буферизуется: 124 МиБ иначе оседают во временном файле nginx
		# перед отправкой, добавляя задержку и запись на диск. Побочно это
		# отключает повтор запроса на другой реплике — что для POST'ов шины и
		# требуется (см. пункт 2 в шапке).
		location /api/v1/ {
			proxy_pass http://nexus_receiver;
			proxy_request_buffering off;
			proxy_buffering         off;
		}

		# ── SSE: живой стрим логов узла (§77) ────────────────────────────────
		# Буферизация ответа здесь ломает саму суть стрима — события копятся в
		# буфере nginx и доезжают пачкой или не доезжают вовсе.
		location ~ ^/api/nodes/[^/]+/logs/stream$ {
			proxy_pass http://nexus_web;
			proxy_buffering    off;
			proxy_cache        off;
			proxy_read_timeout 3600s;
			chunked_transfer_encoding on;
		}

		# ── Панель, REST админки, SPA ────────────────────────────────────────
		location / {
			proxy_pass http://nexus_web;
			# GET-запросы панели идемпотентны — их повтор на второй реплике
			# безопасен и делает падение web-1 невидимым для оператора.
			proxy_next_upstream error timeout http_502 http_503 http_504;
			proxy_next_upstream_tries 2;
		}
	}

	# Прямой вход в Receiver — обратная совместимость с RECEIVER_BIND из
	# одиночной установки (DEPLOYMENT §5.3.1): там боевой трафик мог идти на
	# :8080 в обход панели. Тот же upstream, те же правила.
	server {
		listen 8080;

		location = /nginx-health {
			access_log off;
			add_header Content-Type text/plain;
			return 200 "ok\n";
		}

		location / {
			proxy_pass http://nexus_receiver;
			proxy_request_buffering off;
			proxy_buffering         off;
		}
	}
}
