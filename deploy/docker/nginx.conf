# Балансировщик реплик Nexus (§93). Внутри стека, перед web-* и receiver-*.
#
# Что здесь важно и почему — по пунктам, потому что каждый из них уже был бы
# инцидентом, если бы его забыли:
#
#   1. Боевой /api/v1/* уходит СРАЗУ в receiver, мимо web. Web — реверс-прокси
#      этого пути (adapter/in/http/receiver_proxy.go), и пока он стоял на
#      дороге, его выкат или падение роняли приём запросов. Прокси в Web
#      остаётся для replay §85 и dry-run §55 — там Web сам инициатор.
#   2. `proxy_next_upstream` для /api/v1/ оставлен ДЕФОЛТНЫМ (без `non_idempotent`),
#      и это ровно то, что нужно шине. Дефолт различает два случая:
#        * соединение с репликой не установилось (она мертва) — запрос уходит на
#          соседнюю даже методом POST, потому что апстрим его не видел; проверено
#          на стенде: 20 из 20 POST'ов при мёртвой реплике завершились успешно;
#        * запрос уже отправлен, и реплика умерла в процессе — повтора НЕ будет.
#          Здесь это единственно верное поведение: апстрим мог принять запрос и
#          начать доставку, а дубль во внешнюю систему хуже одиночного 502.
#      Добавлять `non_idempotent` нельзя — он снимает как раз вторую защиту.
#   3. Списки серверов лежат в /etc/nginx/dyn/*.conf и подменяются на лету:
#      rolling.sh помечает реплику `down`, делает `nginx -s reload` и только
#      потом её пересоздаёт. Reload у nginx безразрывный — текущие соединения
#      доигрывают на старых воркерах.
#   4. Апстримы объявлены с параметром `server … resolve` (см. nginx-upstreams.sh
#      и rolling.sh), поэтому nginx ПЕРЕРЕЗОЛВИВАЕТ адреса апстримов в рантайме
#      через `resolver` ниже (valid=10s), а не только при старте/reload. Это
#      снимает целый класс аварий: пересозданный `docker compose up -d` контейнер
#      web/receiver получает новый IP, и раньше без ручного `nginx -s reload`
#      nginx слал на исчезнувший адрес → 502 на весь `/api/v1/*` (инцидент kz
#      26.08.2026: одиночный nginx-профиль, rolling.sh нет, reload делать было
#      некому). Теперь новый IP подхватывается сам за ~valid. `resolve` требует
#      `zone` в upstream-блоке (объявлены ниже) и hostname в адресе (состав —
#      имена docker-сервисов). rolling.sh всё равно делает reload для мгновенного
#      вывода реплики из ротации — `resolve` его не заменяет, а страхует ручные и
#      вне-rolling пересоздания.

worker_processes auto;

events {
	worker_connections 2048;
}

http {
	include       /etc/nginx/mime.types;
	default_type  application/octet-stream;

	# Docker embedded DNS. valid=10s — как быстро подхватывается новый адрес
	# пересозданного контейнера в местах, где имя резолвится в рантайме.
	resolver 127.0.0.11 valid=10s ipv6=off;

	sendfile      on;
	tcp_nopush    on;
	server_tokens off;

	# ── Прозрачность запроса ─────────────────────────────────────────────────
	# Три директивы против дефолтов nginx, каждый из которых МОЛЧА меняет то,
	# что дойдёт до внешнего узла. Прямой вход в Receiver (одиночная установка)
	# ничего из этого не делал, поэтому без них §93 стал бы регрессом.
	#
	# 1. Заголовки с подчёркиванием (`X_Api_Key`). Дефолт `off` их ОТБРАСЫВАЕТ.
	#    Шина пробрасывает во внешний узел заголовки по allowlist узла (§24,
	#    pickForwardHeaders): заголовок, который сегодня доходит, просто исчез
	#    бы — и заметил бы это только принимающий сервис, а не оператор.
	underscores_in_headers on;
	#
	# 2. Размер строки заголовка. Дефолт (4 буфера по 8 КБ) отвечает 400 на
	#    крупную подпись или JWT в заголовке, тогда как Go принимает заголовки
	#    до 1 МБ. 8×32 КБ покрывает реальные ЭЦП-заголовки с запасом.
	large_client_header_buffers 8 32k;
	#
	# 3. Двойные слеши в пути. Дефолт `on` схлопывает `//` в `/`, а §39
	#    (path passthrough) отдаёт хвост пути во внешний URL как есть — путь
	#    изменился бы по дороге, и узел получил бы не то, что послал клиент.
	merge_slashes off;
	#
	# ignore_invalid_headers НЕ трогаем: он отбрасывает заголовки с
	# недопустимыми в HTTP символами в имени. Это защита, а не потеря.

	# Тело sync-запроса — до 124 МиБ (receiver.max_body_bytes) плюс запас на
	# заголовки. Ниже этого значения клиент получает 413 от nginx, и в логах
	# шины запроса не будет вовсе.
	client_max_body_size 140m;
	client_body_timeout  300s;

	# Синхронный вызов живёт по таймауту внешнего узла — до 600 с. Дефолтные
	# 60 с оборвали бы его на середине.
	proxy_connect_timeout 5s;
	proxy_send_timeout    600s;
	proxy_read_timeout    600s;

	# Путь боевого запроса в лог пишется ОБРЕЗАННЫМ: секрет часто лежит В ПУТИ, а
	# не в query (токен Telegram-бота POST /api/v1/telegram/bot<ТОКЕН>/getUpdates,
	# waInstance/ключ у green-api), поэтому отбрасывания query мало.
	#
	# Оставляем ТОЛЬКО ПЕРВЫЙ сегмент после /api/v1 (и сегмент-метод §78, если
	# он есть), всё дальше — под ***. Почему так грубо: фиксированным подсчётом
	# «команда/узел» надёжно обрезать нельзя —
	#   • короткая форма §78 без команды (`/api/v1/<узел>/<хвост>`) сдвигает
	#     токен в позицию, которую подсчёт принимал за «узел», и он утекал
	#     (найдено на бою nexus-kz 23.08.2026, первая версия правила его НЕ
	#     закрыла);
	#   • путь узла бывает многосегментным (`green/whatsapp`), и граница
	#     «узел↔хвост» не совпадает с числом слэшей.
	# Первым сегментом всегда идёт команда ИЛИ узел — секретом он не бывает,
	# поэтому его хватает, чтобы понять «куда шёл трафик», а токен не попадает в
	# лог ни при какой форме адреса. Полная детализация — в логе узла и журнале
	# отказов §94, балансировщику она не нужна.
	#
	# Порядок правил значим (первое совпадение). `/.` в хвосте требует хотя бы
	# один символ после слэша: без хвоста маскировать нечего — пусть идёт as-is.
	map $uri $nexus_log_uri {
		~^(/api/v1/(?:request|requestAsync|callback)/[^/]+)/.  "$1/***";
		~^(/api/v1/[^/]+)/.                                     "$1/***";
		default                                                 $uri;
	}

	# $request не используем: он несёт сырой URI вместе с query. Метод и версию
	# протокола пишем отдельными полями.
	log_format nexus '$remote_addr $upstream_addr $status $request_time '
	                 '"$request_method $nexus_log_uri $server_protocol" '
	                 'body=$body_bytes_sent ref=$http_x_request_id';
	access_log /dev/stdout nexus;

	# ГРАНИЦА ЗАЩИТЫ, названная явно. Обрезка выше действует только на
	# access_log. У error_log формат не настраивается вовсе, и при отказе
	# апстрима (таймаут, обрыв, 502) nginx пишет строку вида
	# `request: "POST /api/v1/... HTTP/1.1"` С ПОЛНЫМ путём и query. То есть
	# секрет в пути может попасть в stderr контейнера на ОШИБОЧНЫХ запросах.
	#
	# Поднимать уровень до crit, чтобы это подавить, — плохой размен: именно
	# warn показывает недоступность апстрима, ради которой лог и читают. Кому
	# нужен полный запрет, ставит error_log /dev/null crit; в своём override.
	#
	# Второе ограничение той же обрезки: она снимает ХВОСТ после «команда/узел».
	# Если секрет окажется в самом имени команды или узла (первые два сегмента),
	# он останется в логе — эти сегменты нужны для диагностики, и скрывать их
	# означало бы писать в лог один статус без адресата.
	error_log  /dev/stderr warn;

	# zone обязательна, и не ради красоты. Без неё каждый воркер nginx ведёт
	# СВОЙ счётчик неудач и своё состояние round-robin: на 12 воркерах мёртвую
	# реплику выводят из ротации 12 раз по max_fails, то есть до двух десятков
	# запросов успевают уйти в никуда вместо двух. Общая память делает и учёт
	# отказов, и раскладку запросов общими для всех воркеров.
	upstream nexus_web {
		zone nexus_web 64k;
		include /etc/nginx/dyn/web.conf;
		keepalive 32;
	}

	upstream nexus_receiver {
		zone nexus_receiver 64k;
		include /etc/nginx/dyn/receiver.conf;
		keepalive 64;
	}

	# Общие заголовки апстримам. X-Forwarded-For обязателен: без него все
	# клиенты выглядят как адрес контейнера nginx, и client_host §67 вместе с
	# rate-limit по IP теряют смысл.
	#
	# Host — именно $http_host (заголовок клиента ДОСЛОВНО), а не $host: тот
	# отдаёт только имя, без порта. CSRF-проверка Web сравнивает host из Origin
	# с заголовком Host (security_middleware.go), поэтому при входе на
	# нестандартный порт «localhost» против «localhost:8000» давало 403 на любой
	# мутирующий запрос — панель переставала работать целиком. Найдено стендом.
	proxy_set_header Host              $http_host;
	proxy_set_header X-Real-IP         $remote_addr;
	proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Host  $http_host;

	# keep-alive до апстримов: без этих двух строк каждый запрос открывал бы
	# новое соединение к Go-сервису (§9.2 прямо требует keep-alive).
	proxy_http_version 1.1;
	proxy_set_header Connection "";

	server {
		listen 8000 default_server;

		# Здоровье самого балансировщика — для docker healthcheck. Путь с
		# префиксом nginx- намеренно: он не пересекается ни с API Web, ни с
		# маршрутами SPA.
		location = /nginx-health {
			access_log off;
			add_header Content-Type text/plain;
			return 200 "ok\n";
		}

		# ── Боевой трафик ────────────────────────────────────────────────────
		# Тело не буферизуется: 124 МиБ иначе оседают во временном файле nginx
		# перед отправкой, добавляя задержку и запись на диск. Побочный эффект —
		# запрос с уже начатым телом повторить нельзя, и для POST'ов шины это
		# правильно (см. пункт 2 в шапке).
		location /api/v1/ {
			proxy_pass http://nexus_receiver;
			proxy_request_buffering off;
			proxy_buffering         off;
		}

		# ── SSE: живой стрим логов узла (§77) ────────────────────────────────
		# Буферизация ответа здесь ломает саму суть стрима — события копятся в
		# буфере nginx и доезжают пачкой или не доезжают вовсе.
		location ~ ^/api/nodes/[^/]+/logs/stream$ {
			proxy_pass http://nexus_web;
			proxy_buffering    off;
			proxy_cache        off;
			proxy_read_timeout 3600s;
			chunked_transfer_encoding on;
		}

		# ── Панель, REST админки, SPA ────────────────────────────────────────
		location / {
			proxy_pass http://nexus_web;
			# GET-запросы панели идемпотентны — их повтор на второй реплике
			# безопасен и делает падение web-1 невидимым для оператора.
			proxy_next_upstream error timeout http_502 http_503 http_504;
			proxy_next_upstream_tries 2;
		}
	}

	# Прямой вход в Receiver — обратная совместимость с RECEIVER_BIND из
	# одиночной установки (DEPLOYMENT §5.3.1): там боевой трафик мог идти на
	# :8080 в обход панели. Тот же upstream, те же правила.
	server {
		listen 8080;

		location = /nginx-health {
			access_log off;
			add_header Content-Type text/plain;
			return 200 "ok\n";
		}

		location / {
			proxy_pass http://nexus_receiver;
			proxy_request_buffering off;
			proxy_buffering         off;
		}
	}
}
