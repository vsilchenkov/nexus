# Nexus — конфиг для локальной отладки (Windows + docker-compose).
#
# Значения подключения к зависимостям подставляются из .env через
# ${VAR:default}. Дефолты соответствуют сервисам, поднятым в
# docker-compose.yml в корне репозитория (postgres / redis / clickhouse /
# kafka). При запуске под `cmd/* --debug` бинарь читает этот файл и
# подставляет переменные окружения; envFile из .vscode/launch.json
# поставляет реальные значения.
#
# Если меняешь имена переменных — синхронизируй с .env.example.

build:
  project_name: nexus
  version: ${VERSION:dev}

logging:
  level: 5              # debug
  output_in_file: false
  dir: logs
  debug: true

sentry:
  use: ${SENTRY_USE:false}
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:dev}
  level: 2
  attach_stacktrace: true
  enable_tracing: false
  traces_sample_rate: 0.0
  debug: false

otel:
  enable:        ${OTEL_ENABLE:false}
  otlp_endpoint: ${OTEL_OTLP_ENDPOINT:localhost:4318}
  otlp_insecure: ${OTEL_OTLP_INSECURE:true}
  sample_rate:   ${OTEL_SAMPLE_RATE:0.1}
  service_name:  ${OTEL_SERVICE_NAME:}
  environment:   ${OTEL_ENVIRONMENT:dev}

postgres:
  host: ${PG_HOST:localhost}
  port: ${PG_PORT:5432}
  database: ${PG_DATABASE:postgres}
  user: ${PG_USER:postgres}
  password: ${PG_PASSWORD:vOkjDn}
  max_open_conns: 10
  max_idle_conns: 2
  conn_max_lifetime_min: 30

redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  db: ${REDIS_DB:0}
  username: ${REDIS_USER:sa}
  password: ${REDIS_PASSWORD:I2MV5s}
  pool_size: 10
  min_idle_conns: 2
  dial_timeout_ms: 2000
  read_timeout_ms: 1000
  write_timeout_ms: 1000
  node_ttl_sec: 60
  session_ttl_sec: 3600
  ratelimit_window_sec: 60

clickhouse:
  # ВАЖНО: TCP-порт ClickHouse в docker-compose проброшен как 19000:9000.
  # HTTP-порт — 18123:8123 (не используется коннектором clickhouse-go).
  host: ${CH_HOST:localhost}
  port: ${CH_PORT:19000}
  database: ${CH_DATABASE:nexus_default}
  user: ${CH_USER:default}
  password: ${CH_PASSWORD:}
  batch_size: 100
  flush_interval_sec: 2
  buffer_max_size: 10000
  workers: 1

kafka:
  brokers: ${KAFKA_BROKERS:localhost:9092}
  async_topic: nexus.async
  dlq_topic: nexus.async.dlq
  consumer_group: nexus-sender-dev
  topic:
    partitions: 1
    # single-broker docker-compose → RF=1, ISR=1 (см. примечание в
    # config.example.yml). Любое больше — InvalidReplicationFactor.
    replication_factor: ${KAFKA_TOPIC_REPLICATION_FACTOR:1}
    min_insync_replicas: ${KAFKA_TOPIC_MIN_INSYNC_REPLICAS:1}
    retention_ms: 2592000000
    retention_bytes: -1
    segment_ms: 86400000
    cleanup_policy: delete
    compression_type: lz4
    max_message_bytes: 10485760
  producer:
    acks: all
    compression_type: lz4
    linger_ms: 5
    batch_size: 65536
    buffer_memory: 16777216
    retries: 2147483647
    delivery_timeout_ms: 60000
    enable_idempotence: true
    max_in_flight_requests: 5
    request_timeout_ms: 10000
  consumer:
    auto_offset_reset: earliest
    enable_auto_commit: false
    fetch_min_bytes: 1
    fetch_max_bytes: 52428800
    max_partition_fetch_bytes: 10485760
    session_timeout_ms: 30000
    heartbeat_interval_ms: 10000
    max_poll_records: 100
    max_poll_interval_ms: 300000
    isolation_level: read_committed
    instances: 1

receiver:
  http_addr: :8080
  read_timeout_ms: 60000
  # Должен превышать максимальный timeout_ms узла (600000) — иначе долгий
  # sync-запрос рвётся Receiver'ом до записи ответа (Web-прокси видит EOF).
  write_timeout_ms: 610000
  idle_timeout_sec: 120
  max_body_bytes: 5242880
  max_header_bytes: 1048576
  rate_limit_per_node: 0
  sender_grpc:
    addr: localhost:9190
    pool_size: 2
    timeout_ms: 60000
    keepalive_time_sec: 30
    keepalive_timeout_sec: 10
  swagger_enabled: true

sender:
  grpc_addr: :9190
  admin_http_addr: :9091
  grpc_max_concurrent_streams: 100
  http_client:
    timeout_ms: 60000
    max_idle_conns: 20
    max_idle_conns_per_host: 5
    idle_conn_timeout_sec: 90
    dial_timeout_ms: 5000
    tls_handshake_timeout_ms: 5000
  workers: 10

web:
  http_addr: :8000
  session_cookie_name: nexus_session
  session_cookie_secure: false
  session_cookie_samesite: lax
  audit_retention_days: 30
  replay_rate_limit_per_user_per_min: 100
  nodes_soft_limit: 1000
  nodes_hard_limit: 5000
  api_token_rate_limit_per_min: 1000
  swagger_enabled: true
  receiver_url: ${RECEIVER_URL:http://localhost:8080}
