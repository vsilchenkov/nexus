# Nexus — основной конфиг.
# Этот файл — шаблон. Реальный config.yml в git не коммитится.
# Все секреты подставляются из .env через ${VAR} / ${VAR:default}.

build:
  project_name: nexus
  version: ${VERSION:dev}

logging:
  level: 4              # 2=error, 3=warn, 4=info, 5=debug
  output_in_file: false
  dir: logs
  debug: false

sentry:
  use: ${SENTRY_USE:false}
  dsn: ${SENTRY_DSN}
  environment: ${SENTRY_ENVIRONMENT:production}
  level: 2
  attach_stacktrace: true
  enable_tracing: true
  traces_sample_rate: 0.1
  debug: false

# OpenTelemetry distributed tracing (§16 ТЗ, Phase 8.2).
# При enable=false полный no-op: global TracerProvider не устанавливается,
# Init не пытается коннектиться к collector'у, GinMiddleware пропускает
# запрос без span'а. OTLP-экспорт по HTTP (POST /v1/traces).
otel:
  enable:        ${OTEL_ENABLE:false}
  otlp_endpoint: ${OTEL_OTLP_ENDPOINT:otel-collector:4318}
  otlp_insecure: ${OTEL_OTLP_INSECURE:true}     # production: false + valid TLS
  sample_rate:   ${OTEL_SAMPLE_RATE:0.1}        # 0.0..1.0 — head-based ratio sampler
  service_name:  ${OTEL_SERVICE_NAME:}          # пусто → берётся имя бинаря
  environment:   ${OTEL_ENVIRONMENT:production}

postgres:
  host: ${PG_HOST:postgres}
  port: ${PG_PORT:5432}
  database: nexus
  user: ${PG_USER:nexus}
  password: ${PG_PASSWORD}
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime_min: 30

redis:
  host: ${REDIS_HOST:redis}
  port: ${REDIS_PORT:6379}
  db: 0
  password: ${REDIS_PASSWORD}
  pool_size: 50
  min_idle_conns: 10
  dial_timeout_ms: 2000
  read_timeout_ms: 500
  write_timeout_ms: 500
  node_ttl_sec: 300
  session_ttl_sec: 86400
  ratelimit_window_sec: 60

clickhouse:
  host: ${CH_HOST:clickhouse}
  port: ${CH_PORT:9000}
  database: vika_logs
  user: ${CH_USER:default}
  password: ${CH_PASSWORD}
  batch_size: 500
  flush_interval_sec: 5
  buffer_max_size: 100000
  workers: 2

kafka:
  brokers: ${KAFKA_BROKERS:kafka:9092}
  async_topic: nexus.async
  dlq_topic: nexus.async.dlq
  consumer_group: nexus-sender
  topic:
    partitions: 4
    # Дефолты — для multi-broker prod-кластера. На single-broker (локальный
    # docker-compose, CI loadtest) переопределяй через env: RF=1, ISR=1 —
    # иначе EnsureTopics зависнет/упадёт на InvalidReplicationFactor.
    replication_factor: ${KAFKA_TOPIC_REPLICATION_FACTOR:3}
    min_insync_replicas: ${KAFKA_TOPIC_MIN_INSYNC_REPLICAS:2}
    retention_ms: 2592000000   # 30 дней
    retention_bytes: -1
    segment_ms: 86400000       # 1 день
    cleanup_policy: delete
    compression_type: lz4
    max_message_bytes: 10485760
  producer:
    acks: all
    compression_type: lz4
    linger_ms: 5
    batch_size: 65536
    buffer_memory: 33554432
    retries: 2147483647
    delivery_timeout_ms: 120000
    enable_idempotence: true
    max_in_flight_requests: 5
    request_timeout_ms: 30000
  consumer:
    auto_offset_reset: earliest
    enable_auto_commit: false
    fetch_min_bytes: 1
    fetch_max_bytes: 52428800
    max_partition_fetch_bytes: 10485760
    session_timeout_ms: 30000
    heartbeat_interval_ms: 10000
    max_poll_records: 500
    max_poll_interval_ms: 300000
    isolation_level: read_committed
    instances: 4

receiver:
  http_addr: :8080
  read_timeout_ms: 10000
  write_timeout_ms: 10000
  idle_timeout_sec: 120
  max_body_bytes: 5242880
  max_header_bytes: 1048576
  rate_limit_per_node: 0
  sender_grpc:
    addr: sender:9090
    pool_size: 8
    timeout_ms: 30000
    keepalive_time_sec: 30
    keepalive_timeout_sec: 10
  swagger_enabled: false
  # In-memory L2-кеш конфига узлов (§9.2). Снимает нагрузку с Redis на
  # пиковом RPS и спасает при кратковременном Redis-flutter'е. При
  # одновременной недоступности Redis и PG (§9.4 крайний случай) возвращает
  # протухшую запись в пределах stale_ttl_ms.
  l2_cache:
    enabled: false
    size: 1000
    ttl_ms: 2000
    stale_ttl_ms: 60000

sender:
  grpc_addr: :9090
  admin_http_addr: :9091
  grpc_max_concurrent_streams: 1000
  http_client:
    timeout_ms: 30000
    max_idle_conns: 100
    max_idle_conns_per_host: 20
    idle_conn_timeout_sec: 90
    dial_timeout_ms: 5000
    tls_handshake_timeout_ms: 5000
  workers: 50

web:
  http_addr: :8000
  session_cookie_name: nexus_session
  session_cookie_secure: true
  session_cookie_samesite: strict
  audit_retention_days: 365
  replay_rate_limit_per_user_per_min: 10
  nodes_soft_limit: 10000
  nodes_hard_limit: 50000
  api_token_rate_limit_per_min: 100
  swagger_enabled: false
