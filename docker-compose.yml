# Nexus — ОСНОВНОЙ прод-стек (внешний только ClickHouse).
#
# Лежит в корне проекта намеренно: запускается стандартной командой без `-f`,
# не нужно помнить, какой именно compose-файл прод. Поднимает PostgreSQL + Redis
# + Kafka + Prometheus + три сервиса Nexus, БЕЗ контейнера ClickHouse. Адрес/
# логин/пароль внешнего CH задаются через .env (CH_HOST, CH_PORT, CH_USER,
# CH_PASSWORD).
#
# Запуск (из корня проекта):
#   docker compose up -d --build
# Остановить:
#   docker compose down
#
# Конфиг приложения config/config.yml монтируется в три сервиса поверх зашитого
# в образ /app/config/config.yml — правьте config/config.yml на хосте и
# перезапускайте сервисы, образ пересобирать не нужно. Плейсхолдеры ${VAR}
# в нём подставляются из .env.
#
# Если внешний ClickHouse крутится на самом docker-хосте — в .env укажи
#   CH_HOST=host.docker.internal
# (резолвится через extra_hosts у sender/web ниже).
#
# ЕДИНАЯ ТОЧКА ВХОДА ЧЕРЕЗ nginx (необязательно, с 1.31.1). Этот файл сам по
# себе публикует наружу web:8000 и receiver:8080. Чтобы вход шёл через
# балансировщик — как в профиле §93, но БЕЗ пар реплик и без роста памяти —
# подключите вторым `-f`:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.nginx.yml \
#                  -f docker-compose.override.yml up -d --build
# Тогда 8000/8080 занимает nginx, а web/receiver публикацию портов теряют
# (deploy/docker-compose.nginx.yml). Боевой /api/v1/* при этом идёт сразу в
# Receiver, минуя Web. Локальный docker-compose.override.yml при ЯВНЫХ `-f` сам
# НЕ подхватывается — указывайте его последним.
#
# Привязка публикуемых портов задаётся WEB_BIND / RECEIVER_BIND из .env; по
# умолчанию обе 0.0.0.0, то есть поведение прежнее.
#
# Прочие варианты установки (всё в Docker / все зависимости внешние) и запуск
# готовых образов из registry — в deploy/ и DEPLOYMENT.md.

name: nexus

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-nexus}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-nexus}
      POSTGRES_DB: nexus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-nexus} -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [nexus_net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [nexus_net]

  kafka:
    # §75: собственный образ = apache/kafka + Prometheus JMX-агент (deploy/docker/
    # kafka.Dockerfile). Размер топика на диске есть ТОЛЬКО в JMX брокера, поэтому
    # без агента колонка «Размер» на экране /kafka остаётся прочерком. jar лежит
    # в репозитории (deploy/vendor/), сеть при сборке не нужна; другая версия или
    # зеркало — через JMX_AGENT_SRC (см. комментарий в Dockerfile). Применение
    # требует ПЕРЕСОЗДАНИЯ контейнера
    # (javaagent грузится только при старте JVM) → брокер недоступен 30–60 с.
    build:
      context: .
      dockerfile: deploy/docker/kafka.Dockerfile
    image: nexus-kafka:latest
    restart: unless-stopped
    environment:
      # §75: JMX-агент отдаёт /metrics на 7071 внутри сети (наружу не публикуем —
      # ходит только Prometheus, job `kafka-jmx` в deploy/prometheus.yml).
      KAFKA_OPTS: "-javaagent:/opt/jmx/agent.jar=7071:/opt/jmx/kafka.yml"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: "4"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      # Брокерский потолок размера сообщения. Per-topic max.message.bytes
      # (CreateTopics из config.yml) его НЕ перекрывает: брокер режет по меньшему
      # из двух, и топик, созданный с бо́льшим лимитом, всё равно отвергнет
      # крупное сообщение ("Message Size Too Large") — причём уже после того, как
      # Receiver ответил клиенту. Поэтому здесь значение обязано быть НЕ НИЖЕ
      # kafka.topic.max_message_bytes из config.yml.
      #
      # 16 МиБ = receiver.max_async_body_bytes (10 МиБ) × 1.33 (base64
      # async-envelope) + запас на заголовки конверта. SYNC-тело (124 МиБ) сюда
      # не попадает вовсе: синхронный путь очередь не использует, его потолок —
      # sender.grpc_max_message_bytes. replica.fetch.max.bytes — для репликации
      # при RF>1 (для single-broker не вредит).
      KAFKA_MESSAGE_MAX_BYTES: "16777216"
      KAFKA_REPLICA_FETCH_MAX_BYTES: "16777216"
      # Брокерный дефолт retention. Топики nexus.* создаются приложением с ЯВНЫМ
      # конфигом (config.yml kafka.topic → CreateTopics), поэтому эти значения —
      # запасной потолок для любых прочих/авто-топиков и держат брокер согласованным
      # с топик-конфигом: 7 дней и 40 ГиБ на партицию (log.retention.bytes — per-partition).
      KAFKA_LOG_RETENTION_MS: "604800000"
      KAFKA_LOG_RETENTION_BYTES: "42949672960"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      # JVM heap брокера. Значение по умолчанию совпадает с тем, что подставляет
      # сам kafka-server-start.sh, если переменная не задана, — фиксируем его
      # явно, чтобы бюджет памяти был виден в конфиге и переопределялся из .env.
      # На сервере 2 ГБ ставьте -Xmx512m -Xms256m (см. DEPLOYMENT.md §5.4):
      # с дефолтным 1 ГБ heap контейнер дорастает до ~1.2 ГБ RSS.
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xmx1G -Xms1G}
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "9092:9092"
    healthcheck:
      # §75: `KAFKA_OPTS=` обязателен. Переменная окружения контейнера действует
      # и на CLI-утилиты (они запускаются тем же kafka-run-class.sh), поэтому
      # утилита пыталась бы поднять СВОЙ JMX-агент на уже занятом брокером порту
      # 7071, падала бы с «Prometheus JMX Exporter exiting» и exit 1. Итог без
      # сброса: брокер вечно unhealthy → sender (depends_on service_healthy)
      # не стартует вообще.
      # `KAFKA_HEAP_OPTS=` — по той же причине: разовая CLI-утилита наследовала бы
      # бюджет памяти БРОКЕРА. Замер на стенде (kafka-topics.sh --list): с
      # `-Xmx1G -Xms1G` пик 122 МБ RSS против 91 МБ с дефолтом утилит, +60 мс —
      # то есть `-Xms` коммитит адресное пространство (VSZ 2.6 ГБ против 2.1 ГБ),
      # но физические страницы за ~1.2 с жизни процесса не трогаются. Разница
      # невелика, однако на сервере 2 ГБ (§5.4) она идёт поверх брокера каждые
      # 10 секунд, а при строгом overcommit (vm.overcommit_memory=2) гигабайтный
      # коммит вообще может не дать утилите стартовать. Пустое значение
      # возвращает kafka-run-class.sh к дефолту для утилит (-Xmx256M).
      test: ["CMD-SHELL", "KAFKA_OPTS= KAFKA_HEAP_OPTS= /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [nexus_net]

  prometheus:
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-90d}
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus.alerts.yml:/etc/prometheus/prometheus.alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    networks: [nexus_net]

  receiver:
    build:
      context: .
      dockerfile: deploy/docker/receiver.Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      sender:   { condition: service_started }
    ports:
      - "${RECEIVER_BIND:-0.0.0.0}:8080:8080"
    volumes:
      - ./config/config.yml:/app/config/config.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks: [nexus_net]

  sender:
    build:
      context: .
      dockerfile: deploy/docker/sender.Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      kafka:    { condition: service_healthy }
    ports:
      - "9190:9190"
      - "9093:9091"
    volumes:
      - ./config/config.yml:/app/config/config.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks: [nexus_net]

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    ports:
      - "${WEB_BIND:-0.0.0.0}:8000:8000"
    volumes:
      - ./config/config.yml:/app/config/config.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks: [nexus_net]

  # ── Балансировщик (профиль "nginx", по умолчанию ВЫКЛЮЧЕН) ────────────────
  #
  # Единая точка входа перед одиночными web/receiver: боевой /api/v1/* уходит
  # СРАЗУ в Receiver, минуя Web (§93.3), а заголовки не теряются молча
  # (underscores_in_headers, large_client_header_buffers, merge_slashes off).
  # Реплики при этом по-прежнему по одной — это подготовка к §93, а не он сам.
  #
  # ВКЛЮЧЕНИЕ — ДВА действия, и оба обязательны:
  #   1) активировать профиль:  COMPOSE_PROFILES=nginx в .env
  #      (или --profile nginx в каждой команде);
  #   2) подключить оверлей, снимающий публикацию портов у web/receiver:
  #      COMPOSE_FILE=docker-compose.yml:deploy/docker-compose.nginx.yml:docker-compose.override.yml
  #
  # Почему двумя частями, а не одним профилем: профиль решает, поднимать ли
  # сервис, но НЕ меняет поля соседних сервисов. Снять у web/receiver
  # публикацию 8000/8080 умеет только оверлей (`ports: !override []`), а без
  # этого docker откажет балансировщику: «port is already allocated».
  #
  # ⚠️ Включить профиль и ЗАБЫТЬ оверлей — самая вероятная ошибка: стек не
  # поднимется, потому что порт 8000 уже занят контейнером web.
  nginx:
    profiles: ["nginx"]
    build:
      context: .
      dockerfile: deploy/docker/nginx.Dockerfile
    image: nexus-nginx:latest
    restart: unless-stopped
    environment:
      # Тот же скрипт генерации upstream'ов, что и в §93, просто список из
      # одного адреса.
      NEXUS_WEB_UPSTREAMS: "web:8000"
      NEXUS_RECEIVER_UPSTREAMS: "receiver:8080"
      # Единственный backend выводить из ротации некуда: при max_fails=2
      # разовый таймаут узла отправил бы его в down на 10 секунд, и шина
      # отвечала бы 502 на всё подряд. 0 = «не выводить».
      NEXUS_UPSTREAM_MAX_FAILS: "0"
      NEXUS_UPSTREAM_FAIL_TIMEOUT: "10s"
    depends_on:
      web:      { condition: service_healthy }
      receiver: { condition: service_healthy }
    ports:
      - "${WEB_BIND:-0.0.0.0}:8000:8000"
      - "${RECEIVER_BIND:-127.0.0.1}:8080:8080"
    healthcheck:
      # 127.0.0.1, а НЕ localhost: nginx слушает только IPv4, а localhost в
      # контейнере резолвится сначала в ::1 — busybox-wget уходит в IPv6 и
      # получает Connection refused при полностью рабочем сервере.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    # По умолчанию потолок НЕ задан: на ядрах без swapaccount=1 docker печатает
    # «Your kernel does not support swap limit capabilities» на каждый
    # контейнер с mem_limit. Нужен лимит — NGINX_MEM_LIMIT=64m в .env.
    mem_limit: ${NGINX_MEM_LIMIT:-0}
    networks: [nexus_net]

networks:
  nexus_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  prometheus_data:
