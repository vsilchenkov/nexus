# Nexus — ОСНОВНОЙ прод-стек (внешний только ClickHouse).
#
# Лежит в корне проекта намеренно: запускается стандартной командой без `-f`,
# не нужно помнить, какой именно compose-файл прод. Поднимает PostgreSQL + Redis
# + Kafka + Prometheus + три сервиса Nexus, БЕЗ контейнера ClickHouse. Адрес/
# логин/пароль внешнего CH задаются через .env (CH_HOST, CH_PORT, CH_USER,
# CH_PASSWORD).
#
# Запуск (из корня проекта):
#   docker compose up -d --build
# Остановить:
#   docker compose down
#
# Конфиг приложения config/config.yml монтируется в три сервиса поверх зашитого
# в образ /app/config/config.yml — правьте config/config.yml на хосте и
# перезапускайте сервисы, образ пересобирать не нужно. Плейсхолдеры ${VAR}
# в нём подставляются из .env.
#
# Если внешний ClickHouse крутится на самом docker-хосте — в .env укажи
#   CH_HOST=host.docker.internal
# (резолвится через extra_hosts у sender/web ниже).
#
# Прочие варианты установки (всё в Docker / все зависимости внешние) и запуск
# готовых образов из registry — в deploy/ и DEPLOYMENT.md.

name: nexus

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-nexus}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-nexus}
      POSTGRES_DB: nexus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-nexus} -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [nexus_net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [nexus_net]

  kafka:
    # §75: собственный образ = apache/kafka + Prometheus JMX-агент (deploy/docker/
    # kafka.Dockerfile). Размер топика на диске есть ТОЛЬКО в JMX брокера, поэтому
    # без агента колонка «Размер» на экране /kafka остаётся прочерком. Сборка тянет
    # jar с Maven Central — если оттуда нет доступа, переопредели JMX_AGENT_URL
    # (см. комментарий в Dockerfile). Применение требует ПЕРЕСОЗДАНИЯ контейнера
    # (javaagent грузится только при старте JVM) → брокер недоступен 30–60 с.
    build:
      context: .
      dockerfile: deploy/docker/kafka.Dockerfile
    image: nexus-kafka:latest
    restart: unless-stopped
    environment:
      # §75: JMX-агент отдаёт /metrics на 7071 внутри сети (наружу не публикуем —
      # ходит только Prometheus, job `kafka-jmx` в deploy/prometheus.yml).
      KAFKA_OPTS: "-javaagent:/opt/jmx/agent.jar=7071:/opt/jmx/kafka.yml"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: "4"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      # Брокерский потолок размера сообщения — запасной, per-topic max.message.bytes
      # (CreateTopics из config.yml) его перекрывает для топиков nexus.*. Держим ≥
      # kafka.topic.max_message_bytes: 16 МиБ = receiver.max_body_bytes (10 МиБ, §68
      # multipart) × 1.33 (base64 async-envelope) + запас. replica.fetch.max.bytes —
      # для репликации при RF>1 (для single-broker не вредит).
      KAFKA_MESSAGE_MAX_BYTES: "16777216"
      KAFKA_REPLICA_FETCH_MAX_BYTES: "16777216"
      # Брокерный дефолт retention. Топики nexus.* создаются приложением с ЯВНЫМ
      # конфигом (config.yml kafka.topic → CreateTopics), поэтому эти значения —
      # запасной потолок для любых прочих/авто-топиков и держат брокер согласованным
      # с топик-конфигом: 7 дней и 40 ГиБ на партицию (log.retention.bytes — per-partition).
      KAFKA_LOG_RETENTION_MS: "604800000"
      KAFKA_LOG_RETENTION_BYTES: "42949672960"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "9092:9092"
    healthcheck:
      # §75: `KAFKA_OPTS=` обязателен. Переменная окружения контейнера действует
      # и на CLI-утилиты (они запускаются тем же kafka-run-class.sh), поэтому
      # утилита пыталась бы поднять СВОЙ JMX-агент на уже занятом брокером порту
      # 7071, падала бы с «Prometheus JMX Exporter exiting» и exit 1. Итог без
      # сброса: брокер вечно unhealthy → sender (depends_on service_healthy)
      # не стартует вообще.
      test: ["CMD-SHELL", "KAFKA_OPTS= /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [nexus_net]

  prometheus:
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-90d}
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus.alerts.yml:/etc/prometheus/prometheus.alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    networks: [nexus_net]

  receiver:
    build:
      context: .
      dockerfile: deploy/docker/receiver.Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      sender:   { condition: service_started }
    ports:
      - "8080:8080"
    volumes:
      - ./config/config.yml:/app/config/config.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks: [nexus_net]

  sender:
    build:
      context: .
      dockerfile: deploy/docker/sender.Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      kafka:    { condition: service_healthy }
    ports:
      - "9190:9190"
      - "9093:9091"
    volumes:
      - ./config/config.yml:/app/config/config.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks: [nexus_net]

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    ports:
      - "8000:8000"
    volumes:
      - ./config/config.yml:/app/config/config.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    networks: [nexus_net]

networks:
  nexus_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  prometheus_data:
